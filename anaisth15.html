<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic MCQ: Local Anesthetics & Neural Channels</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --correct-bg: rgba(34, 197, 94, 0.2);
            --correct-border: rgba(34, 197, 94, 0.5);
            --wrong-bg: rgba(239, 68, 68, 0.2);
            --wrong-border: rgba(239, 68, 68, 0.5);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-color), #1e293b);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-blue);
            transition: width 0.4s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.2rem;
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .option-btn:hover:not(.locked) {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .option-btn.locked {
            cursor: default;
            pointer-events: none;
        }

        .option-btn.correct {
            background: var(--correct-bg);
            border-color: var(--correct-border);
        }

        .option-btn.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong-border);
        }

        .option-letter {
            font-weight: bold;
            color: var(--accent-blue);
            min-width: 24px;
        }

        .feedback-panel {
            margin-top: 2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }

        .feedback-panel.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .feedback-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .next-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            float: right;
            transition: background 0.3s ease;
        }

        .next-btn:hover {
            background: #0ea5e9;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        
        .score-display {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="header">
            <span id="questionCounter">Ερώτηση 1 / 20</span>
            <span>Ιατρική / Οδοντιατρική</span>
        </div>

        <div id="quizContent">
            <div class="question-text" id="questionText">Φόρτωση ερώτησης...</div>
            <div class="options-grid" id="optionsGrid">
                <!-- Τα κουμπιά παράγονται δυναμικά μέσω JS -->
            </div>
            
            <div class="feedback-panel clearfix" id="feedbackPanel">
                <div class="feedback-text" id="feedbackText"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Επόμενη Ερώτηση</button>
            </div>
        </div>

        <div class="score-display" id="scoreDisplay">
            <!-- Εμφάνιση τελικού σκορ -->
        </div>
    </div>

    <script>
        // Array 20 ερωτήσεων.
        // Κατανομή Σωστών: 1=A(0), 2=B(1), 3=C(2), 4=D(3), 5=A(0), 6=B(1) κ.ο.κ.
        const mcqData = [
            {
                id: 1,
                question: "Ποιος είναι ο ακριβής ρόλος του τμήματος S4 και της θηλιάς μεταξύ D3-D4 στα τασεο-εξαρτώμενα κανάλια νατρίου αντίστοιχα;",
                options: [
                    "Λειτουργεί ως αισθητήρας τάσης με θετικά αμινοξέα, ενώ η θηλιά λειτουργεί ως πύλη αδρανοποίησης του ανοιχτού πόρου.",
                    "Αποτελεί το φίλτρο επιλογής διόδου των ιόντων, ενώ η θηλιά λειτουργεί ως δομικός σταθεροποιητής του κυτταρικού διαύλου.",
                    "Προκαλεί την αδρανοποίηση του καναλιού ταχύτατα, ενώ η θηλιά εξασφαλίζει την επιλεκτική διέλευση μορίων του τοπικού αναισθητικού.",
                    "Διαμορφώνει την πύλη ενεργοποίησης του διαύλου, ενώ η θηλιά αποτελεί τη βασική θέση δέσμευσης των τοπικών αναισθητικών."
                ],
                correct: 0,
                feedback: "α) Σωστό: Το S4 απαντά στις αλλαγές δυναμικού (αισθητήρας) και η θηλιά D3-D4 διπλώνει αποκλείοντας τον πόρο. β) Λάθος: Το S5-S6 είναι το φίλτρο επιλογής, ενώ η θέση δέσμευσης των αναισθητικών είναι στο S6 του D4. γ) Παραπομπή: Κεφάλαιο 3, Α. Τασεο-εξαρτώμενα κανάλια νατρίου."
            },
            {
                id: 2,
                question: "Η «λειτουργική εξάρτηση» (use-dependence) των τοπικών αναισθητικών στα τασεο-εξαρτώμενα κανάλια νατρίου πρακτικά συνεπάγεται ότι το μόριο του φαρμάκου:",
                options: [
                    "Επιδεικνύει μέγιστη ικανότητα δέσμευσης όταν το κανάλι ιόντων βρίσκεται σε πλήρως αδρανοποιημένη ή σε ανασταλμένη κατάσταση.",
                    "Συνδέεται ταχύτερα και με υψηλότερη συνάφεια όταν το κανάλι ιόντων βρίσκεται σε ανοιχτή και ενεργή κατάσταση.",
                    "Αποκτά πρόσβαση στον ενδοκυττάριο υποδοχέα αποκλειστικά όταν το κανάλι ιόντων παραμένει στην αρχική του κατάσταση ηρεμίας.",
                    "Ανταγωνίζεται τα μόρια του ασβεστίου για την ίδια θέση υποδοχέα όταν το κανάλι βρίσκεται σε ηρεμία."

                feedback: "α) Σωστό: Τα τοπικά αναισθητικά δρουν πιο αποτελεσματικά σε ανοιχτά κανάλια, διότι η πρόσβαση στον υποδοχέα είναι ευχερέστερη. β) Λάθος: Στην κατάσταση ηρεμίας ή αδρανοποίησης η σύνδεση γίνεται με πολύ αργό ρυθμό και με αρκετά χαμηλότερη συνάφεια. γ) Παραπομπή: Κεφάλαιο 4, Α. Δράσεις στα τασεο-εξαρτώμενα κανάλια νατρίου."

            {

                    "Συνδέονται στην εξωκυττάρια επιφάνεια του νευρώνα κάνοντας το δυναμικό πιο αρνητικό και διευκολύνοντας τη συνεχή ροή των ιόντων.",
                    "Εκτοπίζουν τα δεσμευμένα ασβέστια σχηματίζοντας σταθερότερους δεσμούς, καθιστούν το δυναμικό θετικότερο και αυξάνουν τον ουδό πυροδότησης του ερεθίσματος.",

                correct: 2,
                feedback: "α) Σωστό: Ανταγωνίζονται το Ca++, σταθεροποιούν τη μεμβράνη κάνοντας το δυναμικό θετικότερο (RNH+) και αποτρέπουν την είσοδο Na+. β) Λάθος: Δεν κάνουν το δυναμικό αρνητικό, ούτε αυξάνουν τη διεγερσιμότητα, και η διόγκωση περιγράφει τη δράση μη ιονισμένων μορίων. γ) Παραπομπή: Κεφάλαιο 4, ΣΤ. Δράσεις στη νευρική μεμβράνη."

            {
                id: 4,

                    "Η ταχεία ενδοαγγειακή απορρόφηση λόγω αγγειοδιαστολής και η αναστολή παραγωγής ψευδοχολινεστεράσης από το ήπαρ λόγω υπερδοσολογίας του αναισθητικού.",

            {

                question: "Σε παιδί 20 kg, η μέγιστη επιτρεπόμενη δόση λιδοκαΐνης 2% με αδρεναλίνη 1:100.000 είναι 4,4 mg/kg. Πόσες φύσιγγες (1,8 ml) επιτρέπονται;",

                    "Η συνολική μέγιστη δόση υπολογίζεται στα ογδόντα οκτώ χιλιοστόγραμμα, συνεπώς επιτρέπεται η χορήγηση ακριβώς τεσσάρων και μισής φυσίγγων.",

                    "Η συνολική μέγιστη δόση υπολογίζεται στα εκατόν δέκα χιλιοστόγραμμα, συνεπώς επιτρέπεται η χορήγηση ακριβώς τριών και μισής φυσίγγων."

                correct: 0,
                feedback: "α) Σωστό: 20kg × 4,4mg/kg = 88mg. Κάθε φύσιγγα 2% (20mg/ml) περιέχει 36mg. Άρα 88/36 = 2,44 (2,5 φύσιγγες). β) Λάθος: Οι αριθμοί 4.5, 1.5, και 3.5 φύσιγγες προκύπτουν από εντελώς λανθασμένο υπολογισμό είτε της συνολικής δόσης είτε της περιεκτικότητας της φύσιγγας. γ) Παραπομπή: Κεφάλαιο 4, Α. Μέγιστη επιτρεπόμενη δόση."

                    "Εξασφαλίζει την αυτόματη αύξηση της διάρκειας της αναισθησίας πέραν των τριών ωρών σε κάθε παιδιατρική επέμβαση.",

            {

                options: [

                    "Η αποκλειστική χρήση αναισθητικών μεγίστης διάρκειας χωρίς αγγειοσυσπαστικό σε κάθε οδοντική θεραπεία.",

        let currentIndex = 0;
        let score = 0;

        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackPanel = document.getElementById('feedbackPanel');
        const feedbackText = document.getElementById('feedbackText');
        const progressBar = document.getElementById('progressBar');
        const questionCounter = document.getElementById('questionCounter');
        const nextBtn = document.getElementById('nextBtn');
        const quizContent = document.getElementById('quizContent');
        const scoreDisplay = document.getElementById('scoreDisplay');

        const letters = ['A', 'B', 'Γ', 'Δ'];

        function loadQuestion() {
            const q = mcqData[currentIndex];
            questionCounter.innerText = `Ερώτηση ${currentIndex + 1} / ${mcqData.length}`;
            progressBar.style.width = `${((currentIndex) / mcqData.length) * 100}%`;
            
            questionText.innerText = q.question;
            optionsGrid.innerHTML = '';
            feedbackPanel.classList.remove('show');
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.onclick = () => selectOption(index, btn);
                
                btn.innerHTML = `<span class="option-letter">${letters[index]}.</span> <span>${opt}</span>`;
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            const q = mcqData[currentIndex];
            const allBtns = optionsGrid.children;
            
            // Lock all buttons
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.add('locked');
            }

            // Check correct/wrong
            if (selectedIndex === q.correct) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allBtns[q.correct].classList.add('correct'); // Show correct answer
            }

            // Show feedback
            feedbackText.innerText = q.feedback;
            feedbackPanel.classList.add('show');
            
            if (currentIndex === mcqData.length - 1) {
                nextBtn.innerText = "Ολοκλήρωση";
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < mcqData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            progressBar.style.width = `100%`;
            quizContent.style.display = 'none';
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerHTML = `<h2>Ολοκληρώθηκε!</h2><p>Το τελικό σου σκορ είναι: <strong>${score} / ${mcqData.length}</strong></p>`;
        }

        // Initialize Quiz
        loadQuestion();
    </script>
