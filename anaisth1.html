<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Module</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- MAC OS / VISION OS VARIABLES --- */
        :root {
            --bg-color: #f0f0f5;
            --card-bg: rgba(255, 255, 255, 0.65);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #007aff; 
            --accent-hover: #005bb5;
            --accent-bg: rgba(0, 122, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.7);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.04);
            --radius-md: 14px;
            --radius-lg: 20px;
            --correct-bg: rgba(52, 199, 89, 0.15);
            --correct-border: #34c759;
            --wrong-bg: rgba(255, 59, 48, 0.15);
            --wrong-border: #ff3b30;
        }

        [data-theme="dark"] {
            --bg-color: transparent; /* Διάφανο για να φαίνεται το gradient του parent */
            --card-bg: rgba(35, 35, 40, 0.55);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent: #0a84ff;
            --accent-hover: #5eafff;
            --accent-bg: rgba(10, 132, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-color);
            transition: all 0.4s ease;
        }

        .glass-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--card-border); 
            box-shadow: var(--shadow-sm); 
            border-radius: var(--radius-lg);
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(134, 134, 139, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 15px;
            letter-spacing: -0.3px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.05rem;
            text-align: left;
            transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
        }

        [data-theme="dark"] .option-btn { background: rgba(0, 0, 0, 0.2); }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            background: var(--accent-bg);
        }

        .option-btn i { font-size: 1.2rem; opacity: 0.7; width: 20px; text-align: center; }

        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--text-main); }
        .option-btn.correct i { color: var(--correct-border); opacity: 1; }
        
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--text-main); }
        .option-btn.wrong i { color: var(--wrong-border); opacity: 1; }

        .rationale-box {
            margin-top: 20px;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--accent-bg);
            border-left: 4px solid var(--accent);
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            align-items: center;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .btn-next {
            background: var(--accent);
            color: white;
            border: none;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-next.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .btn-next.active:hover { background: var(--accent-hover); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(134, 134, 139, 0.4); border-radius: 10px; }
    </style>
</head>

    "answer": "Τα μεταλλικά κουτιά και το φιαλίδιο.",
    "rationale": "Ακαδημαϊκός Ορισμός: Πέρα από τις κλασικές πλάκες (blisters), τα τοπικά αναισθητικά διατίθενται σε μεταλλικά κουτιά για τη συλλογή των φυσίγγων, αλλά και σε μορφή μεγαλύτερου γυάλινου φιαλιδίου (vial) πολλαπλών δόσεων για ειδική κλινική χρήση[cite: 60]. ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ: Οι «πλαστικές θήκες» εμφανίζονται στην αμέσως προηγούμενη διαφάνεια. Η παγίδα έγκειται στο γεγονός ότι ο φοιτητής πρέπει να διακρίνει τη διαφοροποίηση της συσκευασίας με βάση το αναφερόμενο υλικό κατασκευής (μεταλλικά κυτία Mepivastesin και φιαλίδιο Xylocaine) και όχι να βασιστεί στην κοινή εμπειρία του από τα χάρτινα κουτιά αναλώσιμων του ιατρείου."
  }

        ];

        // --- 2. STATE ---
        let currentQuestion = 0;
        let score = 0;
        let hasAnsweredCurrent = false;
        let userAnswers = new Array(quizData.length).fill(null); 

        // --- 3. LOGIC ---
        function loadQuestion() {
            hasAnsweredCurrent = userAnswers[currentQuestion] !== null;
            const q = quizData[currentQuestion];
            
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('questionCounter').innerHTML = \`<i class="fas fa-layer-group"></i> Ερώτηση \${currentQuestion + 1} / \${quizData.length}\`;
            document.getElementById('scoreTracker').innerHTML = \`<i class="fas fa-star" style="color:#ff9500;"></i> Σκορ: \${score}\`;
            
            // UI Progress
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Options Build
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                // Αν έχει ήδη απαντηθεί, δείξε την κατάσταση
                if (hasAnsweredCurrent) {
                    btn.style.pointerEvents = 'none';
                    if (index === q.correctIndex) {
                        btn.classList.add('correct');
                        btn.innerHTML = \`<i class="fas fa-check-circle"></i> \${opt}\`;
                    } else if (index === userAnswers[currentQuestion]) {
                        btn.classList.add('wrong');
                        btn.innerHTML = \`<i class="fas fa-times-circle"></i> \${opt}\`;
                    } else {
                        btn.innerHTML = \`<i class="far fa-circle"></i> \${opt}\`;
                    }
                } else {
                    btn.innerHTML = \`<i class="far fa-circle"></i> \${opt}\`;
                    btn.onclick = () => selectOption(index, btn);
                }
                
                optionsContainer.appendChild(btn);
            });

            // Rationale & Nav State
            const ratBox = document.getElementById('rationaleBox');
            if (hasAnsweredCurrent && q.rationale) {
                ratBox.innerHTML = \`<strong><i class="fas fa-lightbulb"></i> Επεξήγηση:</strong> <br>\${q.rationale}\`;
                ratBox.style.display = 'block';
            } else {
                ratBox.style.display = 'none';
            }
            
            document.getElementById('prevBtn').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerHTML = 'Ολοκλήρωση <i class="fas fa-flag-checkered"></i>';
            } else {
                nextBtn.innerHTML = 'Επόμενη <i class="fas fa-arrow-right"></i>';
            }

            if (hasAnsweredCurrent) {
                nextBtn.classList.add('active');
            } else {
                nextBtn.classList.remove('active');
            }
        }

        function selectOption(selectedIndex, btnElement) {
            if(hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;
            userAnswers[currentQuestion] = selectedIndex;

            const q = quizData[currentQuestion];
            const allButtons = document.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === q.correctIndex) {
                btnElement.classList.add('correct');
                btnElement.innerHTML = \`<i class="fas fa-check-circle"></i> \${q.options[selectedIndex]}\`;
                score++;
                document.getElementById('scoreTracker').innerHTML = \`<i class="fas fa-star" style="color:#ff9500;"></i> Σκορ: \${score}\`;
                
                // Προαιρετικό sound effect αν το parent έχει setup για ήχους, 
                // ή απλά αφήνεις το UI να μιλήσει.
            } else {
                btnElement.classList.add('wrong');
                btnElement.innerHTML = \`<i class="fas fa-times-circle"></i> \${q.options[selectedIndex]}\`;
                
                const correctBtn = allButtons[q.correctIndex];
                correctBtn.classList.add('correct');
                correctBtn.innerHTML = \`<i class="fas fa-check-circle"></i> \${q.options[q.correctIndex]}\`;
            }

            if(q.rationale) {
                const ratBox = document.getElementById('rationaleBox');
                ratBox.innerHTML = \`<strong><i class="fas fa-lightbulb"></i> Επεξήγηση:</strong> <br>\${q.rationale}\`;
                ratBox.style.display = 'block';
            }

            document.getElementById('nextBtn').classList.add('active');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            document.getElementById('progressFill').style.width = '100%';
            const finalScoreText = \`\${score}/\${quizData.length}\`;
            
            const container = document.getElementById('quizContainer');
            container.innerHTML = \`
                <div style="text-align: center; padding: 50px 20px; animation: fadeIn 0.5s ease;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; box-shadow: 0 10px 30px rgba(0,122,255,0.4);">
                        <i class="fas fa-check" style="font-size: 2.5rem; color: white;"></i>
                    </div>
                    <h2 style="font-size: 2rem; margin-bottom: 10px;">Ολοκληρώθηκε!</h2>
                    <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">Το τελικό σου σκορ είναι: <strong style="color: var(--text-main); font-size: 1.4rem;">\${finalScoreText}</strong></p>
                    <button class="btn-action btn-next active" style="margin: 0 auto;" onclick="location.reload()">
                        <i class="fas fa-redo"></i> Επανάληψη Κουίζ
                    </button>
                </div>
            \`;

            // Η εντολή προς το index.html για να ανοίξει το Spaced Repetition Modal
            window.parent.postMessage({ type: 'QUIZ_COMPLETED', score: finalScoreText }, '*');
        }

        // --- 4. THEME SYNC ---
        // Συγχρονισμός theme με το parent (light/dark mode)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'THEME_CHANGE') {
                if (event.data.theme === 'light') {
                    document.body.removeAttribute('data-theme');
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                }
            }
        });

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
