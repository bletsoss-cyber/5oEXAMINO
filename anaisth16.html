<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Οδοντιατρική Αναισθησιολογία — Κεφ. 6 (Active Recall MCQs)</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 20%, #162238 0%, #0b101d 45%, #06080f 100%);
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.18);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --correct-bg: rgba(16, 185, 129, 0.18);
      --correct-border: rgba(52, 211, 153, 0.65);
      --correct-text: #6ee7b7;
      --wrong-bg: rgba(239, 68, 68, 0.18);
      --wrong-border: rgba(248, 113, 113, 0.65);
      --wrong-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .orb-1 {
      width: 340px;
      height: 340px;
      background: #0284c7;
      top: -80px;
      left: -80px;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: #6366f1;
      bottom: -80px;
      right: -60px;
    }

    .quiz-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 var(--glass-highlight);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stats strong {
      color: var(--text-primary);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .question-text {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 14px;
      padding: 15px 18px;
      color: var(--text-primary);
      font-size: 0.98rem;
      line-height: 1.5;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: transform 0.18s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 1px;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.18);
    }

    .option-btn.correct .option-letter {
      background: rgba(16, 185, 129, 0.28);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.18);
    }

    .option-btn.wrong .option-letter {
      background: rgba(239, 68, 68, 0.28);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.dimmed {
      opacity: 0.48;
    }

    .feedback-panel {
      margin-top: 22px;
      padding: 20px 22px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), max-height 0.45s ease;
    }

    .feedback-panel.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      max-height: 600px;
    }

    .feedback-header {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .feedback-header.is-correct {
      color: var(--correct-text);
    }

    .feedback-header.is-wrong {
      color: var(--wrong-text);
    }

    .feedback-body {
      font-size: 0.94rem;
      color: #cbd5e1;
      line-height: 1.65;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn, .restart-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
      transition: transform 0.18s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .next-btn:hover, .restart-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.4);
    }

    .hidden {
      display: none;
    }

    .summary-card {
      text-align: center;
      padding: 20px 10px;
    }

    .summary-score {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 12px 0;
    }

    .summary-sub {
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .quiz-shell {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .question-text {
        font-size: 1.05rem;
      }
      .option-btn {
        padding: 13px 14px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <main class="quiz-shell">
    <div id="quiz-view">
      <div class="header">
        <span class="badge">Κεφάλαιο 6 • Φαρμακοτεχνικές Μορφές</span>
        <div class="stats">
          Ερώτηση <strong id="q-current">1</strong> / <strong id="q-total">20</strong>
          &nbsp;|&nbsp; Σκορ: <strong id="q-score">0</strong>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <h1 class="question-text" id="question-text"></h1>

      <div class="options-grid" id="options-grid"></div>

      <div class="feedback-panel" id="feedback-panel">
        <div class="feedback-header" id="feedback-header"></div>
        <div class="feedback-body" id="feedback-body"></div>
      </div>

      <div class="actions">
        <button class="next-btn hidden" id="next-btn">Επόμενη Ερώτηση →</button>
      </div>
    </div>

    <div id="summary-view" class="summary-card hidden">
      <span class="badge">Ολοκλήρωση Ενότητας</span>
      <div class="summary-score" id="final-score">0 / 20</div>
      <p class="summary-sub" id="final-message"></p>
      <button class="restart-btn" id="restart-btn">Επανάληψη Τεστ</button>
    </div>
  </main>

  <script>
    const mcqData = [
      {
        id: 1,
        question: "Ένας οδοντίατρος χρησιμοποιεί συστηματικά λιδοκαΐνη 2% με επινεφρίνη 1:80.000 τόσο για εργασίες 10 λεπτών όσο και για επεμβάσεις που απαιτούν 90 λεπτά πολφικής αναισθησίας. Ποιο είναι το κλινικό αποτέλεσμα αυτής της πρακτικής;",
        options: [
          "Επαρκής κάλυψη στην επέμβαση 90 λεπτών με ταυτόχρονη ταχεία αποδρομή στα μαλακά μόρια",
          "Ανεπαρκής πολφική αναισθησία στην εργασία 10 λεπτών λόγω βραδείας έναρξης της λιδοκαΐνης",
          "Άσκοπη παράταση αναισθησίας μαλακών μορίων στη σύντομη εργασία και πόνος στο τέλος της μακράς",
          "Αυξημένος κίνδυνος συστηματικής τοξικότητας στην εργασία 10 λεπτών και ισχαιμική νέκρωση στη μακρά"
        ],
        correct: 2,
        rationale: "α) Σωστό: Η λιδοκαΐνη 2% με επινεφρίνη 1:80.000 προσφέρει περίπου 60 λεπτά πολφικής αναισθησίας και 3-5 ώρες στα μαλακά μόρια, οπότε ο ασθενής των 10 λεπτών μένει άσκοπα μουδιασμένος για ώρες, ενώ των 90 λεπτών θα πονέσει στο τέλος. β) Λάθος: Δεν καλύπτει 90 λεπτά πολφικά, δεν έχει βραδεία έναρξη (3-5 min) και το πρόβλημα δεν είναι η τοξικότητα ή η νέκρωση. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Α «Επιλογή του κατάλληλου τοπικού αναισθητικού» και Πίνακας 6.2."
      },
      {
        id: 2,
        question: "Ποιος συνδυασμός σκευασμάτων από τον Πίνακα 6.1 παρέχει την υψηλότερη ποσότητα δραστικής ουσίας (mg) ανά οδοντιατρική φύσιγγα;",
        options: [
          "Υδροχλωρική πριλοκαΐνη 4% σκέτη και υδροχλωρική πριλοκαΐνη 4% με επινεφρίνη 1:200.000",
          "Υδροχλωρική αρτικαΐνη 4% με επινεφρίνη 1:100.000 και υδροχλωρική μεπιβακαΐνη 3% σκέτη",
          "Υδροχλωρική λιδοκαΐνη 2% με επινεφρίνη 1:80.000 και υδροχλωρική λιδοκαΐνη 2% σκέτη",
          "Υδροχλωρική μπαπιβακαΐνη 0,5% με επινεφρίνη 1:200.000 και υδροχλωρική μεπιβακαΐνη 2% με λεβονορδεφρίνη"
        ],
        correct: 0,
        rationale: "α) Σωστό: Τόσο η πριλοκαΐνη 4% σκέτη όσο και η πριλοκαΐνη 4% με επινεφρίνη 1:200.000 περιέχουν 72 mg ανά φύσιγγα, που είναι η μέγιστη τιμή στον πίνακα. β) Λάθος: Η αρτικαΐνη 4% έχει 68 mg, η μεπιβακαΐνη 3% έχει 54 mg, τα διαλύματα 2% έχουν 36 mg και η μπαπιβακαΐνη 0,5% μόλις 9 mg. γ) Παραπομπή: Κεφάλαιο 6, Πίνακας 6.1 «Εμπορικά σκευάσματα ενέσιμων τοπικών αναισθητικών»."
      },
      {
        id: 3,
        question: "Με βάση τον Πίνακα 6.1, ποιο από τα παρακάτω σκευάσματα αντενδείκνυται για επίτευξη πολφικής αναισθησίας μέσω στελεχιαίας τεχνικής;",
        options: [
          "Υδροχλωρική μεπιβακαΐνη 3% σκέτη χωρίς αγγειοσυσπαστικό",
          "Υδροχλωρική πριλοκαΐνη 4% σκέτη χωρίς αγγειοσυσπαστικό",
          "Υδροχλωρική μπαπιβακαΐνη 0,5% με επινεφρίνη 1:200.000",
          "Υδροχλωρική λιδοκαΐνη 2% σκέτη χωρίς αγγειοσυσπαστικό"
        ],
        correct: 3,
        rationale: "α) Σωστό: Στον Πίνακα 6.1 η σκέτη λιδοκαΐνη 2% αναφέρεται ρητά ότι «Δεν ενδείκνυται» για στελεχιαία πολφική αναισθησία, λόγω των ισχυρών αγγειοδιασταλτικών της ιδιοτήτων που περιορίζουν δραστικά τη διάρκεια και το βάθος. β) Λάθος: Η μεπιβακαΐνη 3% σκέτη (34-45 min), η πριλοκαΐνη 4% σκέτη (45-65 min) και η μπαπιβακαΐνη (>7 h) ενδείκνυνται κανονικά για στελεχιαία. γ) Παραπομπή: Κεφάλαιο 6, Πίνακας 6.1 και ενότητα Γ «Λιδοκαΐνη»."
      },
      {
        id: 4,
        question: "Γιατί η υδροχλωρική προκαΐνη 2% σκέτη αποτυγχάνει να προσφέρει ουσιαστική πολφική αναισθησία στην οδοντιατρική πράξη;",
        options: [
          "Επειδή μεταβολίζεται αποκλειστικά στο ήπαρ και έχει εξαιρετικά χαμηλή τιμή pKa",
          "Επειδή προκαλεί τη μεγαλύτερη αγγειοδιαστολή και μεταβολίζεται ταχύτατα στο πλάσμα",
          "Επειδή δεσμεύεται σε ποσοστό 95% στις πρωτεΐνες και δεν διαχέεται στον πολφό",
          "Επειδή διαθέτει υψηλή λιποδιαλυτότητα που οδηγεί σε άμεση τοπική νευροτοξικότητα"
        ],
        correct: 1,
        rationale: "α) Σωστό: Η προκαΐνη προκαλεί τη μεγαλύτερη αγγειοδιαστολή από όλα τα τοπικά αναισθητικά και μεταβολίζεται ταχύτατα στο πλάσμα από την ψευδοχολινεστεράση (t1/2 = 6 min), με αποτέλεσμα να μην προσφέρει ουσιαστική πολφική αναισθησία. β) Λάθος: Έχει υψηλό pKa (9,1), δεν μεταβολίζεται στο ήπαρ, η 95% πρωτεϊνική δέσμευση αφορά την αρτικαΐνη, και η νευροτοξικότητα στο ΕΝΥ αφορά τη χλωροπροκαΐνη. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Β «Εστερικού τύπου τοπικά αναισθητικά — Προκαΐνη»."
      },
      {
        id: 5,
        question: "Ποιος ήταν ο φαρμακολογικός λόγος που η προποξυκαΐνη συνδυάστηκε με την προκαΐνη στις οδοντιατρικές φύσιγγες και δεν κυκλοφόρησε ποτέ μόνη της;",
        options: [
          "Η προποξυκαΐνη είχε αργή έναρξη δράσης και απαιτούσε την προκαΐνη για ταχύτερη αναλγησία",
          "Η προποξυκαΐνη προκαλούσε έντονη αγγειοδιαστολή που αναιρούσε την αγγειοσύσπαση της προκαΐνης",
          "Η προποξυκαΐνη πρόσφερε ταχεία έναρξη και βάθος, αλλά είχε αυξημένη τοξικότητα μόνη της",
          "Η προποξυκαΐνη δεν μεταβολιζόταν στο ήπαρ και απαιτούσε την προκαΐνη για νεφρική απέκκριση"
        ],
        correct: 2,
        rationale: "α) Σωστό: Η προποξυκαΐνη (7-8 φορές δραστικότερη της προκαΐνης, έναρξη 2-3 min) προστέθηκε για να δώσει γρήγορη έναρξη, βάθος και διάρκεια, αλλά δεν διατέθηκε μόνη της λόγω της αυξημένης τοξικότητάς της. β) Λάθος: Είχε ταχύτατη έναρξη, λιγότερο έντονη αγγειοδιαστολή από την προκαΐνη, και μεταβολίζεται τόσο στο πλάσμα όσο και στο ήπαρ. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Β «Προποξυκαΐνη»."
      },
      {
        id: 6,
        question: "Για ποιον κλινικό λόγο αποθαρρύνεται η χρήση νορεπινεφρίνης 1:30.000 σε διαλύματα τοπικών αναισθητικών, ιδίως στην περιοχή της υπερώας;",
        options: [

          "Επειδή η νορεπινεφρίνη αδρανοποιείται ταχύτατα από την ψευδοχολινεστεράση του πλάσματος",

        correct: 0,
        rationale: "α) Σωστό: Η χρήση νορεπινεφρίνης δεν συστήνεται ειδικά σε περιοχές όπως η υπερώα, διότι μία μεγάλης διάρκειας ισχαιμία μπορεί να οδηγήσει σε νέκρωση των ιστών. β) Λάθος: Δεν αδρανοποιείται από ψευδοχολινεστεράση, δεν προκαλεί αγγειοδιαστολή και δεν αυξάνει τη συστηματική απορρόφηση του αναισθητικού. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Β «Προποξυκαΐνη»."

      {
        id: 7,
        question: "Ποιο χαρακτηριστικό της χλωροπροκαΐνης περιόρισε την ασφάλειά της σε εγχύσεις στο εγκεφαλονωτιαίο υγρό, παρά τη χαμηλή συστηματική της τοξικότητα;",
        options: [
          "Η εξαιρετικά υψηλή τιμή pKa και ο παρατεταμένος χρόνος ημίσειας ζωής της",

        ],
        correct: 1,
        rationale: "α) Σωστό: Παρότι η χλωροπροκαΐνη είχε χαμηλή συστηματική τοξικότητα και ταχεία έναρξη, ήταν αρκετά όξινη (pH 3,3) και εμφάνιζε μεγάλη νευροτοξικότητα σε εγχύσεις στο εγκεφαλονωτιαίο υγρό. β) Λάθος: Συνδυάστηκε επιτυχώς με μπαπιβακαΐνη για αύξηση της διάρκειας, ενώ η ορθοτολουιδίνη και η μεθαιμοσφαιριναιμία αφορούν την πριλοκαΐνη. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Β «Χλωροπροκαΐνη»."
      },
      {
        id: 8,

        options: [
          "Μεταβολίζεται αποκλειστικά στους νεφρούς και χορηγείται σε συγκέντρωση 4% για οδοντιατρική χρήση",
          "Είναι λιγότερο τοξική από την προκαΐνη και χρησιμοποιείται ευρέως ως επιφανειακό τζελ",
          "Έχει τον μικρότερο χρόνο ημίσειας ζωής και συνδυάζεται με φαινυλεφρίνη σε ρινικά σπρέι",

        rationale: "α) Σωστό: Το Profound Jel συντίθεται από 10% λιδοκαΐνη, 10% πριλοκαΐνη και 4% τετρακαΐνη, ενώ το σκεύασμα Profound PET έχει βελτιωμένη σύνθεση που περιλαμβάνει επιπλέον 2% φαινυλεφρίνη. β) Λάθος: Το 20% λιδοκαΐνη + 4% τετρακαΐνη + 2% φαινυλεφρίνη είναι το TAC 20 Alternate, η EMLA είναι 2,5%+2,5% και η οξυμεταζολίνη υπάρχει στο Kovanaze. γ) Παραπομπή: Κεφάλαιο 6, ενότητα Γ «Profound Jel»."
      },
      {
        id: 60,
        question: "Ποια είναι η κοινή αντένδειξη και η κοινή υποχρεωτική δοκιμασία ασφαλείας πριν από την έγχυση τόσο στη στελεχιαία του γενειακού όσο και του βυκανητικού νεύρου;",
        options: [
          "Η απουσία δοντιών στην περιοχή ως αντένδειξη και η υποχρεωτική επαφή με το οστό πριν την έγχυση",
          "Η χρήση αντιπηκτικών ως αντένδειξη και η προηγούμενη εφαρμογή κρέμας EMLA για 10 λεπτά",
          "Η φλεγμονή στην περιοχή της έγχυσης ως αντένδειξη και η δοκιμασία αναρρόφησης πριν την έγχυση",
          "Η ηλικία κάτω των 18 ετών ως αντένδειξη και η έγχυση ολόκληρης της φύσιγγας σε 30 δευτερόλεπτα"
        ],
        correct: 2,
        rationale: "α) Σωστό: Και στις δύο τεχνικές (στελεχιαία γενειακού και βυκανητικού νεύρου) η ρητή αντένδειξη είναι η φλεγμονή στην περιοχή της έγχυσης, ενώ πριν από την έγχυση του αναισθητικού εκτελείται υποχρεωτικά δοκιμασία αναρρόφησης. β) Λάθος: Δεν απαιτείται επαφή με το οστό στο γενειακό, ούτε έγχυση ολόκληρης φύσιγγας (0,6 ml και 0,3 ml αντίστοιχα). γ) Παραπομπή: Κεφάλαιο 10, «Στελεχιαία του γενειακού νεύρου» και «Στελεχιαία του βυκανητικού νεύρου»."
      }
    ];

    const letters = ["Α", "Β", "Γ", "Δ"];
    let currentIndex = 0;
    let score = 0;

    const quizView = document.getElementById("quiz-view");
    const summaryView = document.getElementById("summary-view");
    const qCurrent = document.getElementById("q-current");
    const qTotal = document.getElementById("q-total");
    const qScore = document.getElementById("q-score");
    const progressFill = document.getElementById("progress-fill");
    const questionText = document.getElementById("question-text");
    const optionsGrid = document.getElementById("options-grid");
    const feedbackPanel = document.getElementById("feedback-panel");
    const feedbackHeader = document.getElementById("feedback-header");
    const feedbackBody = document.getElementById("feedback-body");
    const nextBtn = document.getElementById("next-btn");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");
    const restartBtn = document.getElementById("restart-btn");

    qTotal.textContent = mcqData.length;

    function renderQuestion() {
      const item = mcqData[currentIndex];
      qCurrent.textContent = currentIndex + 1;
      progressFill.style.width = `${(currentIndex / mcqData.length) * 100}%`;
      questionText.textContent = `${item.id}. ${item.question}`;

      optionsGrid.innerHTML = "";
      feedbackPanel.classList.remove("visible");
      nextBtn.classList.add("hidden");

      item.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${optText}</span>`;
        btn.addEventListener("click", () => handleAnswer(idx));
        optionsGrid.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx) {
      const item = mcqData[currentIndex];
      const buttons = optionsGrid.querySelectorAll(".option-btn");
      const isCorrect = selectedIdx === item.correct;

      if (isCorrect) {
        score++;
        qScore.textContent = score;
      }

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.correct) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add("wrong");
        } else {
          btn.classList.add("dimmed");
        }
      });

      feedbackHeader.textContent = isCorrect ? "✓ Σωστή Απάντηση" : "✕ Λάθος Απάντηση";
      feedbackHeader.className = `feedback-header ${isCorrect ? "is-correct" : "is-wrong"}`;
      feedbackBody.textContent = item.rationale;
      feedbackPanel.classList.add("visible");

      nextBtn.textContent =
        currentIndex === mcqData.length - 1 ? "Ολοκλήρωση & Αποτελέσματα" : "Επόμενη Ερώτηση →";
      nextBtn.classList.remove("hidden");
    }

    nextBtn.addEventListener("click", () => {
      currentIndex++;
      if (currentIndex < mcqData.length) {
        renderQuestion();
      } else {
        showSummary();
      }
    });

    function showSummary() {
      progressFill.style.width = "100%";
      quizView.classList.add("hidden");
      summaryView.classList.remove("hidden");
      const pct = Math.round((score / mcqData.length) * 100);
      finalScore.textContent = `${score} / ${mcqData.length} (${pct}%)`;
      finalMessage.textContent =
        pct >= 85
          ? "Εξαιρετική κατανόηση των μηχανισμών και της φαρμακοκινητικής των τοπικών αναισθητικών."
          : pct >= 65
          ? "Πολύ καλή βάση — επανέλαβε τις ερωτήσεις όπου υπήρξαν αστοχίες για πλήρη αφομοίωση."
          : "Χρειάζεται στοχευμένη επανάληψη στις φαρμακολογικές διαφορές των εστέρων και αμιδίων.";
    }

    restartBtn.addEventListener("click", () => {
      currentIndex = 0;
      score = 0;
      qScore.textContent = "0";
      summaryView.classList.add("hidden");
      quizView.classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
