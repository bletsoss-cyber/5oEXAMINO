<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Module</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- MAC OS / VISION OS VARIABLES --- */
        :root {
            --bg-color: #f0f0f5;
            --card-bg: rgba(255, 255, 255, 0.65);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #007aff; 
            --accent-hover: #005bb5;
            --accent-bg: rgba(0, 122, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.7);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.04);
            --radius-md: 14px;
            --radius-lg: 20px;
            --correct-bg: rgba(52, 199, 89, 0.15);
            --correct-border: #34c759;
            --wrong-bg: rgba(255, 59, 48, 0.15);
            --wrong-border: #ff3b30;
        }

        [data-theme="dark"] {
            --bg-color: transparent; /* Διάφανο για να φαίνεται το gradient του parent */
            --card-bg: rgba(35, 35, 40, 0.55);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent: #0a84ff;
            --accent-hover: #5eafff;
            --accent-bg: rgba(10, 132, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-color);
            transition: all 0.4s ease;
        }

        .glass-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--card-border); 
            box-shadow: var(--shadow-sm); 
            border-radius: var(--radius-lg);
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(134, 134, 139, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 15px;
            letter-spacing: -0.3px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.05rem;
            text-align: left;
            transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
        }

        [data-theme="dark"] .option-btn { background: rgba(0, 0, 0, 0.2); }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            background: var(--accent-bg);
        }

        .option-btn i { font-size: 1.2rem; opacity: 0.7; width: 20px; text-align: center; }

        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--text-main); }
        .option-btn.correct i { color: var(--correct-border); opacity: 1; }
        
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--text-main); }
        .option-btn.wrong i { color: var(--wrong-border); opacity: 1; }

        .rationale-box {
            margin-top: 20px;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--accent-bg);
            border-left: 4px solid var(--accent);
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            align-items: center;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .btn-next {
            background: var(--accent);
            color: white;
            border: none;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-next.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .btn-next.active:hover { background: var(--accent-hover); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(134, 134, 139, 0.4); border-radius: 10px; }
    </style>
</head>
<body data-theme="dark">

    <div class="quiz-container glass-panel" id="quizContainer">
        <div class="header-info">
            <span id="questionCounter"><i class="fas fa-layer-group"></i> Ερώτηση 1 / X</span>
            <span id="scoreTracker"><i class="fas fa-star" style="color:#ff9500;"></i> Σκορ: 0</span>
        </div>
        
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        
        <div class="question-text" id="questionText">Φόρτωση...</div>
        
        <div class="options-grid" id="optionsContainer"></div>
        
        <div class="rationale-box" id="rationaleBox"></div>

        <div class="nav-buttons">
            <button class="btn-action" id="prevBtn" onclick="prevQuestion()" style="visibility: hidden;">
                <i class="fas fa-arrow-left"></i> Πίσω
            </button>
            <button class="btn-action btn-next" id="nextBtn" onclick="nextQuestion()">
                Επόμενη <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUIZ DATA (Εδώ βάζεις τα δεδομένα σου από το prompt) ---
        const quizData = [
  {
    "slide": 2,
    "question": "Ποια είναι η βασική διαφορά της τοπικής από την γενική αναισθησία, σύμφωνα με τον ορισμό της;",
    "options": [
      "Διατήρηση επιπέδου συνείδησης του ασθενή",
      "Πλήρης απώλεια αισθήσεων του σώματος",
      "Απουσία κινητικής λειτουργίας του στόματος",
      "Εφαρμογή αποκλειστικά σε μικρές περιοχές"
    ],
    "correctIndex": 0,
    "rationale": "Η τοπική αναισθησία χαρακτηρίζεται από απώλεια αίσθησης σε συγκεκριμένη περιοχή χωρίς απώλεια της συνείδησης, σε αντίθεση με τη γενική[cite: 2]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Οι επιλογές που αναφέρουν γενικευμένη απώλεια αισθήσεων συγχέονται με τη γενική αναισθησία, ενώ η απώλεια κινητικής λειτουργίας αφορά κινητικό αποκλεισμό (π.χ. αισθητικοκινητικό block) και όχι τον βασικό ορισμό διαχωρισμού[cite: 2]."
  },
  {
    "slide": 3,
    "question": "Ποιοι από τους παρακάτω παράγοντες κατατάσσονται στους νευρολυτικούς για την επίτευξη τοπικής αναισθησίας;",
    "options": [
      "Νευρολυτικές αλκοόλες",
      "Μηχανική συμπίεση",
      "Χαμηλή θερμοκρασία",
      "Χημικός ερεθισμός"
    ],
    "correctIndex": 0,
    "rationale": "Οι νευρολυτικοί παράγοντες, όπως οι αλκοόλες και οι φαινόλες, χρησιμοποιούνται ως εναλλακτικές (συνήθως σε χρόνιο πόνο) μέθοδοι πρόκλησης τοπικής αναισθησίας[cite: 3]. Προκαλούν μόνιμη ή παρατεταμένη καταστροφή των νευρικών ινών. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Η χαμηλή θερμοκρασία (κρυοαναλγησία) και ο μηχανικός τραυματισμός αποτελούν όντως μεθόδους τοπικής αναισθησίας, αλλά δρουν μέσω φυσικών/μηχανικών μηχανισμών και όχι μέσω χημικής νευρόλυσης[cite: 3]."
  },
  {
    "slide": 4,
    "question": "Πώς επιτυγχάνεται φαρμακολογικά η κατάσταση της ενσυνείδητης καταστολής σύμφωνα με τις μεθόδους χορήγησης;",
    "options": [
      "Χορήγηση γενικού αναισθητικού σε μικρότερη δοσολογία",
      "Χορήγηση εισπνεόμενου αναισθητικού σε μέγιστη δοσολογία",
      "Χρήση ηρεμιστικού αποκλειστικά σε μεγάλη δοσολογία",
      "Έγχυση τοπικού αναισθητικού σε υψηλή δοσολογία"
    ],
    "correctIndex": 0,
    "rationale": "Η ενσυνείδητη καταστολή προκαλείται με τη χορήγηση ηρεμιστικού ή κάποιου γενικού αναισθητικού σε μικρότερη δοσολογία από αυτή που απαιτείται για γενική αναισθησία[cite: 4]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Η αναφορά σε \"μέγιστες\" ή \"μεγάλες\" δοσολογίες είναι λανθασμένη, καθώς αυτές θα οδηγούσαν σε πλήρη γενική αναισθησία και επικίνδυνη απώλεια των προστατευτικών αντανακλαστικών του αεραγωγού (π.χ. αντανακλαστικό βήχα)[cite: 4]."
  },
  {
    "slide": 5,
    "question": "Με ποιον τρόπο επιτυγχάνεται ο περιφερικός νευρικός αποκλεισμός στην τοπική αναισθησία;",
    "options": [
      "Έγχυση φαρμάκου στο αντίστοιχο νευρικό στέλεχος",
      "Έγχυση φαρμάκου στην αντίστοιχη σπονδυλική στήλη",
      "Απευθείας διήθηση αποκλειστικά των τελικών απολήξεων",
      "Χορήγηση αναισθητικού αποκλειστικά στον επισκληρίδιο χώρο"
    ],
    "correctIndex": 0,
    "rationale": "Ο περιφερικός νευρικός αποκλεισμός προκαλείται με έγχυση φαρμάκου απευθείας επάνω στο αντίστοιχο νευρικό στέλεχος που νευρώνει αισθητικά την περιοχή[cite: 5]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Η έγχυση στη σπονδυλική στήλη ή τον επισκληρίδιο χώρο αφορά την κεντρική περιοχική αναισθησία, ενώ η απευθείας διήθηση των τελικών απολήξεων περιγράφει την επιφανειακή αναισθησία ή δι' εμποτίσεως (infiltration) και όχι τον αποκλεισμό στελέχους (nerve block)[cite: 5]."
  },
  {
    "slide": 6,
    "question": "Ποια από τις παρακάτω ιδιότητες θεωρείται επιθυμητή για ένα ιδανικό τοπικό αναισθητικό;",
    "options": [
      "Χαμηλή συστηματική τοξικότητα στο κυκλοφορικό",
      "Παρατεταμένη διάρκεια μετεγχειρητικής αναισθησίας ιστών",
      "Αδυναμία σύνδεσης με αγγειοσυσπαστικά φάρμακα",
      "Αργή έναρξη δράσης στους βλεννογόνους"
    ],
    "correctIndex": 0,
    "rationale": "Ένα ιδανικό τοπικό αναισθητικό πρέπει να εμφανίζει χαμηλή συστηματική τοξικότητα τόσο στο Κεντρικό Νευρικό Σύστημα (ΚΝΣ) όσο και στο κυκλοφορικό[cite: 6]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Η υπερβολικά παρατεταμένη δράση δεν είναι επιθυμητή διότι μπορεί να προκαλέσει ακούσιους αυτοτραυματισμούς στους ιστούς από τον ασθενή, ενώ η ικανότητα σύνδεσης με αγγειοσυσπαστικά (όπως η επινεφρίνη) είναι κλινικά απαραίτητη για την αύξηση της διάρκειας δράσης[cite: 6]."
  },
  {
    "slide": 7,
    "question": "Με βάση την ανατομία του εμμύελου νευρώνα, σε ποια ακριβώς απόσταση εντοπίζονται συνήθως τα οζίδια του Ranvier μεταξύ τους;",
    "options": [
      "Κάθε 0.5 με 3 χιλιοστά",
      "Κάθε 3 με 5 εκατοστά",
      "Κάθε 5 με 8 μικρόμετρα",
      "Κάθε 1 με 2 χιλιοστά"
    ],
    "correctIndex": 0,
    "rationale": "Το μυελώδες έλυτρο διακόπτεται δημιουργώντας χάσματα κάθε 0.5 με 3 mm, τα οποία ονομάζονται οζίδια του Ranvier και συγκεντρώνουν μεγάλο αριθμό καναλιών νατρίου[cite: 7]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Η σύγχυση των διαστάσεων (π.χ. εκατοστά αντί για χιλιοστά) είναι συχνή παγίδα. Η ακριβής ανατομική γνώση αυτής της απόστασης είναι κρίσιμη διότι ορίζει το μήκος του νεύρου (τουλάχιστον 2-3 διαδοχικά οζίδια) που πρέπει να πλημμυρίσει με αναισθητικό για να επιτευχθεί πλήρης αποκλεισμός[cite: 7]."
  },
  {
    "slide": 8,
    "question": "Ποιος ιστός περιβάλλει άμεσα τις δεσμίδες των νευρικών ινών δημιουργώντας ένα πυκνό κάλυμμα στο περιφερικό νευρικό σύστημα;",
    "options": [
      "Το πυκνό περινεύριο",
      "Το χαλαρό ενδονεύριο",
      "Το εξωτερικό επινεύριο",
      "Ο λιπώδης ιστός"
    ],
    "correctIndex": 0,
    "rationale": "Το περινεύριο αποτελείται από πυκνό συνδετικό ιστό και περιβάλλει τις δεσμίδες (fascicles) των νευρικών ινών[cite: 8]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Το ενδονεύριο είναι χαλαρός ιστός που περιβάλλει μεμονωμένες νευρικές ίνες, ενώ το επινεύριο αποτελεί το εξωτερικό περίβλημα ολόκληρου του νεύρου. Η κατανόηση αυτών των χιτώνων εξηγεί τα εμπόδια στη διάχυση των τοπικών αναισθητικών μορίων μέχρι το κέντρο του νεύρου (core bundles)[cite: 8]."
  },
  {
    "slide": 9,
    "question": "Ποια είναι η κατεύθυνση αγωγής των νευρικών διεγέρσεων μέσω των αισθητικών νεύρων;",
    "options": [
      "Από τα όργανα προς το ΚΝΣ",
      "Από το ΚΝΣ προς τους μύες",
      "Από το ΚΝΣ προς το δέρμα",
      "Από τους μύες προς τα νεύρα"
    ],
    "correctIndex": 0,
    "rationale": "Τα αισθητικά νεύρα έχουν μόνο αισθητικές ίνες που άγουν τις διεγέρσεις κεντρομόλα, δηλαδή από τα διάφορα όργανα (π.χ. δέρμα, σπλάχνα) προς το Κεντρικό Νευρικό Σύστημα (ΚΝΣ)[cite: 9]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Οι επιλογές που αναφέρουν αγωγή από το ΚΝΣ προς την περιφέρεια περιγράφουν τα κινητικά νεύρα, τα οποία έχουν αντίθετη (φυγόκεντρη) φορά αγωγής και καταλήγουν στους σκελετικούς μύες προκαλώντας σύσπαση[cite: 9]."
  },
  {
    "slide": 10,
    "question": "Σύμφωνα με την ταξινόμηση των νευρικών ινών, ποια είναι η λειτουργία και το είδος πόνου που μεταφέρουν οι ίνες τύπου C;",
    "options": [
      "Αργός πόνος μέσω αμύελων ινών",
      "Γρήγορος πόνος μέσω εμμύελων ινών",
      "Αίσθηση θερμότητας μέσω εμμύελων ινών",
      "Μυϊκή κίνηση μέσω αμύελων ινών"
    ],
    "correctIndex": 0,
    "rationale": "Οι ίνες τύπου C είναι λεπτές, αμύελες και μεταφέρουν το αίσθημα του \"αργού\" πόνου (slow pain) με εξαιρετικά μικρή ταχύτητα (0.25-1.5 m/s)[cite: 10]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Ο \"γρήγορος\" (οξύς) πόνος και η θερμοκρασία μεταφέρονται κυρίως από τις εμμύελες ίνες Αδ. Στην οδοντιατρική κλινική, ο διάχυτος, βύθιος πόνος που επιμένει οφείλεται στη διέγερση των ινών C του οδοντικού πολφού[cite: 10]."
  },
  {
    "slide": 11,
    "question": "Πώς επηρεάζει η διάμετρος της νευρικής ίνας την απαιτούμενη συγκέντρωση του τοπικού αναισθητικού για τον αποκλεισμό της αγωγιμότητας;",
    "options": [
      "Μεγαλύτερη διάμετρος απαιτεί αυξημένη συγκέντρωση του αναισθητικού",
      "Μεγαλύτερη διάμετρος απαιτεί μειωμένη συγκέντρωση του αναισθητικού",
      "Μικρότερη διάμετρος απαιτεί αυξημένη συγκέντρωση του αναισθητικού",
      "Η διάμετρος δεν επηρεάζει καθόλου τη συγκέντρωση"
    ],
    "correctIndex": 0,
    "rationale": "Βάσει του φαινομένου του διαφορικού νευρικού αποκλεισμού, όσο μεγαλύτερη είναι η διάμετρος της νευρικής ίνας, τόσο μεγαλύτερη συγκέντρωση τοπικού αναισθητικού απαιτείται για να παρεμποδιστεί πλήρως η αγωγιμότητά της[cite: 11]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Είναι λανθασμένη αλλά αληθοφανής υπόθεση ότι η διάμετρος δεν παίζει ρόλο. Οι χοντρές εμμύελες ίνες προστατεύονται από παχύτερο μυελώδες έλυτρο και τα οζίδια τους απέχουν περισσότερο, καθιστώντας τες πιο ανθεκτικές στην αναισθητική δράση σε σχέση με τις λεπτές[cite: 11]."
  },
  {
    "slide": 12,
    "question": "Ποιος είναι ο ρόλος των διαμεμβρανικών πρωτεϊνών σύμφωνα με το μοντέλο του ρευστού μωσαϊκού;",
    "options": [
      "Σχηματίζουν διαύλους πόρους και αντλίες",
      "Αποτελούν τον βασικό υδρόφοβο φραγμό",
      "Εμποδίζουν την ανταλλαγή των ιόντων",
      "Συνθέτουν τη διπλοστιβάδα των λιπιδίων"

    "rationale": "Όταν η εκπόλωση φτάσει στο λεγόμενο κρίσιμο δυναμικό (περίπου -50 με -60 mV), ανοίγει απότομα το μεγαλύτερο μέρος των καναλιών νατρίου, αυξάνοντας την αγωγιμότητα χιλιάδες φορές πάνω από το φυσιολογικό[cite: 18]. **ΠΙΘΑΝΗ ΠΑΓΙΔΑ ΠΟΛΛΑΠΛΗΣ:** Το δυναμικό ηρεμίας (-90 mV) είναι η αρχική σταθερή κατάσταση, ενώ το δυναμικό αιχμής (+40 mV) είναι η τελική κορυφή του δυναμικού δράσης μετά τη μαζική είσοδο νατρίου[cite: 18]. Τα τοπικά αναισθητικά μπλοκάρουν τους διαύλους, αποτρέποντας τη μεμβράνη από το να \"πιάσει\" αυτή την κρίσιμη ουδό (threshold) για πυροδότηση[cite: 18]."
  }


        ];

        // --- FIX: Υπολογισμός της σωστής επιλογής από το `answer` ---
        // Τα δεδομένα του quiz αποθηκεύουν τη σωστή απάντηση ως κείμενο
        // (`answer`) και όχι ως αριθμητικό index (`correctIndex`).
        // Υπολογίζουμε αυτόματα το index ώστε η λογική του quiz να λειτουργεί σωστά.
        quizData.forEach((q, index) => {
            q.correctIndex = q.options.indexOf(q.answer);

            if (q.correctIndex === -1) {
                console.error(
                    `Σφάλμα στην ερώτηση ${index + 1}: η σωστή απάντηση δεν βρέθηκε στις επιλογές.`,
                    q
                );
            }
        });

        // --- 2. STATE ---
        let currentQuestion = 0;
        let score = 0;
        let hasAnsweredCurrent = false;
        let userAnswers = new Array(quizData.length).fill(null); 

        // --- 3. LOGIC ---
        function loadQuestion() {
            hasAnsweredCurrent = userAnswers[currentQuestion] !== null;
            const q = quizData[currentQuestion];
            
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('questionCounter').innerHTML = `<i class="fas fa-layer-group"></i> Ερώτηση ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('scoreTracker').innerHTML = `<i class="fas fa-star" style="color:#ff9500;"></i> Σκορ: ${score}`;
            
            // UI Progress
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Options Build
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                // Αν έχει ήδη απαντηθεί, δείξε την κατάσταση
                if (hasAnsweredCurrent) {
                    btn.style.pointerEvents = 'none';
                    if (index === q.correctIndex) {
                        btn.classList.add('correct');
                        btn.innerHTML = `<i class="fas fa-check-circle"></i> ${opt}`;
                    } else if (index === userAnswers[currentQuestion]) {
                        btn.classList.add('wrong');
                        btn.innerHTML = `<i class="fas fa-times-circle"></i> ${opt}`;
                    } else {
                        btn.innerHTML = `<i class="far fa-circle"></i> ${opt}`;
                    }
                } else {
                    btn.innerHTML = `<i class="far fa-circle"></i> ${opt}`;
                    btn.onclick = () => selectOption(index, btn);
                }
                
                optionsContainer.appendChild(btn);
            });

            // Rationale & Nav State
            const ratBox = document.getElementById('rationaleBox');
            if (hasAnsweredCurrent && q.rationale) {
                ratBox.innerHTML = `<strong><i class="fas fa-lightbulb"></i> Επεξήγηση:</strong> <br>${q.rationale}`;
                ratBox.style.display = 'block';
            } else {
                ratBox.style.display = 'none';
            }
            
            document.getElementById('prevBtn').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerHTML = 'Ολοκλήρωση <i class="fas fa-flag-checkered"></i>';
            } else {
                nextBtn.innerHTML = 'Επόμενη <i class="fas fa-arrow-right"></i>';
            }

            if (hasAnsweredCurrent) {
                nextBtn.classList.add('active');
            } else {
                nextBtn.classList.remove('active');
            }
        }

        function selectOption(selectedIndex, btnElement) {
            if(hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;
            userAnswers[currentQuestion] = selectedIndex;

            const q = quizData[currentQuestion];

            if (q.correctIndex === -1 || q.correctIndex === undefined) {
                console.error('Μη έγκυρη σωστή απάντηση για την ερώτηση:', q);
                return;
            }

            const allButtons = document.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === q.correctIndex) {
                btnElement.classList.add('correct');
                btnElement.innerHTML = `<i class="fas fa-check-circle"></i> ${q.options[selectedIndex]}`;
                score++;
                document.getElementById('scoreTracker').innerHTML = `<i class="fas fa-star" style="color:#ff9500;"></i> Σκορ: ${score}`;
                
                // Προαιρετικό sound effect αν το parent έχει setup για ήχους, 
                // ή απλά αφήνεις το UI να μιλήσει.
            } else {
                btnElement.classList.add('wrong');
                btnElement.innerHTML = `<i class="fas fa-times-circle"></i> ${q.options[selectedIndex]}`;
                
                const correctBtn = allButtons[q.correctIndex];
                correctBtn.classList.add('correct');
                correctBtn.innerHTML = `<i class="fas fa-check-circle"></i> ${q.options[q.correctIndex]}`;
            }

            if(q.rationale) {
                const ratBox = document.getElementById('rationaleBox');
                ratBox.innerHTML = `<strong><i class="fas fa-lightbulb"></i> Επεξήγηση:</strong> <br>${q.rationale}`;
                ratBox.style.display = 'block';
            }

            document.getElementById('nextBtn').classList.add('active');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            document.getElementById('progressFill').style.width = '100%';
            const finalScoreText = `${score}/${quizData.length}`;
            
            const container = document.getElementById('quizContainer');
            container.innerHTML = `
                <div style="text-align: center; padding: 50px 20px; animation: fadeIn 0.5s ease;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; box-shadow: 0 10px 30px rgba(0,122,255,0.4);">
                        <i class="fas fa-check" style="font-size: 2.5rem; color: white;"></i>
                    </div>
                    <h2 style="font-size: 2rem; margin-bottom: 10px;">Ολοκληρώθηκε!</h2>
                    <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">Το τελικό σου σκορ είναι: <strong style="color: var(--text-main); font-size: 1.4rem;">${finalScoreText}</strong></p>
                    <button class="btn-action btn-next active" style="margin: 0 auto;" onclick="location.reload()">
                        <i class="fas fa-redo"></i> Επανάληψη Κουίζ
                    </button>
                </div>
            `;

            // Η εντολή προς το index.html για να ανοίξει το Spaced Repetition Modal
            window.parent.postMessage({ type: 'QUIZ_COMPLETED', score: finalScoreText }, '*');
        }

        // --- 4. THEME SYNC ---
        // Συγχρονισμός theme με το parent (light/dark mode)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'THEME_CHANGE') {
                if (event.data.theme === 'light') {
                    document.body.removeAttribute('data-theme');
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                }
            }
        });

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
