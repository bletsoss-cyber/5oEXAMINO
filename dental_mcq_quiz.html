<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic MCQ - Dental Preparations</title>
    <style>
        :root {
            --primary-glass: rgba(255, 255, 255, 0.07);
            --border-glass: rgba(255, 255, 255, 0.15);
            --correct-color: rgba(46, 213, 115, 0.3);
            --correct-border: #2ed573;
            --wrong-color: rgba(255, 71, 87, 0.3);
            --wrong-border: #ff4757;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --bg-gradient-1: #0f2027;
            --bg-gradient-2: #203a43;
            --bg-gradient-3: #2c5364;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 900px;
            background: var(--primary-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #7bed9f;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #7bed9f;
        }

        /* Question Section */
        .question-text {
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Options */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background: var(--correct-color);
            border-color: var(--correct-border);
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.2);
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            border-color: var(--wrong-border);
        }

        .option-prefix {
            font-weight: bold;
            margin-right: 12px;
            color: var(--text-muted);
        }

        /* Feedback Panel */
        .feedback-panel {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 4px solid #70a1ff;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            transform: translateY(20px);
            opacity: 0;
            display: none;
            transition: all 0.4s ease;
        }

        .feedback-panel.show {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }

        .next-btn {
            margin-top: 25px;
            background: #70a1ff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            float: right;
            transition: background 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            background: #5352ed;
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            display: none;
        }
        
        .end-screen h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .end-screen p {
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <div id="quizContent">
            <div class="progress-header">
                <span>Ερώτηση <span id="currentQNum">1</span> / 40</span>
                <span>Σκορ: <span id="scoreDisplay">0</span></span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <h2 class="question-text" id="questionText">Φόρτωση ερώτησης...</h2>

            <div class="options-grid" id="optionsGrid">
                <!-- Options injected via JS -->
            </div>

            <div class="feedback-panel" id="feedbackPanel"></div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Επόμενη Ερώτηση &rarr;</button>
            <div style="clear: both;"></div>
        </div>
        
        <div class="end-screen" id="endScreen">
            <h2>Ολοκλήρωση Δοκιμασίας!</h2>
            <p>Το τελικό σου σκορ είναι: <span id="finalScore" style="color: #7bed9f; font-weight: bold;"></span> / 40</p>
        </div>
    </div>

                optionsGrid.appendChild(btn);
            });

        function selectOption(selectedIndex, selectedBtn, correctIndex, rationale) {
            const buttons = optionsGrid.querySelectorAll('.option-btn');
            
            // Lock all buttons
            buttons.forEach(btn => btn.disabled = true);

            // Check if correct
            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                score++;
                scoreDisplay.textContent = score;
            } else {
                selectedBtn.classList.add('wrong');
