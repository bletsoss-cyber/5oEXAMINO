<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Pharmacology & Local Anesthesia - Liquid Glass active Recall</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --accent: #4da6ff;
            --correct-bg: rgba(46, 160, 67, 0.3);
            --correct-border: #2ea043;
            --wrong-bg: rgba(248, 81, 73, 0.3);
            --wrong-border: #f85149;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #111827 0%, #000000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.5;
            font-weight: 500;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--glass-hover);
            transform: translateX(4px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: var(--correct-bg);
            border-color: var(--correct-border);
            color: #fff;
            opacity: 1;
        }

        .option-btn.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: #fff;
        }

        .rationale-panel {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-top: 10px;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .rationale-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .next-btn {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background: #66b3ff;
        }
        
        .score-display {
            text-align: center;
            font-size: 2rem;
            color: #fff;
            display: none;
        }

    </style>
</head>
<body>

        <header>

        <div class="options-container" id="options">
            <!-- Options will be injected here -->
        </div>

        <div class="rationale-panel" id="rationale">
            <!-- Rationale string injected here -->
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Επόμενη Ερώτηση</button>

        const progressBar = document.getElementById('progress');
        const counterEl = document.getElementById('question-counter');
        const scoreTracker = document.getElementById('score-tracker');
        const quizContainer = document.getElementById('quiz-container');
        const finalScreen = document.getElementById('final-screen');
        const finalScore = document.getElementById('final-score');

        function loadQuestion() {
            const currentQ = mcqData[currentIndex];
            
            counterEl.textContent = `Ερώτηση ${currentIndex + 1} / ${mcqData.length}`;
            progressBar.style.width = `${((currentIndex) / mcqData.length) * 100}%`;
            
            questionEl.textContent = currentQ.question;
            optionsEl.innerHTML = '';
            rationaleEl.classList.remove('show');
            nextBtn.style.display = 'none';

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                const prefix = String.fromCharCode(945 + index); // α, β, γ, δ
                btn.innerHTML = `<strong>${prefix})</strong> &nbsp;${option}`;
                
                btn.onclick = () => selectOption(index, btn);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const currentQ = mcqData[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === currentQ.correctIndex) {
                    btn.classList.add('correct');
                }
            });

            if (selectedIndex === currentQ.correctIndex) {
                score++;
                scoreTracker.textContent = `Σκορ: ${score}`;
            } else {
                selectedBtn.classList.add('wrong');
            }

            rationaleEl.textContent = currentQ.rationale;
            rationaleEl.classList.add('show');
            nextBtn.style.display = 'block';
            progressBar.style.width = `${((currentIndex + 1) / mcqData.length) * 100}%`;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < mcqData.length) {
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            quizContainer.style.display = 'none';
            finalScreen.style.display = 'block';
            finalScore.textContent = `${score} / ${mcqData.length}`;
        }

        // Initialize
        loadQuestion();
