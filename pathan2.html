<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Παθολογική Ανατομική — Κυτταρική Βλάβη &amp; Κυτταρικός Θάνατος</title>
  <style>
    :root {
      --bg-base: #07090f;
      --glass-bg: rgba(22, 26, 38, 0.62);
      --glass-card: rgba(30, 35, 50, 0.56);
      --glass-hover: rgba(45, 52, 74, 0.72);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text-primary: #f3f5f9;
      --text-secondary: #a5b0c6;
      --text-muted: #748099;
      --accent: #0a84ff;
      --accent-glow: rgba(10, 132, 255, 0.32);
      --success: #30d158;
      --success-bg: rgba(48, 209, 88, 0.14);
      --success-border: rgba(48, 209, 88, 0.45);
      --danger: #ff453a;
      --danger-bg: rgba(255, 69, 58, 0.14);
      --danger-border: rgba(255, 69, 58, 0.45);
      --warning: #ffd60a;
      --radius-window: 22px;
      --radius-card: 16px;
      --radius-btn: 12px;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background:
        radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.22), transparent 42%),
        radial-gradient(circle at 85% 20%, rgba(191, 90, 242, 0.18), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(48, 209, 88, 0.12), transparent 45%),
        var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 48px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .macos-window {
      width: 100%;
      max-width: 920px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(165%);
      -webkit-backdrop-filter: blur(28px) saturate(165%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-window);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px;
      background: rgba(14, 17, 26, 0.55);
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tl {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }
    .tl.red { background: #ff5f56; }
    .tl.yellow { background: #ffbd2e; }
    .tl.green { background: #27c93f; }

    .window-title-group {
      display: flex;
      flex-direction: column;
    }

    .window-title {
      font-size: 0.96rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .window-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .mode-switch {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0a84ff, #5e5ce6, #30d158);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .window-body {
      padding: 28px 28px 32px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .counter-pill {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: 999px;
    }

    .score-live {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .question-card {
      background: var(--glass-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 22px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 0.96rem;
      line-height: 1.45;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-btn);
      padding: 14px 18px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.18s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--glass-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .option-btn.selected-exam {
      background: rgba(10, 132, 255, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .option-btn.selected-exam .option-letter {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
    }
    .option-btn.correct .option-letter {
      background: var(--success);
      color: #061b0c;
      border-color: var(--success);
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }
    .option-btn.wrong .option-letter {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .feedback-panel {
      margin-top: 20px;
      background: rgba(12, 15, 24, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 20px;
      animation: fadeSlide 0.28s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .feedback-status {
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .feedback-status.is-correct { color: var(--success); }
    .feedback-status.is-wrong { color: var(--danger); }

    .slide-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: #8cc8ff;
      background: rgba(10, 132, 255, 0.16);
      border: 1px solid rgba(10, 132, 255, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .rationale-correct {
      background: rgba(48, 209, 88, 0.08);
      border-left: 3px solid var(--success);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 14px;
      font-size: 0.92rem;
      color: var(--text-primary);
    }

    .rationale-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .rationale-correct .rationale-label { color: var(--success); }

    .rationale-wrong-box {
      padding: 4px 2px 0;
    }
    .rationale-wrong-box .rationale-label {
      color: #ff8a80;
      margin-bottom: 8px;
    }

    .rationale-wrong-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rationale-wrong-list li {
      position: relative;
      padding-left: 16px;
      font-size: 0.89rem;
      color: var(--text-secondary);
    }

    .rationale-wrong-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--danger);
      font-weight: 700;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: var(--radius-btn);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.13);
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .btn-primary:hover:not(:disabled) {
      background: #2190ff;
      border-color: #2190ff;
    }

    .results-box {
      text-align: center;
      padding: 16px 8px;
    }

    .results-percent {
      font-size: 3.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff, #8cc8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .results-sub {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .results-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .review-list {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .review-item {
      background: var(--glass-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 18px;
    }

    .review-item.is-correct { border-left: 4px solid var(--success); }
    .review-item.is-wrong { border-left: 4px solid var(--danger); }

    .review-q {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 10px;
    }

    .review-ans {
      font-size: 0.88rem;
      margin-bottom: 10px;
      color: var(--text-secondary);
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .window-body { padding: 18px 16px 24px; }
      .question-card { padding: 18px; }
      .question-text { font-size: 1.02rem; }
    }
  </style>
</head>
<body>
  <div class="macos-window">
    <header class="window-header">
      <div class="header-left">
        <div class="traffic-lights">
          <span class="tl red"></span>
          <span class="tl yellow"></span>
          <span class="tl green"></span>
        </div>
        <div class="window-title-group">
          <div class="window-title">Γενική Παθολογική Ανατομική</div>
          <div class="window-subtitle">Αίτια &amp; Είδη Κυτταρικής Βλάβης — Τύποι Κυτταρικού Θανάτου</div>
        </div>
      </div>

      <div class="mode-switch" role="group" aria-label="Λειτουργία Κουίζ">
        <button id="btnStudyMode" class="mode-btn active" type="button">Study Mode</button>
        <button id="btnExamMode" class="mode-btn" type="button">Exam Mode</button>
      </div>
    </header>

    <div class="progress-bar-wrap">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>

    <main class="window-body">
      <div id="quizView">
        <div class="meta-row">
          <span id="questionCounter" class="counter-pill">Ερώτηση 1 / 61</span>
          <span id="liveScore" class="score-live">Σκορ: 0 / 0</span>
        </div>

        <section class="question-card">
          <div id="questionText" class="question-text"></div>
          <div id="optionsContainer" class="options-list"></div>
          <div id="feedbackPanel" class="feedback-panel hidden"></div>
        </section>

        <div class="nav-controls">
          <button id="btnPrev" class="btn" type="button">← Προηγούμενη</button>
          <button id="btnNext" class="btn btn-primary" type="button">Επόμενη →</button>
        </div>
      </div>

      <div id="resultsView" class="hidden">
        <div class="results-box">
          <div id="resPercent" class="results-percent">0%</div>
          <div id="resSummary" class="results-sub"></div>
          <div class="results-actions">
            <button id="btnRetryAll" class="btn btn-primary" type="button">Επανάληψη Όλων (Σειριακά)</button>
            <button id="btnRetryShuffle" class="btn" type="button">Επανάληψη Όλων (Τυχαία Σειρά)</button>
            <button id="btnRetryWrong" class="btn" type="button">Επανάληψη Μόνο Λαθών</button>
          </div>
          <div id="reviewContainer" class="review-list"></div>
        </div>
      </div>
    </main>
  </div>

    // State
    let mode = "study"; // "study" | "exam"
    let activeQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};

    // DOM Elements
    const btnStudyMode = document.getElementById("btnStudyMode");
    const btnExamMode = document.getElementById("btnExamMode");
    const progressFill = document.getElementById("progressFill");
    const quizView = document.getElementById("quizView");
    const resultsView = document.getElementById("resultsView");
    const questionCounter = document.getElementById("questionCounter");
    const liveScore = document.getElementById("liveScore");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedbackPanel = document.getElementById("feedbackPanel");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const resPercent = document.getElementById("resPercent");
    const resSummary = document.getElementById("resSummary");
    const btnRetryAll = document.getElementById("btnRetryAll");
    const btnRetryShuffle = document.getElementById("btnRetryShuffle");
    const btnRetryWrong = document.getElementById("btnRetryWrong");
    const reviewContainer = document.getElementById("reviewContainer");

    const letters = ["A", "B", "C", "D"];

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareQuestion(q) {
      const indexed = q.options.map((text, idx) => ({
        text,
        isCorrect: idx === q.correctIndex
      }));
      const shuffled = shuffleArray(indexed);
      const correctShuffledIdx = shuffled.findIndex(item => item.isCorrect);
      return {
        ...q,
        shuffledOptions: shuffled.map(item => item.text),
        correctShuffledIdx
      };
    }

    function initQuiz(sourceList, shuffleQuestions = false) {
      const list = shuffleQuestions ? shuffleArray(sourceList) : [...sourceList];
      activeQuestions = list.map(prepareQuestion);
      currentIndex = 0;
      userAnswers = {};
      quizView.classList.remove("hidden");
      resultsView.classList.add("hidden");
      renderQuestion();
    }

    function updateHeaderStats() {
      const total = activeQuestions.length;
      questionCounter.textContent = `Ερώτηση ${currentIndex + 1} / ${total}`;
      const answeredCount = Object.keys(userAnswers).length;
      const correctCount = Object.values(userAnswers).filter(a => a.isCorrect).length;

      if (mode === "study") {
        liveScore.textContent = `Σκορ: ${correctCount} / ${answeredCount}`;
      } else {
        liveScore.textContent = `Απαντημένες: ${answeredCount} / ${total}`;
      }

      const pct = total > 0 ? ((currentIndex + 1) / total) * 100 : 0;
      progressFill.style.width = `${pct}%`;
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const saved = userAnswers[q.id];

      updateHeaderStats();
      questionText.textContent = `${currentIndex + 1}. ${q.question}`;
      optionsContainer.innerHTML = "";
      feedbackPanel.classList.add("hidden");
      feedbackPanel.innerHTML = "";

      q.shuffledOptions.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";

        const letterSpan = document.createElement("span");
        letterSpan.className = "option-letter";
        letterSpan.textContent = letters[idx];

        const textSpan = document.createElement("span");
        textSpan.textContent = optText;

        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        if (saved) {
          if (mode === "study") {
            btn.disabled = true;
            if (idx === q.correctShuffledIdx) btn.classList.add("correct");
            else if (idx === saved.selectedIdx) btn.classList.add("wrong");
          } else {
            if (idx === saved.selectedIdx) btn.classList.add("selected-exam");
          }
        }

        btn.addEventListener("click", () => handleAnswer(idx));
        optionsContainer.appendChild(btn);
      });

      if (saved && mode === "study") {
        renderFeedback(q, saved.isCorrect);
      }

      btnPrev.disabled = currentIndex === 0;
      btnNext.textContent = currentIndex === activeQuestions.length - 1 ? "Ολοκλήρωση →" : "Επόμενη →";
    }

    function handleAnswer(selectedIdx) {
      const q = activeQuestions[currentIndex];
      if (mode === "study" && userAnswers[q.id]) return;

      const isCorrect = selectedIdx === q.correctShuffledIdx;
      userAnswers[q.id] = {
        selectedIdx,
        isCorrect,
        selectedText: q.shuffledOptions[selectedIdx],
        correctText: q.shuffledOptions[q.correctShuffledIdx]
      };

      renderQuestion();
    }

    function buildRationaleHTML(q, isCorrect, showStatus = true) {
      const statusHtml = showStatus
        ? `<span class="feedback-status ${isCorrect ? "is-correct" : "is-wrong"}">${isCorrect ? "✓ Σωστή Απάντηση" : "✕ Λανθασμένη Απάντηση"}</span>`
        : `<span class="feedback-status" style="color:var(--text-secondary)">Ανάλυση Ερώτησης</span>`;

      const wrongItems = q.rationale.wrong.map(item => `<li>${item}</li>`).join("");

      return `
        <div class="feedback-header">
          ${statusHtml}
          <span class="slide-badge">${q.rationale.slide}</span>
        </div>
        <div class="rationale-correct">
          <span class="rationale-label">Σωστή Απάντηση &amp; Μηχανισμός</span>
          ${q.rationale.correct}
        </div>
        <div class="rationale-wrong-box">
          <span class="rationale-label">Παγίδες &amp; Λανθασμένες Επιλογές</span>
          <ul class="rationale-wrong-list">${wrongItems}</ul>
        </div>
      `;
    }

    function renderFeedback(q, isCorrect) {
      feedbackPanel.innerHTML = buildRationaleHTML(q, isCorrect, true);
      feedbackPanel.classList.remove("hidden");
    }

    function showResults() {
      const total = activeQuestions.length;
      let score = 0;
      const wrongQuestions = [];

      activeQuestions.forEach(q => {
        const ans = userAnswers[q.id];
        if (ans && ans.isCorrect) {
          score++;
        } else {
          wrongQuestions.push(q);
        }
      });

      const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
      resPercent.textContent = `${percentage}%`;
      resSummary.textContent = `Απάντησες σωστά σε ${score} από τις ${total} ερωτήσεις (${mode === "study" ? "Study Mode" : "Exam Mode"}).`;

      btnRetryWrong.disabled = wrongQuestions.length === 0;
      btnRetryWrong.textContent = wrongQuestions.length > 0
        ? `Επανάληψη Λαθών (${wrongQuestions.length})`
        : "Κανένα Λάθος!";

      try {
        window.parent.postMessage({
          type: "QUIZ_COMPLETE",
          score,
          total,
          percentage,
          quizId: QUIZ_ID
        }, "*");
      } catch (e) {}

      reviewContainer.innerHTML = "";
      activeQuestions.forEach((q, i) => {
        const ans = userAnswers[q.id];
        const isCorrect = !!(ans && ans.isCorrect);
        const div = document.createElement("div");
        div.className = `review-item ${isCorrect ? "is-correct" : "is-wrong"}`;
        div.innerHTML = `
          <div class="review-q">${i + 1}. ${q.question}</div>
          <div class="review-ans">
            <strong>Η επιλογή σου:</strong> ${ans ? ans.selectedText : "Καμία απάντηση"}<br />
            <strong>Σωστή απάντηση:</strong> ${q.shuffledOptions[q.correctShuffledIdx]}
          </div>
          ${buildRationaleHTML(q, isCorrect, false)}
        `;
        reviewContainer.appendChild(div);
      });

      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      progressFill.style.width = "100%";
    }

    btnStudyMode.addEventListener("click", () => {
      if (mode === "study") return;
      mode = "study";
      btnStudyMode.classList.add("active");
      btnExamMode.classList.remove("active");
      initQuiz(mcqData, false);
    });

    btnExamMode.addEventListener("click", () => {
      if (mode === "exam") return;
      mode = "exam";
      btnExamMode.classList.add("active");
      btnStudyMode.classList.remove("active");
      initQuiz(mcqData, false);
    });

    btnPrev.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    btnNext.addEventListener("click", () => {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    });

    btnRetryAll.addEventListener("click", () => initQuiz(mcqData, false));
    btnRetryShuffle.addEventListener("click", () => initQuiz(mcqData, true));
    btnRetryWrong.addEventListener("click", () => {
      const wrongIds = new Set(
        activeQuestions.filter(q => !(userAnswers[q.id] && userAnswers[q.id].isCorrect)).map(q => q.id)
      );
      const subset = mcqData.filter(q => wrongIds.has(q.id));
      if (subset.length > 0) initQuiz(subset, false);
    });

    initQuiz(mcqData, false);
  </script>
</body>
</html>
