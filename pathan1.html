<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Γενική Παθολογία & Παθολογική Ανατομική — Εισαγωγή</title>
  <style>
    :root {
      --bg-base: #0b0d14;
      --glass-bg: rgba(24, 28, 42, 0.58);
      --glass-elevated: rgba(34, 40, 58, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.24);
      --text-primary: #f5f7ff;
      --text-secondary: rgba(235, 240, 255, 0.72);
      --text-muted: rgba(235, 240, 255, 0.48);
      --accent: #5e9eff;
      --accent-glow: rgba(94, 158, 255, 0.28);
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --success-border: rgba(52, 211, 153, 0.45);
      --danger: #fb7185;
      --danger-bg: rgba(251, 113, 133, 0.14);
      --danger-border: rgba(251, 113, 133, 0.45);
      --warning: #fbbf24;
      --radius-window: 22px;
      --radius-card: 16px;
      --radius-btn: 12px;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(79, 124, 255, 0.22), transparent 42%),
        radial-gradient(circle at 85% 22%, rgba(168, 85, 247, 0.18), transparent 44%),
        radial-gradient(circle at 50% 88%, rgba(20, 184, 166, 0.14), transparent 46%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 48px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .mac-window {
      width: 100%;
      max-width: 900px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-window);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      overflow: hidden;
      animation: windowFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes windowFadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* macOS Header */
    .mac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
    }

    .mac-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.35);
    }
    .light.red { background: #ff5f57; }
    .light.yellow { background: #febc2e; }
    .light.green { background: #28c840; }

    .window-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    /* Segmented Mode Toggle */
    .mode-toggle {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Progress Bar */
    .progress-wrap {
      padding: 16px 24px 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5e9eff, #a78bfa);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Main Content */
    .content {
      padding: 24px;
    }

    .question-card {
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .q-badge {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: rgba(94, 158, 255, 0.14);
      border: 1px solid rgba(94, 158, 255, 0.28);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-btn);
      padding: 14px 16px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.96rem;
      line-height: 1.45;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--glass-border-hover);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .option-btn.selected {
      background: rgba(94, 158, 255, 0.16);
      border-color: rgba(94, 158, 255, 0.55);
    }
    .option-btn.selected .opt-letter {
      background: var(--accent);
      color: #0b0d14;
      border-color: transparent;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
    }
    .option-btn.correct .opt-letter {
      background: var(--success);
      color: #06281c;
      border-color: transparent;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }
    .option-btn.wrong .opt-letter {
      background: var(--danger);
      color: #2b0710;
      border-color: transparent;
    }

    /* Feedback Panel */
    .feedback-panel {
      margin-top: 18px;
      background: rgba(15, 19, 30, 0.72);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 18px 20px;
      display: none;
      animation: slideReveal 0.3s ease;
    }

    .feedback-panel.visible {
      display: block;
    }

    @keyframes slideReveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .fb-status {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .fb-status.is-correct { color: var(--success); }
    .fb-status.is-wrong { color: var(--danger); }

    .slide-badge {
      font-size: 0.78rem;
      font-weight: 600;
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.14);
      border: 1px solid rgba(167, 139, 250, 0.32);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .fb-correct-box {
      background: rgba(52, 211, 153, 0.09);
      border-left: 3px solid var(--success);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.92rem;
      color: var(--text-primary);
    }

    .fb-correct-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--success);
      margin-bottom: 4px;
    }

    .fb-wrong-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--danger);
      margin-bottom: 8px;
    }

    .fb-wrong-list {
      list-style: disc;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.89rem;
      color: var(--text-secondary);
    }

    /* Footer Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: var(--radius-btn);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--glass-border-hover);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f8cff, #7c6bff);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    /* Results Screen */
    .results-screen {
      display: none;
    }
    .results-screen.visible {
      display: block;
    }

    .score-hero {
      text-align: center;
      padding: 28px 20px;
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      margin-bottom: 22px;
    }

    .score-percent {
      font-size: 3.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .score-detail {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .results-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 22px;
    }

    .review-item {
      background: var(--glass-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 18px 20px;
    }

    .review-q {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 10px;
    }

    .review-ans {
      font-size: 0.88rem;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .content { padding: 16px; }
      .question-card { padding: 18px; }
      .question-text { font-size: 1.02rem; }
    }
  </style>
</head>
<body>
  <div class="mac-window">
    <header class="mac-header">
      <div class="mac-left">
        <div class="traffic-lights">
          <span class="light red"></span>
          <span class="light yellow"></span>
          <span class="light green"></span>
        </div>
        <div class="window-title">Γενική Παθολογία & Παθολογική Ανατομική — Εισαγωγή</div>
      </div>
      <div class="mode-toggle" role="group" aria-label="Επιλογή λειτουργίας">
        <button id="btnStudyMode" class="mode-btn active" type="button">Study Mode</button>
        <button id="btnExamMode" class="mode-btn" type="button">Exam Mode</button>
      </div>
    </header>

    <div id="progressSection" class="progress-wrap">
      <div class="progress-meta">
        <span id="progressLabel">Ερώτηση 1 από 18</span>
        <span id="scoreLiveLabel">Σκορ: 0 / 0</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <main class="content">
      <!-- Quiz View -->
      <section id="quizView">
        <div class="question-card">
          <div id="qBadge" class="q-badge">Ερώτηση 1</div>
          <div id="questionText" class="question-text"></div>
          <div id="optionsList" class="options-list"></div>

          <div id="feedbackPanel" class="feedback-panel">
            <div class="fb-header">
              <span id="fbStatus" class="fb-status"></span>
              <span id="fbSlide" class="slide-badge"></span>
            </div>
            <div class="fb-correct-box">
              <div class="fb-correct-title">Σωστή Απάντηση & Ανάλυση</div>
              <div id="fbCorrectText"></div>
            </div>
            <div class="fb-wrong-title">Ανάλυση Λανθασμένων Επιλογών</div>
            <ul id="fbWrongList" class="fb-wrong-list"></ul>
          </div>
        </div>

        <div class="controls">
          <button id="btnPrev" class="btn" type="button">← Προηγούμενη</button>
          <button id="btnNext" class="btn btn-primary" type="button">Επόμενη →</button>
        </div>
      </section>

      <!-- Results View -->
      <section id="resultsView" class="results-screen">
        <div class="score-hero">
          <div id="scorePercent" class="score-percent">0%</div>
          <div id="scoreDetail" class="score-detail"></div>
          <div class="results-actions">
            <button id="btnRetryAll" class="btn btn-primary" type="button">Επανάληψη Όλων (Σειριακά)</button>
            <button id="btnRetryShuffled" class="btn" type="button">Επανάληψη Όλων (Τυχαία Σειρά)</button>
            <button id="btnRetryWrong" class="btn" type="button">Επανάληψη Μόνο Λαθών</button>
          </div>
        </div>
        <div id="reviewList" class="review-list"></div>
      </section>
    </main>
  </div>

  <script>
    const QUIZ_ID = 'pathology-intro-chytiroglou-part1';

    const mcqData = [
      {
        id: 1,
        question: "Σύμφωνα με τον πρακτικό ορισμό της Παθολογίας και Παθολογικής Ανατομικής, ποια αντιστοίχιση μεταξύ αντικειμένου μελέτης και κλινικού οφέλους είναι ορθή;",
        options: [
          "Η μελέτη αλλοιώσεων και λειτουργικών διαταραχών παρέχει χρήσιμες πληροφορίες για τη διάγνωση των νόσων.",
          "Η μελέτη αλλοιώσεων και λειτουργικών διαταραχών οδηγεί αποκλειστικά στην καλύτερη θεραπευτική αντιμετώπιση.",
          "Η μελέτη της αιτιολογίας και παθογένεσης παρέχει μόνο χρήσιμες πληροφορίες για τη διάγνωση των νόσων.",
          "Η μελέτη της αιτιολογίας και παθογένεσης περιορίζεται στην καταγραφή των μακροσκοπικών οργανικών αλλοιώσεων."
        ],
        correctIndex: 0,
        rationale: {
          correct: "Πρακτικά, η Παθολογία (Πάθος + Λόγος = μελέτη της νόσου) περιλαμβάνει: (1) τη μελέτη με επιστημονική μεθοδολογία των αλλοιώσεων και λειτουργικών διαταραχών σε κύτταρα, ιστούς, όργανα και σύνολο οργανισμού, που προσφέρει χρήσιμες πληροφορίες για τη διάγνωση, και (2) τη μελέτη της αιτιολογίας και παθογένεσης, όπου η κατανόηση της αιτιοπαθογένεσης οδηγεί σε καλύτερη θεραπευτική αντιμετώπιση.",
          wrong: [
            "Επιλογή για θεραπευτική αντιμετώπιση από αλλοιώσεις: Αντιστρέφει τη συσχέτιση· η καλύτερη θεραπευτική αντιμετώπιση προκύπτει από την κατανόηση της αιτιοπαθογένεσης.",
            "Επιλογή για διάγνωση από αιτιολογία/παθογένεση: Αντιστρέφει τη συσχέτιση· η διάγνωση υποβοηθείται άμεσα από τη μελέτη των αλλοιώσεων και λειτουργικών διαταραχών.",
            "Επιλογή για περιορισμό σε μακροσκοπικές αλλοιώσεις: Η αιτιολογία και η παθογένεση αφορούν τα αίτια και τους μηχανισμούς των νόσων, όχι απλή καταγραφή μακροσκοπικών ευρημάτων."
          ],
          slide: "Διαφάνειες 2–3"
        }
      },
      {
        id: 2,
        question: "Σχετικά με τις εκδηλώσεις και τα επίπεδα διαταραχών που προκαλούν οι νόσοι, ποια από τις παρακάτω προτάσεις είναι ΛΑΝΘΑΣΜΕΝΗ;",
        options: [
          "Οι νόσοι έχουν αίτια που αποτελούν την αιτιολογία και μηχανισμούς που αποτελούν την παθογένεση.",
          "Οι νόσοι προκαλούν συμπτώματα που αποτελούν αντικειμενικά ευρήματα και σημεία που αποτελούν υποκειμενικά ενοχλήματα.",
          "Οι μακροσκοπικές και μικροσκοπικές διαταραχές που προκαλούν οι νόσοι οφείλονται σε μοριακές διαταραχές.",
          "Οι λειτουργικές διαταραχές ανιχνεύονται με κλινικοεργαστηριακές τεχνικές των οποίων ο αριθμός συνεχώς αυξάνεται."
        ],
        correctIndex: 1,
        rationale: {
          correct: "Η πρόταση είναι λανθασμένη επειδή αντιστρέφει τους ορισμούς: τα συμπτώματα είναι υποκειμενικά ενοχλήματα (όσα αναφέρει ο ασθενής), ενώ τα κλινικά σημεία είναι αντικειμενικά ευρήματα (όσα διαπιστώνει ο ιατρός).",
          wrong: [
            "Επιλογή για αιτιολογία και παθογένεση: Είναι ορθή· αιτιολογία = αίτια, παθογένεση = μηχανισμοί ανάπτυξης της νόσου.",
            "Επιλογή για μοριακές διαταραχές: Είναι ορθή· τόσο οι μακροσκοπικές (ορατές με γυμνό μάτι) όσο και οι μικροσκοπικές διαταραχές οφείλονται σε υποκείμενες μοριακές διαταραχές.",
            "Επιλογή για κλινικοεργαστηριακές τεχνικές: Είναι ορθή· οι λειτουργικές διαταραχές ανιχνεύονται με κλινικοεργαστηριακές τεχνικές που διαρκώς πληθαίνουν."
          ],
          slide: "Διαφάνεια 4"
        }
      },
      {
        id: 3,
        question: "Ποιος θεωρείται βιολογικά ορθός ορισμός της «νόσου» και ποια είναι η κρίσιμη ιδιαιτερότητά του;",
        options: [
          "Κάθε κατάσταση με εμφανή κλινικά σημεία που διαταράσσει την ομοιόσταση και απαιτεί συμπτωματική εκδήλωση.",
          "Κάθε κατάσταση με υποκειμενικά συμπτώματα που προκύπτει από αποτυχία των ομοιοστατικών μηχανισμών του σώματος.",
          "Κάθε κατάσταση που διαταράσσει φυσιολογικές λειτουργίες λόγω αποτυχίας ομοιόστασης, ανεξάρτητα από συμπτώματα ή σημεία.",
          "Κάθε κατάσταση που προκαλεί μακροσκοπικές αλλοιώσεις οργάνων, προϋποθέτοντας πάντοτε την ύπαρξη κλινικών σημείων."
        ],
        correctIndex: 2,
        rationale: {

    // State
    let mode = 'study'; // 'study' | 'exam'

    // DOM refs
    const btnStudyMode = document.getElementById('btnStudyMode');
    const btnExamMode = document.getElementById('btnExamMode');

    const questionText = document.getElementById('questionText');
    const optionsList = document.getElementById('optionsList');
    const feedbackPanel = document.getElementById('feedbackPanel');
    const fbStatus = document.getElementById('fbStatus');
    const fbSlide = document.getElementById('fbSlide');
    const fbCorrectText = document.getElementById('fbCorrectText');
    const fbWrongList = document.getElementById('fbWrongList');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const scorePercent = document.getElementById('scorePercent');
    const scoreDetail = document.getElementById('scoreDetail');
    const btnRetryAll = document.getElementById('btnRetryAll');
    const btnRetryShuffled = document.getElementById('btnRetryShuffled');
    const btnRetryWrong = document.getElementById('btnRetryWrong');
    const reviewList = document.getElementById('reviewList');

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareQuestions(sourceList, shuffleOrder = false) {
      const list = shuffleOrder ? shuffleArray(sourceList) : [...sourceList];
      return list.map(q => {
        const indexedOptions = q.options.map((text, idx) => ({
          text,
          isCorrect: idx === q.correctIndex
        }));
        const shuffledOptions = shuffleArray(indexedOptions);
        return {
          ...q,
          shuffledOptions
        };
      });
    }

    function startQuiz(sourceList = mcqData, shuffleOrder = false) {
      activeQuestions = prepareQuestions(sourceList, shuffleOrder);
      currentIndex = 0;
      userAnswers = {};
      resultsView.classList.remove('visible');
      quizView.classList.remove('hidden');
      progressSection.classList.remove('hidden');
      renderQuestion();
    }

    function getLiveScore() {
      let correct = 0;
      let answered = 0;
      activeQuestions.forEach(q => {
        const sel = userAnswers[q.id];
        if (sel !== undefined) {
          answered++;
          if (q.shuffledOptions[sel].isCorrect) correct++;
        }
      });
      return { correct, answered };
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const total = activeQuestions.length;
      const selectedIdx = userAnswers[q.id];

      progressLabel.textContent = `Ερώτηση ${currentIndex + 1} από ${total}`;
      const { correct, answered } = getLiveScore();
      scoreLiveLabel.textContent = mode === 'study'
        ? `Σκορ: ${correct} / ${answered}`
        : `Απαντημένες: ${answered} / ${total}`;

      progressFill.style.width = `${((currentIndex + 1) / total) * 100}%`;

      qBadge.textContent = `Ερώτηση ${currentIndex + 1}`;
      questionText.textContent = q.question;
      optionsList.innerHTML = '';

      const isLocked = mode === 'study' && selectedIdx !== undefined;

      q.shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.disabled = isLocked;

        if (mode === 'study' && selectedIdx !== undefined) {
          if (opt.isCorrect) {
            btn.classList.add('correct');
          } else if (idx === selectedIdx) {
            btn.classList.add('wrong');
          }
        } else if (mode === 'exam' && idx === selectedIdx) {
          btn.classList.add('selected');
        }

        btn.innerHTML = `
          <span class="opt-letter">${LETTERS[idx]}</span>
          <span>${opt.text}</span>
        `;

        btn.addEventListener('click', () => handleSelectOption(idx));
        optionsList.appendChild(btn);
      });

      if (mode === 'study' && selectedIdx !== undefined) {
        const isCorrect = q.shuffledOptions[selectedIdx].isCorrect;
        fbStatus.textContent = isCorrect ? '✓ Σωστή απάντηση' : '✕ Λανθασμένη απάντηση';
        fbStatus.className = `fb-status ${isCorrect ? 'is-correct' : 'is-wrong'}`;
        fbSlide.textContent = q.rationale.slide;
        fbCorrectText.textContent = q.rationale.correct;
        fbWrongList.innerHTML = q.rationale.wrong.map(item => `<li>${item}</li>`).join('');
        feedbackPanel.classList.add('visible');
      } else {
        feedbackPanel.classList.remove('visible');
      }

      btnPrev.disabled = currentIndex === 0;
      btnNext.textContent = currentIndex === total - 1 ? 'Ολοκλήρωση & Αποτελέσματα →' : 'Επόμενη →';
    }

    function handleSelectOption(idx) {
      const q = activeQuestions[currentIndex];
      if (mode === 'study' && userAnswers[q.id] !== undefined) return;
      userAnswers[q.id] = idx;
      renderQuestion();
    }

    function showResults() {
      quizView.classList.add('hidden');
      progressSection.classList.add('hidden');
      resultsView.classList.add('visible');

      const total = activeQuestions.length;
      let score = 0;
      const wrongQuestions = [];

      activeQuestions.forEach(q => {
        const sel = userAnswers[q.id];
        const isCorrect = sel !== undefined && q.shuffledOptions[sel].isCorrect;
        if (isCorrect) {
          score++;
        } else {
          wrongQuestions.push(q);
        }
      });

      const percentage = Math.round((score / total) * 100);
      scorePercent.textContent = `${percentage}%`;
      scoreDetail.textContent = `Απάντησες σωστά σε ${score} από τις ${total} ερωτήσεις (${mode === 'study' ? 'Study Mode' : 'Exam Mode'}).`;

      btnRetryWrong.disabled = wrongQuestions.length === 0;
      btnRetryWrong.textContent = wrongQuestions.length > 0
        ? `Επανάληψη Λαθών (${wrongQuestions.length})`
        : 'Κανένα Λάθος!';

      // Post score to parent dashboard
      window.parent.postMessage({
        type: 'QUIZ_COMPLETE',
        score,
        total,
        percentage,
        quizId: QUIZ_ID
      }, '*');

      // Render full review
      reviewList.innerHTML = '';
      activeQuestions.forEach((q, idx) => {
        const sel = userAnswers[q.id];
        const isCorrect = sel !== undefined && q.shuffledOptions[sel].isCorrect;
        const userText = sel !== undefined ? q.shuffledOptions[sel].text : 'Δεν απαντήθηκε';
        const correctOpt = q.shuffledOptions.find(o => o.isCorrect);

        const card = document.createElement('div');
        card.className = 'review-item';
        card.innerHTML = `
          <div class="fb-header">
            <span class="fb-status ${isCorrect ? 'is-correct' : 'is-wrong'}">
              ${isCorrect ? '✓ Σωστό' : '✕ Λάθος'} — Ερώτηση ${idx + 1}
            </span>
            <span class="slide-badge">${q.rationale.slide}</span>
          </div>
          <div class="review-q">${q.question}</div>
          <div class="review-ans">
            <strong>Η επιλογή σου:</strong> ${userText}<br/>
            <strong>Σωστή επιλογή:</strong> ${correctOpt.text}
          </div>
          <div class="fb-correct-box">
            <div class="fb-correct-title">Σωστή Απάντηση & Ανάλυση</div>
            <div>${q.rationale.correct}</div>
          </div>
          <div class="fb-wrong-title">Ανάλυση Λανθασμένων Επιλογών</div>
          <ul class="fb-wrong-list">
            ${q.rationale.wrong.map(w => `<li>${w}</li>`).join('')}
          </ul>
        `;
        reviewList.appendChild(card);
      });
    }

    // Event Listeners
    btnStudyMode.addEventListener('click', () => {
      if (mode === 'study') return;
      mode = 'study';
      btnStudyMode.classList.add('active');
      btnExamMode.classList.remove('active');
      renderQuestion();
    });

    btnExamMode.addEventListener('click', () => {
      if (mode === 'exam') return;
      mode = 'exam';
      btnExamMode.classList.add('active');
      btnStudyMode.classList.remove('active');
      renderQuestion();
    });

    btnPrev.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    btnNext.addEventListener('click', () => {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    });

    btnRetryAll.addEventListener('click', () => startQuiz(mcqData, false));
    btnRetryShuffled.addEventListener('click', () => startQuiz(mcqData, true));
    btnRetryWrong.addEventListener('click', () => {
      const wrongIds = new Set(
        activeQuestions
          .filter(q => {
            const sel = userAnswers[q.id];
            return !(sel !== undefined && q.shuffledOptions[sel].isCorrect);
          })
          .map(q => q.id)
      );
      const wrongList = mcqData.filter(q => wrongIds.has(q.id));
      if (wrongList.length > 0) {
        startQuiz(wrongList, false);
      }
    });

    // Init
    startQuiz(mcqData, false);
  </script>
</body>
</html>
