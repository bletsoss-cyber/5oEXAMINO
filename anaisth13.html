<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Anatomy - Advanced MCQs</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --correct-color: rgba(34, 197, 94, 0.2);
            --correct-border: #22c55e;
            --wrong-color: rgba(239, 68, 68, 0.2);
            --wrong-border: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-color) 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 1.25rem;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .option-btn:hover:not(.locked) {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        .option-letter {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .option-btn.locked {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: var(--correct-color);
            border-color: var(--correct-border);
            opacity: 1;
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            border-color: var(--wrong-border);
            opacity: 1;
        }

        #feedback-panel {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid var(--accent-color);
            border-radius: 0 12px 12px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            transform: translateY(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #feedback-panel.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        #next-btn {
            margin-top: 2rem;
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #next-btn.show {
            opacity: 1;
            visibility: visible;
        }

        #next-btn:hover {
            background: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="question-header">
            <span id="question-counter">Ερώτηση 1 / 45</span>
            <span id="score-display">Σκορ: 0</span>
        </div>

        <div class="question-text" id="question-text">
            Φόρτωση...
        </div>

        <div class="options-grid" id="options-grid">
            <!-- Options will be injected here -->
        </div>

        <div id="feedback-panel"></div>

        <button id="next-btn" onclick="nextQuestion()">Επόμενη Ερώτηση</button>
    </div>

        const nextBtn = document.getElementById('next-btn');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const progressFill = document.getElementById('progress-fill');

        function loadQuestion(index) {
            isLocked = false;
            feedbackPanel.classList.remove('show');
            nextBtn.classList.remove('show');
            
            const q = mcqData[index];
            questionText.textContent = `${q.id}. ${q.question}`;
            questionCounter.textContent = `Ερώτηση ${index + 1} / ${mcqData.length}`;
            progressFill.style.width = `${((index + 1) / mcqData.length) * 100}%`;

            optionsGrid.innerHTML = '';
            
            const optionsMap = {
                'a': 'Α',
                'b': 'Β',
                'c': 'Γ',
                'd': 'Δ'
            };

            for (const [key, value] of Object.entries(q.options)) {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-letter">${optionsMap[key]}</span> <span>${value}</span>`;
                btn.onclick = () => selectOption(key, btn, q.correct, q.feedback);
                optionsGrid.appendChild(btn);
            }
        }

        function selectOption(selectedKey, btnElement, correctKey, feedbackText) {
            if (isLocked) return;
            isLocked = true;

            const allBtns = optionsGrid.children;
            
            // Lock all buttons
            for (let btn of allBtns) {
                btn.classList.add('locked');
            }

            // Highlight chosen & correct
            if (selectedKey === correctKey) {
                btnElement.classList.add('correct');
                score++;
                scoreDisplay.textContent = `Σκορ: ${score}`;
            } else {
                btnElement.classList.add('wrong');
                // Find and highlight correct option
                const correctIndex = ['a', 'b', 'c', 'd'].indexOf(correctKey);
                allBtns[correctIndex].classList.add('correct');
            }

            // Show Feedback
            feedbackPanel.textContent = feedbackText;
            feedbackPanel.classList.add('show');

            // Show Next Button
            if (currentIndex < mcqData.length - 1) {
                nextBtn.textContent = "Επόμενη Ερώτηση";
                nextBtn.classList.add('show');
            } else {
                nextBtn.textContent = `Ολοκλήρωση! Τελικό Σκορ: ${score}/${mcqData.length}`;
                nextBtn.classList.add('show');
                nextBtn.onclick = () => location.reload(); // Restart on finish
            }
        }

        function nextQuestion() {
            if (currentIndex < mcqData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            }
        }

        // Init
        loadQuestion(0);
