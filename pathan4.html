<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Παθολογική Ανατομική — Active Recall & Exam Mastery System</title>
<style>
  :root {
    --bg-deep: #070a11;
    --bg-surface: rgba(20, 25, 37, 0.72);
    --bg-surface-solid: #151b28;
    --bg-card: rgba(28, 35, 52, 0.58);
    --bg-card-hover: rgba(38, 48, 70, 0.72);
    --border-glass: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.20);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.16);
    --accent-border: rgba(56, 189, 248, 0.45);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.15);
    --success-border: rgba(52, 211, 153, 0.50);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.15);
    --danger-border: rgba(248, 113, 113, 0.50);
    --warning: #fbbf24;
    --warning-soft: rgba(251, 191, 36, 0.15);
    --warning-border: rgba(251, 191, 36, 0.48);
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, 0.15);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-window: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.06) inset;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: var(--font-stack);
    color: var(--text-primary);
    background-color: var(--bg-deep);
    background-image:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(56, 189, 248, 0.13), transparent 60%),
      radial-gradient(ellipse 70% 55% at 85% 15%, rgba(167, 139, 250, 0.11), transparent 60%),
      radial-gradient(ellipse 65% 60% at 50% 95%, rgba(52, 211, 153, 0.08), transparent 65%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }

  .app-shell {
    max-width: 1120px;
    margin: 24px auto 48px;
    padding: 0 16px;
  }

  .macos-window {
    background: var(--bg-surface);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-window);
    overflow: hidden;
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .macos-window {
      background: var(--bg-surface-solid);
    }
  }

  /* macOS Titlebar */
  .window-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--border-glass);
  }

  .window-title-group {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .traffic-lights {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.red { background: #ff5f57; box-shadow: 0 0 6px rgba(255,95,87,0.45); }
  .dot.yellow { background: #febc2e; box-shadow: 0 0 6px rgba(254,188,46,0.45); }
  .dot.green { background: #28c840; box-shadow: 0 0 6px rgba(40,200,64,0.45); }

  .title-text h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .title-text p {
    margin: 2px 0 0;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .header-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .segmented-control {
    display: inline-flex;
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }

  .seg-btn.active {
    background: rgba(255, 255, 255, 0.14);
    color: var(--text-primary);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--border-glass);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    padding: 7px 13px;
    font-size: 0.84rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    font-family: inherit;
  }

  .btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--border-strong);
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: #e0f2fe;
  }

  .btn-primary:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.26);
  }

  .btn-success {
    background: var(--success-soft);
    border-color: var(--success-border);
    color: #d1fae5;
  }

  .btn-danger {
    background: var(--danger-soft);
    border-color: var(--danger-border);
    color: #fee2e2;
  }

  .btn-warning {
    background: var(--warning-soft);
    border-color: var(--warning-border);
    color: #fef3c7;
  }

  .btn:focus-visible, .seg-btn:focus-visible, .option-btn:focus-visible, .nav-cell:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Alert / Validation / Resume Banners */
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 20px;
    font-size: 0.86rem;
    border-bottom: 1px solid var(--border-glass);
  }
  .banner.info { background: var(--accent-soft); color: #e0f2fe; }
  .banner.error { background: var(--danger-soft); color: #fee2e2; }
  .banner.warn { background: var(--warning-soft); color: #fef3c7; }
  .hidden { display: none !important; }

  /* Progress Bar & Status Strip */
  .status-strip {
    padding: 14px 22px 10px;
    border-bottom: 1px solid var(--border-glass);
    background: rgba(0, 0, 0, 0.14);
  }

  .status-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.84rem;
    color: var(--text-secondary);
  }

  .status-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--border-glass);
    color: var(--text-primary);
  }
  .pill.accent { background: var(--accent-soft); border-color: var(--accent-border); color: #bae6fd; }
  .pill.success { background: var(--success-soft); border-color: var(--success-border); color: #a7f3d0; }
  .pill.danger { background: var(--danger-soft); border-color: var(--danger-border); color: #fecaca; }
  .pill.warning { background: var(--warning-soft); border-color: var(--warning-border); color: #fde68a; }

  .progress-track {
    width: 100%;
    height: 7px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  /* Main Layout */
  .window-body {
    display: grid;
    grid-template-columns: 1fr 270px;
    gap: 0;
  }

  .main-pane {
    padding: 24px 26px 28px;
    min-width: 0;
  }

  .side-pane {
    border-left: 1px solid var(--border-glass);
    background: rgba(0, 0, 0, 0.18);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .side-section h3 {
    margin: 0 0 10px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }

  /* Question Navigator */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .nav-cell {
    position: relative;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-glass);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 650;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .nav-cell:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
  }

  .nav-cell.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.30);
    color: var(--text-primary);
  }

  .nav-cell.answered {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: #e0f2fe;
  }

  .nav-cell.correct {
    background: var(--success-soft);
    border-color: var(--success-border);
    color: #a7f3d0;
  }

  .nav-cell.incorrect {
    background: var(--danger-soft);
    border-color: var(--danger-border);
    color: #fecaca;
  }

  .nav-cell.flagged::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--warning);
  }

  .nav-legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--text-secondary);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid var(--border-glass);
  }

  /* Question Card */
  .q-meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
  }

  .q-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .q-text {
    font-size: 1.14rem;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 20px;
    color: var(--text-primary);
  }

  /* Confidence Selector */
  .confidence-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  .conf-btn {
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-glass);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .conf-btn.active.low { background: var(--danger-soft); border-color: var(--danger-border); color: #fecaca; }
  .conf-btn.active.medium { background: var(--warning-soft); border-color: var(--warning-border); color: #fde68a; }
  .conf-btn.active.high { background: var(--success-soft); border-color: var(--success-border); color: #a7f3d0; }

  /* Options */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-glass);
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 0.96rem;
    line-height: 1.48;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    font-family: inherit;
  }

  .option-btn:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-key {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border-glass);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .option-text {
    flex: 1;
    min-width: 0;
  }

  .option-status {
    flex-shrink: 0;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 2px;
  }

  .option-btn.selected {
    background: var(--accent-soft);
    border-color: var(--accent-border);
  }
  .option-btn.selected .option-key {
    background: var(--accent);
    color: #06131f;
    border-color: var(--accent);
  }

  .option-btn.correct {
    background: var(--success-soft);
    border-color: var(--success-border);
  }
  .option-btn.correct .option-key {
    background: var(--success);
    color: #052e1e;
    border-color: var(--success);
  }
  .option-btn.correct .option-status {
    background: rgba(52, 211, 153, 0.22);
    color: #a7f3d0;
  }

  .option-btn.incorrect {
    background: var(--danger-soft);
    border-color: var(--danger-border);
  }
  .option-btn.incorrect .option-key {
    background: var(--danger);
    color: #3b0808;
    border-color: var(--danger);
  }
  .option-btn.incorrect .option-status {
    background: rgba(248, 113, 113, 0.22);
    color: #fecaca;
  }

  /* Action Bar */
  .action-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border-glass);
  }

  .action-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Feedback Panel */
  .feedback-panel {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .fb-card {
    padding: 16px 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-glass);
    background: rgba(15, 20, 32, 0.75);
  }

  .fb-card.correct-box {
    border-color: var(--success-border);
    background: rgba(52, 211, 153, 0.08);
  }

  .fb-card.takeaway-box {
    border-color: var(--accent-border);
    background: rgba(56, 189, 248, 0.08);
  }

  .fb-title {
    margin: 0 0 8px;
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .fb-card.correct-box .fb-title { color: var(--success); }
  .fb-card.takeaway-box .fb-title { color: var(--accent); }
  .fb-card.wrong-box .fb-title { color: var(--danger); }

  .fb-quote {
    margin: 0 0 8px;
    padding: 8px 12px;
    border-left: 3px solid var(--success);
    background: rgba(255, 255, 255, 0.04);
    border-radius: 0 8px 8px 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .fb-text {
    margin: 0;
    font-size: 0.91rem;
    color: #dbe4f0;
    line-height: 1.58;
  }

  .wrong-item {
    padding: 11px 13px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(248, 113, 113, 0.22);
    margin-bottom: 10px;
  }
  .wrong-item:last-child { margin-bottom: 0; }

  .wrong-opt-label {
    font-size: 0.86rem;
    font-weight: 650;
    color: #fecaca;
    margin-bottom: 5px;
  }

  .source-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  /* Results Dashboard */
  .results-view {
    padding: 24px 26px 32px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 16px 0 22px;
  }

  .stat-card {
    padding: 15px 16px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
  }

  .stat-label {
    font-size: 0.76rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stat-value {
    font-size: 1.6rem;
    font-weight: 750;
    margin-top: 4px;
    color: var(--text-primary);
  }

  .analytics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .analytics-card {
    padding: 16px 18px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
  }

  .analytics-card h3 {
    margin: 0 0 12px;
    font-size: 0.9rem;
    color: var(--text-primary);
  }

  .metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.84rem;
  }
  .metric-row:last-child { border-bottom: none; }

  .smart-review-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 24px;
  }

  .review-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .review-card {
    padding: 16px 18px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
    margin-bottom: 14px;
  }

  .disclaimer-note {
    font-size: 0.82rem;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-glass);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 18px;
  }

  /* Shortcuts & Tools */
  .shortcuts-list {
    font-size: 0.76rem;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  kbd {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border-glass);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 0.72rem;
    color: var(--text-primary);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
  }

  .modal-box {
    max-width: 460px;
    width: 100%;
    background: #141a27;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
  }

  .modal-box h3 { margin: 0 0 8px; font-size: 1.02rem; }
  .modal-box p { margin: 0 0 18px; font-size: 0.88rem; color: var(--text-secondary); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 860px) {
    .window-body {
      grid-template-columns: 1fr;
    }
    .side-pane {
      border-left: none;
      border-top: 1px solid var(--border-glass);
    }
    .nav-grid {
      grid-template-columns: repeat(9, 1fr);
    }
  }

  @media (max-width: 560px) {
    .app-shell { padding: 0 8px; margin-top: 10px; }
    .main-pane, .results-view { padding: 16px; }
    .nav-grid { grid-template-columns: repeat(6, 1fr); }
    .q-text { font-size: 1.02rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

/* =========================================================================
   2. RUNTIME DATA VALIDATION
   ========================================================================= */
function validateQuizData(data) {
  const errors = [];
  if (!Array.isArray(data)) {
    return ["Ο πίνακας mcqData δεν είναι έγκυρος πίνακας."];
  }
  if (data.length === 0) {
    return ["Ο πίνακας mcqData είναι κενός. Προσθέστε ερωτήσεις για να ξεκινήσετε."];
  }
  const seenIds = new Set();
  data.forEach((q, idx) => {
    const label = `Ερώτηση #${idx + 1} (id: ${q && q.id})`;
    if (!q || typeof q !== "object") {
      errors.push(`${label}: μη έγκυρο αντικείμενο.`);
      return;
    }
    if (typeof q.id !== "number" || seenIds.has(q.id)) {
      errors.push(`${label}: μη μοναδικό ή μη αριθμητικό id.`);
    } else {
      seenIds.add(q.id);
    }
    if (!q.question || typeof q.question !== "string") {
      errors.push(`${label}: λείπει η εκφώνηση.`);
    }
    if (!Array.isArray(q.options) || q.options.length !== 4) {
      errors.push(`${label}: απαιτούνται ακριβώς 4 επιλογές.`);
    } else {
      const optIds = q.options.map(o => o && o.id);
      const uniqueOptIds = new Set(optIds.filter(Boolean));
      if (uniqueOptIds.size !== 4) {
        errors.push(`${label}: τα option IDs πρέπει να είναι 4 και μοναδικά.`);
      }
      if (!uniqueOptIds.has(q.correctId)) {
        errors.push(`${label}: το correctId δεν αντιστοιχεί σε υπαρκτή επιλογή.`);
      }
      const wrongObj = q.rationale && q.rationale.wrong;
      if (!wrongObj || typeof wrongObj !== "object") {
        errors.push(`${label}: λείπει το αντικείμενο rationale.wrong.`);
      } else {
        const expectedWrong = [...uniqueOptIds].filter(id => id !== q.correctId);
        const actualWrong = Object.keys(wrongObj);
        if (actualWrong.length !== 3 || !expectedWrong.every(id => actualWrong.includes(id))) {
          errors.push(`${label}: το rationale.wrong πρέπει να περιέχει ακριβώς τα 3 λανθασμένα option IDs.`);
        }
      }
    }
    if (!q.rationale || !q.rationale.correct || !q.rationale.takeaway) {
      errors.push(`${label}: λείπει rationale.correct ή rationale.takeaway.`);
    }
    if (!Array.isArray(q.slides) || q.slides.length === 0 || !q.sourceRef) {
      errors.push(`${label}: λείπει αναφορά διαφάνειας (slides / sourceRef).`);
    }
  });
  return errors;
}

/* =========================================================================
   3. UTILITIES (SHUFFLE, STORAGE, LABELS, SAFE DOM)
   ========================================================================= */
function fisherYatesShuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

const STORAGE_KEY = `pathology_quiz_state_${quizConfig.quizId}`;
let storageAvailable = true;

function safeLoadStorage() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    return parsed;
  } catch (e) {
    storageAvailable = false;
    return null;
  }
}

function safeSaveStorage(payload) {
  if (!storageAvailable) return;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    storageAvailable = false;
    showStorageWarning("Η μόνιμη αποθήκευση (localStorage) δεν είναι διαθέσιμη. Η εφαρμογή συνεχίζει κανονικά χωρίς αποθήκευση.");
  }
}

function safeClearStorage() {
  try {
    window.localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

const dataMap = new Map(mcqData.map(q => [q.id, q]));

let persistentState = {
  bookmarks: [],
  confidenceEnabled: false,
  history: [],
  activeAttempt: null
};

let attempt = null;
let timerInterval = null;
let isSubmitting = false;
let modalCallback = null;
let reviewFilter = "all";

function createNewAttempt(options = {}) {
  const mode = options.mode || "study";
  const questionIds = options.questionIds && options.questionIds.length
    ? options.questionIds.slice()
    : mcqData.map(q => q.id);
  const finalOrder = options.shuffleQuestions ? fisherYatesShuffle(questionIds) : questionIds;
  const optionOrders = {};
  finalOrder.forEach(qid => {
    const q = dataMap.get(qid);
    if (q) {
      optionOrders[qid] = fisherYatesShuffle(q.options.map(o => o.id));
    }
  });
  return {
    attemptId: `att_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    mode,
    subsetLabel: options.subsetLabel || "Πλήρες σετ",
    questionOrder: finalOrder,
    optionOrders,
    currentIndex: 0,
    answers: {},
    locked: {},
    confidence: {},
    completed: false,
    postMessageSent: false,
    elapsedSeconds: 0,
    startedAt: Date.now()
  };
}

function syncAttemptWithDataset(savedAttempt) {
  if (!savedAttempt || !Array.isArray(savedAttempt.questionOrder)) return null;
  // Keep valid existing question IDs; if full set and new questions were appended, add them at end
  const validOrder = savedAttempt.questionOrder.filter(id => dataMap.has(id));
  if (validOrder.length === 0) return null;

  if (savedAttempt.subsetLabel === "Πλήρες σετ" && !savedAttempt.completed) {
    const inOrder = new Set(validOrder);
    mcqData.forEach(q => {
      if (!inOrder.has(q.id)) {
        validOrder.push(q.id);
      }
    });
  }

  const optionOrders = Object.assign({}, savedAttempt.optionOrders || {});
  const answers = {};
  const locked = {};
  const confidence = {};

  validOrder.forEach(qid => {
    const q = dataMap.get(qid);
    const validOptIds = new Set(q.options.map(o => o.id));
    if (!Array.isArray(optionOrders[qid]) || optionOrders[qid].length !== 4 || !optionOrders[qid].every(id => validOptIds.has(id))) {
      optionOrders[qid] = fisherYatesShuffle(q.options.map(o => o.id));
    }
    if (savedAttempt.answers && validOptIds.has(savedAttempt.answers[qid])) {
      answers[qid] = savedAttempt.answers[qid];
    }
    if (savedAttempt.locked && savedAttempt.locked[qid] && answers[qid]) {
      locked[qid] = true;
    }
    if (savedAttempt.confidence && savedAttempt.confidence[qid]) {
      confidence[qid] = savedAttempt.confidence[qid];
    }
  });

  return {
    attemptId: savedAttempt.attemptId || `att_${Date.now()}`,
    mode: savedAttempt.mode === "exam" ? "exam" : "study",
    subsetLabel: savedAttempt.subsetLabel || "Πλήρες σετ",
    questionOrder: validOrder,
    optionOrders,
    currentIndex: Math.min(Math.max(0, savedAttempt.currentIndex || 0), validOrder.length - 1),
    answers,
    locked,
    confidence,
    completed: Boolean(savedAttempt.completed),
    postMessageSent: Boolean(savedAttempt.postMessageSent),
    elapsedSeconds: Number(savedAttempt.elapsedSeconds) || 0,
    startedAt: savedAttempt.startedAt || Date.now()
  };
}

function saveAll() {
  persistentState.activeAttempt = attempt;
  safeSaveStorage(persistentState);
}

      dom.timerDisplay.textContent = formatTime(attempt.elapsedSeconds);

function renderApp() {
  if (!attempt) return;
  dom.modeStudyBtn.classList.toggle("active", attempt.mode === "study");
  dom.modeStudyBtn.setAttribute("aria-selected", String(attempt.mode === "study"));
  dom.modeExamBtn.classList.toggle("active", attempt.mode === "exam");
  dom.modeExamBtn.setAttribute("aria-selected", String(attempt.mode === "exam"));
  dom.confToggle.checked = persistentState.confidenceEnabled;

  if (attempt.completed) {
    dom.quizView.classList.add("hidden");
    dom.statusStrip.classList.add("hidden");
    dom.resultsView.classList.remove("hidden");
    dom.finishBtn.classList.add("hidden");
    stopTimer();
    renderResults();
  } else {
    dom.resultsView.classList.add("hidden");
    dom.quizView.classList.remove("hidden");
    dom.statusStrip.classList.remove("hidden");
    dom.finishBtn.classList.remove("hidden");
    dom.finishBtn.textContent = attempt.mode === "exam" ? "Υποβολή Εξέτασης" : "Ολοκλήρωση & Αποτελέσματα";
    renderQuestion();
    renderNavigator();
    renderStatus();
  }
}

function renderStatus() {
  const total = attempt.questionOrder.length;
  const answeredCount = attempt.questionOrder.filter(id => Boolean(attempt.answers[id])).length;
  const flaggedCount = attempt.questionOrder.filter(id => persistentState.bookmarks.includes(id)).length;

  dom.counterPill.textContent = `Ερώτηση ${attempt.currentIndex + 1} / ${total}`;
  dom.answeredPill.textContent = `Απαντημένες: ${answeredCount} / ${total}`;
  dom.subsetPill.textContent = attempt.subsetLabel;
  dom.timerDisplay.textContent = formatTime(attempt.elapsedSeconds);

  if (flaggedCount > 0) {
    dom.flaggedPill.textContent = `★ Επισημασμένες: ${flaggedCount}`;
    dom.flaggedPill.classList.remove("hidden");
  } else {
    dom.flaggedPill.classList.add("hidden");
  }

  const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
  dom.progressFill.style.width = `${pct}%`;
}

function renderQuestion() {
  const qid = attempt.questionOrder[attempt.currentIndex];
  const q = dataMap.get(qid);
  if (!q) return;

  const userAnswer = attempt.answers[qid] || null;
  const isLocked = attempt.mode === "study" && Boolean(attempt.locked[qid]);
  const isBookmarked = persistentState.bookmarks.includes(qid);

  // Tags (never reveal answer or source before answer in exam mode)
  dom.qTags.replaceChildren();
  dom.qTags.appendChild(el("span", "pill accent", q.topic));
  dom.qTags.appendChild(el("span", "pill", TYPE_LABELS[q.type] || q.type));
  dom.qTags.appendChild(el("span", "pill", `Δυσκολία: ${DIFF_LABELS[q.difficulty] || q.difficulty}`));

  // Bookmark button
  dom.bookmarkBtn.textContent = isBookmarked ? "★ Επισημασμένη (F)" : "☆ Επισήμανση (F)";
  dom.bookmarkBtn.setAttribute("aria-pressed", String(isBookmarked));
  dom.bookmarkBtn.classList.toggle("btn-warning", isBookmarked);

  // Question stem
  dom.questionText.textContent = q.question;

  // Confidence bar
  if (persistentState.confidenceEnabled && !isLocked) {
    dom.confidenceBar.classList.remove("hidden");
    const curConf = attempt.confidence[qid] || null;
    dom.confidenceBar.querySelectorAll(".conf-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.conf === curConf);
    });
  } else {
    dom.confidenceBar.classList.add("hidden");
  }

  // Options (in attempt's fixed shuffled order)
  dom.optionsList.replaceChildren();
  const order = attempt.optionOrders[qid];
  const optMap = new Map(q.options.map(o => [o.id, o]));

  order.forEach((optId, idx) => {
    const opt = optMap.get(optId);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.dataset.optId = optId;
    btn.setAttribute("role", "radio");
    btn.setAttribute("aria-checked", String(userAnswer === optId));

    const keyBadge = el("span", "option-key", String(idx + 1));
    const textSpan = el("span", "option-text", opt.text);
    btn.appendChild(keyBadge);
    btn.appendChild(textSpan);

    if (isLocked) {
      btn.disabled = true;
      if (optId === q.correctId) {
        btn.classList.add("correct");
        btn.appendChild(el("span", "option-status", "✓ Σωστή"));
      } else if (optId === userAnswer) {
        btn.classList.add("incorrect");
        btn.appendChild(el("span", "option-status", "✕ Λανθασμένη"));
      }
    } else if (userAnswer === optId) {
      btn.classList.add("selected");
      btn.appendChild(el("span", "option-status", "Επιλεγμένη"));
    }

    btn.addEventListener("click", () => handleSelectOption(optId));
    dom.optionsList.appendChild(btn);
  });

  // Navigation buttons
  dom.prevBtn.disabled = attempt.currentIndex === 0;
  const isLast = attempt.currentIndex === attempt.questionOrder.length - 1;
  dom.nextBtn.textContent = isLast ? "Ολοκλήρωση →" : "Επόμενη →";

  if (attempt.mode === "exam") {
    dom.examSubmitBtn.classList.remove("hidden");
  } else {
    dom.examSubmitBtn.classList.add("hidden");
  }

  // Feedback panel (Study Mode only, after lock)
  if (isLocked) {
    renderFeedbackPanel(q, userAnswer);
    dom.feedbackPanel.classList.remove("hidden");
  } else {
    dom.feedbackPanel.replaceChildren();
    dom.feedbackPanel.classList.add("hidden");
  }
}

function renderFeedbackPanel(q, userAnswer) {
  dom.feedbackPanel.replaceChildren();
  const optMap = new Map(q.options.map(o => [o.id, o]));
  const correctOpt = optMap.get(q.correctId);
  const isCorrect = userAnswer === q.correctId;

  // Correct Answer Section
  const correctCard = el("div", "fb-card correct-box");
  correctCard.appendChild(el("div", "fb-title", isCorrect ? "✓ Σωστή Απάντηση" : "✓ Σωστή Απάντηση (Αναλυτική Εξήγηση)"));
  correctCard.appendChild(el("div", "fb-quote", correctOpt.text));
  correctCard.appendChild(el("p", "fb-text", q.rationale.correct));
  dom.feedbackPanel.appendChild(correctCard);

  // Wrong Answers Analysis (following current shuffled order for natural reading, NEVER using fixed α/β/γ/δ)
  const wrongCard = el("div", "fb-card wrong-box");
  wrongCard.appendChild(el("div", "fb-title", "✕ Ανάλυση Παγίδων (Λανθασμένες Επιλογές)"));

  const order = attempt.optionOrders[q.id] || q.options.map(o => o.id);
  order.forEach(optId => {
    if (optId === q.correctId) return;
    const opt = optMap.get(optId);
    const item = el("div", "wrong-item");
    const chosenMarker = optId === userAnswer ? " [Η επιλογή σου]" : "";
    item.appendChild(el("div", "wrong-opt-label", `• ${opt.text}${chosenMarker}`));
    item.appendChild(el("p", "fb-text", q.rationale.wrong[optId]));
    wrongCard.appendChild(item);
  });
  dom.feedbackPanel.appendChild(wrongCard);

  // High-Yield Takeaway
  const takeawayCard = el("div", "fb-card takeaway-box");
  takeawayCard.appendChild(el("div", "fb-title", "★ High-Yield Takeaway"));
  takeawayCard.appendChild(el("p", "fb-text", q.rationale.takeaway));
  dom.feedbackPanel.appendChild(takeawayCard);

  // Source Reference
  const sourceCard = el("div", "fb-card");
  const sourceFooter = el("div", "source-footer");
  sourceFooter.appendChild(el("span", "pill accent", `Πηγή: ${q.sourceRef}`));
  if (attempt.confidence[q.id]) {
    sourceFooter.appendChild(el("span", "pill", `Βεβαιότητα: ${CONF_LABELS[attempt.confidence[q.id]]}`));
  }
  sourceCard.appendChild(sourceFooter);
  dom.feedbackPanel.appendChild(sourceCard);
}

function renderNavigator() {
  dom.navGrid.replaceChildren();
  attempt.questionOrder.forEach((qid, idx) => {
    const btn = el("button", "nav-cell", String(idx + 1));
    btn.type = "button";
    btn.title = `Ερώτηση ${idx + 1}`;
    if (idx === attempt.currentIndex) btn.classList.add("current");

    const ans = attempt.answers[qid];
    if (attempt.mode === "study" && attempt.locked[qid]) {
      const q = dataMap.get(qid);
      btn.classList.add(ans === q.correctId ? "correct" : "incorrect");
    } else if (ans) {
      btn.classList.add("answered");
    }

    if (persistentState.bookmarks.includes(qid)) {
      btn.classList.add("flagged");
    }

    btn.addEventListener("click", () => {
      attempt.currentIndex = idx;
      saveAll();
      renderQuestion();
      renderNavigator();
      renderStatus();
    });
    dom.navGrid.appendChild(btn);
  });

  // Legend
  dom.navLegend.replaceChildren();
  const items = attempt.mode === "study"
    ? [
        { label: "Σωστή", bg: "var(--success-soft)", bd: "var(--success-border)" },
        { label: "Λανθασμένη", bg: "var(--danger-soft)", bd: "var(--danger-border)" },
        { label: "Αναπάντητη", bg: "rgba(255,255,255,0.04)", bd: "var(--border-glass)" },
        { label: "Επισημασμένη", bg: "var(--warning)", bd: "var(--warning)" }
      ]
    : [
        { label: "Απαντημένη", bg: "var(--accent-soft)", bd: "var(--accent-border)" },
        { label: "Αναπάντητη", bg: "rgba(255,255,255,0.04)", bd: "var(--border-glass)" },
        { label: "Τρέχουσα", bg: "transparent", bd: "var(--accent)" },
        { label: "Επισημασμένη", bg: "var(--warning)", bd: "var(--warning)" }
      ];

  items.forEach(it => {
    const row = el("div", "legend-item");
    const sw = el("span", "legend-swatch");
    sw.style.background = it.bg;
    sw.style.borderColor = it.bd;
    row.appendChild(sw);
    row.appendChild(el("span", "", it.label));
    dom.navLegend.appendChild(row);
  });
}

/* =========================================================================
   8. INTERACTION HANDLERS
   ========================================================================= */
function handleSelectOption(optId) {
  if (!attempt || attempt.completed || isSubmitting) return;
  const qid = attempt.questionOrder[attempt.currentIndex];
  if (attempt.mode === "study" && attempt.locked[qid]) return;

  isSubmitting = true;
  attempt.answers[qid] = optId;
  if (attempt.mode === "study") {
    attempt.locked[qid] = true;
  }
  saveAll();
  renderQuestion();
  renderNavigator();
  renderStatus();
  setTimeout(() => { isSubmitting = false; }, 120);
}

function toggleBookmark() {
  if (!attempt || attempt.completed) return;
  const qid = attempt.questionOrder[attempt.currentIndex];
  const idx = persistentState.bookmarks.indexOf(qid);
  if (idx >= 0) {
    persistentState.bookmarks.splice(idx, 1);
  } else {
    persistentState.bookmarks.push(qid);
  }
  saveAll();
  renderQuestion();
  renderNavigator();
  renderStatus();
}

function goNext() {
  if (!attempt || attempt.completed) return;
  if (attempt.currentIndex < attempt.questionOrder.length - 1) {
    attempt.currentIndex += 1;
    saveAll();
    renderQuestion();
    renderNavigator();
    renderStatus();
  } else {
    requestFinishAttempt();
  }
}

function goPrev() {
  if (!attempt || attempt.completed) return;
  if (attempt.currentIndex > 0) {
    attempt.currentIndex -= 1;
    saveAll();
    renderQuestion();
    renderNavigator();
    renderStatus();
  }
}

function requestModeSwitch(targetMode) {
  if (!attempt || attempt.mode === targetMode) return;
  const hasProgress = Object.keys(attempt.answers).length > 0 && !attempt.completed;
  if (!hasProgress) {
    attempt = createNewAttempt({ mode: targetMode });
    saveAll();
    startTimer();
    renderApp();
    return;
  }
  openModal(
    `Αλλαγή σε ${targetMode === "exam" ? "Exam Mode" : "Study Mode"};`,
    "Η αλλαγή λειτουργίας κατά τη διάρκεια ενεργής προσπάθειας θα ξεκινήσει νέα προσπάθεια χωρίς αποκάλυψη των απαντήσεων της τρέχουσας εξέτασης.",
    () => {
      attempt = createNewAttempt({ mode: targetMode });
      saveAll();
      startTimer();
      renderApp();
    }
  );
}

function requestFinishAttempt() {
  if (!attempt || attempt.completed) return;
  const total = attempt.questionOrder.length;
  const answered = attempt.questionOrder.filter(id => Boolean(attempt.answers[id])).length;
  const unanswered = total - answered;

  const msg = unanswered > 0
    ? `Έχεις ${unanswered} αναπάντητες ερωτήσεις από τις ${total}. Οι αναπάντητες ερωτήσεις δεν προσμετρώνται ως σωστές. Θέλεις να ολοκληρώσεις την προσπάθεια;`
    : `Έχεις απαντήσει και στις ${total} ερωτήσεις. Θέλεις να υποβάλεις οριστικά την προσπάθεια και να δεις τα αναλυτικά αποτελέσματα;`;

  openModal("Οριστική Υποβολή Προσπάθειας", msg, () => {
    completeAttempt();
  });
}

function completeAttempt() {
  if (!attempt || attempt.completed) return;
  attempt.completed = true;
  stopTimer();

  const stats = computeAttemptStats(attempt);

  // Record in history
  persistentState.history.push({
    attemptId: attempt.attemptId,
    completedAt: Date.now(),
    mode: attempt.mode,
    subsetLabel: attempt.subsetLabel,
    score: stats.correct,
    total: stats.total,
    unanswered: stats.unanswered,
    percentage: stats.percentage,
    elapsedSeconds: attempt.elapsedSeconds
  });

  // Parent Dashboard postMessage (strictly once per completed attempt)
  if (!attempt.postMessageSent) {
    attempt.postMessageSent = true;
    try {
      if (window.parent && window.parent !== window) {
        const targetOrigin = (window.location && window.location.origin && window.location.origin !== "null")
          ? "*"
          : "*";
        window.parent.postMessage(
          {
            type: "QUIZ_COMPLETE",
            score: stats.correct,
            total: stats.total,
            percentage: stats.percentage,
            quizId: quizConfig.quizId
          },
          targetOrigin
        );
      }
    } catch (e) {}
  }

  saveAll();
  renderApp();
}

/* =========================================================================
   9. ANALYTICS & RESULTS DASHBOARD
   ========================================================================= */
function computeAttemptStats(att) {
  const total = att.questionOrder.length;
  let correct = 0;
  let incorrect = 0;
  let unanswered = 0;
  let flagged = 0;
  const incorrectIds = [];
  const unansweredIds = [];
  const flaggedIds = [];
  const lowConfCorrectIds = [];
  const highConfIncorrectIds = [];

  const bySlide = {};
  const byTopic = {};
  const byType = {};
  const byDiff = {};
  const confCounts = { low: 0, medium: 0, high: 0 };

  let hasMultiSlide = false;

  att.questionOrder.forEach(qid => {
    const q = dataMap.get(qid);
    const ans = att.answers[qid] || null;
    const conf = att.confidence[qid] || null;
    const isRight = ans === q.correctId;

    if (persistentState.bookmarks.includes(qid)) {
      flagged += 1;
      flaggedIds.push(qid);
    }

    if (!ans) {
      unanswered += 1;
      unansweredIds.push(qid);
    } else if (isRight) {
      correct += 1;
      if (conf === "low") lowConfCorrectIds.push(qid);
    } else {
      incorrect += 1;
      incorrectIds.push(qid);
      if (conf === "high") highConfIncorrectIds.push(qid);
    }

    if (conf && confCounts[conf] !== undefined) confCounts[conf] += 1;

    if (q.slides.length > 1) hasMultiSlide = true;
    q.slides.forEach(sl => {
      if (!bySlide[sl]) bySlide[sl] = { total: 0, correct: 0 };
      bySlide[sl].total += 1;
      if (isRight) bySlide[sl].correct += 1;
    });

    if (!byTopic[q.topic]) byTopic[q.topic] = { total: 0, correct: 0 };
    byTopic[q.topic].total += 1;
    if (isRight) byTopic[q.topic].correct += 1;

    const tLabel = TYPE_LABELS[q.type] || q.type;
    if (!byType[tLabel]) byType[tLabel] = { total: 0, correct: 0 };
    byType[tLabel].total += 1;
    if (isRight) byType[tLabel].correct += 1;

    const dLabel = DIFF_LABELS[q.difficulty] || q.difficulty;
    if (!byDiff[dLabel]) byDiff[dLabel] = { total: 0, correct: 0 };
    byDiff[dLabel].total += 1;
    if (isRight) byDiff[dLabel].correct += 1;
  });

  const weakSet = new Set([...incorrectIds, ...unansweredIds, ...flaggedIds, ...lowConfCorrectIds]);
  const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

  return {
    total, correct, incorrect, unanswered, flagged, percentage,
    incorrectIds, unansweredIds, flaggedIds, lowConfCorrectIds, highConfIncorrectIds,
    weakIds: [...weakSet],
    bySlide, byTopic, byType, byDiff, confCounts, hasMultiSlide
  };
}

function renderResults() {
  dom.resultsView.replaceChildren();
  const s = computeAttemptStats(attempt);

  const header = el("div", "q-meta-row");
  header.appendChild(el("h2", "", `Αποτελέσματα Προσπάθειας — ${attempt.subsetLabel}`));
  header.appendChild(el("span", "pill accent", attempt.mode === "exam" ? "Exam Mode" : "Study Mode"));
  dom.resultsView.appendChild(header);

  const disclaimer = el(
    "div",
    "disclaimer-note",
    "Σημείωση: Το ποσοστό επιτυχίας αποτυπώνει την επίδοση στη συγκεκριμένη προσπάθεια και δεν αποτελεί από μόνο του απόδειξη πλήρους κατάκτησης της ύλης. Χρησιμοποίησε τα παρακάτω αναλυτικά δεδομένα και τις επιλογές στοχευμένης επανάληψης για εμβάθυνση."
  );
  dom.resultsView.appendChild(disclaimer);

  // Core stats
  const statsGrid = el("div", "stats-grid");
  const coreCards = [
    { label: "Ποσοστό Επιτυχίας", val: `${s.percentage}%` },
    { label: "Σωστές", val: `${s.correct} / ${s.total}` },
    { label: "Λανθασμένες", val: String(s.incorrect) },
    { label: "Αναπάντητες", val: String(s.unanswered) },
    { label: "Επισημασμένες", val: String(s.flagged) },
    { label: "Χρόνος", val: formatTime(attempt.elapsedSeconds) }
  ];
  coreCards.forEach(c => {
    const card = el("div", "stat-card");
    card.appendChild(el("div", "stat-label", c.label));
    card.appendChild(el("div", "stat-value", c.val));
    statsGrid.appendChild(card);
  });
  dom.resultsView.appendChild(statsGrid);

  // Smart Review Modes
  dom.resultsView.appendChild(el("h3", "", "Smart Review — Στοχευμένη Επανάληψη"));
  const srGrid = el("div", "smart-review-grid");
  const reviewModes = [
    { label: `Όλες (Αρχική σειρά: ${mcqData.length})`, ids: mcqData.map(q => q.id), shuffle: false, subset: "Πλήρες σετ" },
    { label: `Όλες (Τυχαία σειρά: ${mcqData.length})`, ids: mcqData.map(q => q.id), shuffle: true, subset: "Τυχαία σειρά" },
    { label: `Μόνο Λανθασμένες (${s.incorrectIds.length})`, ids: s.incorrectIds, shuffle: false, subset: "Λανθασμένες" },
    { label: `Μόνο Αναπάντητες (${s.unansweredIds.length})`, ids: s.unansweredIds, shuffle: false, subset: "Αναπάντητες" },
    { label: `Μόνο Επισημασμένες (${persistentState.bookmarks.filter(id => dataMap.has(id)).length})`, ids: persistentState.bookmarks.filter(id => dataMap.has(id)), shuffle: false, subset: "Επισημασμένες" },
    { label: `Σωστές Χαμηλής Βεβαιότητας (${s.lowConfCorrectIds.length})`, ids: s.lowConfCorrectIds, shuffle: false, subset: "Χαμηλή βεβαιότητα (σωστές)" },
    { label: `Λανθασμένες Υψηλής Βεβαιότητας (${s.highConfIncorrectIds.length})`, ids: s.highConfIncorrectIds, shuffle: false, subset: "Υψηλή βεβαιότητα (λάθη)" },
    { label: `Συνδυαστικά Αδύναμα Σημεία (${s.weakIds.length})`, ids: s.weakIds, shuffle: false, subset: "Αδύναμα σημεία" }
  ];

  reviewModes.forEach(rm => {
    const b = el("button", "btn btn-primary", rm.label);
    b.type = "button";
    b.disabled = rm.ids.length === 0;
    b.addEventListener("click", () => {
      attempt = createNewAttempt({
        mode: "study",
        questionIds: rm.ids,
        shuffleQuestions: rm.shuffle,
        subsetLabel: rm.subset
      });
      saveAll();
      startTimer();
      renderApp();
    });
    srGrid.appendChild(b);
  });
  dom.resultsView.appendChild(srGrid);

  // Advanced Analytics
  const aGrid = el("div", "analytics-grid");

  // By Slide
  const slideCard = el("div", "analytics-card");
  slideCard.appendChild(el("h3", "", "Επίδοση ανά Διαφάνεια"));
  if (s.hasMultiSlide) {
    slideCard.appendChild(el("p", "fb-text", "Σημείωση: Ερωτήσεις που αντιστοιχούν σε περισσότερες διαφάνειες συμμετέχουν στα στατιστικά καθεμίας."));
  }
  Object.keys(s.bySlide).sort((a, b) => Number(a) - Number(b)).forEach(sl => {
    const d = s.bySlide[sl];
    const pct = Math.round((d.correct / d.total) * 100);
    const r = el("div", "metric-row");
    r.appendChild(el("span", "", `Διαφάνεια ${sl}`));
    r.appendChild(el("span", "", `${d.correct}/${d.total} (${pct}%)`));
    slideCard.appendChild(r);
  });
  aGrid.appendChild(slideCard);

  // By Topic
  const topicCard = el("div", "analytics-card");
  topicCard.appendChild(el("h3", "", "Επίδοση ανά Θεματική Ενότητα"));
  Object.entries(s.byTopic).forEach(([topic, d]) => {
    const pct = Math.round((d.correct / d.total) * 100);
    const r = el("div", "metric-row");
    r.appendChild(el("span", "", topic));
    r.appendChild(el("span", "", `${d.correct}/${d.total} (${pct}%)`));
    topicCard.appendChild(r);
  });
  aGrid.appendChild(topicCard);

  // By Type & Difficulty
  const typeCard = el("div", "analytics-card");
  typeCard.appendChild(el("h3", "", "Επίδοση ανά Τύπο Ερώτησης"));
  Object.entries(s.byType).forEach(([t, d]) => {
    const pct = Math.round((d.correct / d.total) * 100);
    const r = el("div", "metric-row");
    r.appendChild(el("span", "", t));
    r.appendChild(el("span", "", `${d.correct}/${d.total} (${pct}%)`));
    typeCard.appendChild(r);
  });
  aGrid.appendChild(typeCard);

  const diffCard = el("div", "analytics-card");
  diffCard.appendChild(el("h3", "", "Επίδοση ανά Δυσκολία & Βεβαιότητα"));
  Object.entries(s.byDiff).forEach(([df, d]) => {
    const pct = Math.round((d.correct / d.total) * 100);
    const r = el("div", "metric-row");
    r.appendChild(el("span", "", `Δυσκολία: ${df}`));
    r.appendChild(el("span", "", `${d.correct}/${d.total} (${pct}%)`));
    diffCard.appendChild(r);
  });
  const confTotal = s.confCounts.low + s.confCounts.medium + s.confCounts.high;
  if (confTotal > 0) {
    const r1 = el("div", "metric-row");
    r1.appendChild(el("span", "", "Λάθη με Υψηλή Βεβαιότητα"));
    r1.appendChild(el("span", "", String(s.highConfIncorrectIds.length)));
    diffCard.appendChild(r1);
    const r2 = el("div", "metric-row");
    r2.appendChild(el("span", "", "Σωστές με Χαμηλή Βεβαιότητα"));
    r2.appendChild(el("span", "", String(s.lowConfCorrectIds.length)));
    diffCard.appendChild(r2);
  }
  aGrid.appendChild(diffCard);

  dom.resultsView.appendChild(aGrid);

  // Full Review Section
  dom.resultsView.appendChild(el("h3", "", "Πλήρης Ανασκόπηση Ερωτήσεων"));
  const filterBar = el("div", "review-filters");
  const filters = [
    { id: "all", label: `Όλες (${s.total})` },
    { id: "incorrect", label: `Λανθασμένες (${s.incorrect})` },
    { id: "unanswered", label: `Αναπάντητες (${s.unanswered})` },
    { id: "correct", label: `Σωστές (${s.correct})` },
    { id: "flagged", label: `Επισημασμένες (${s.flagged})` }
  ];
  filters.forEach(f => {
    const fb = el("button", `btn ${reviewFilter === f.id ? "btn-primary" : ""}`, f.label);
    fb.type = "button";
    fb.addEventListener("click", () => {
      reviewFilter = f.id;
      renderResults();
    });
    filterBar.appendChild(fb);
  });
  dom.resultsView.appendChild(filterBar);

  attempt.questionOrder.forEach((qid, idx) => {
    const q = dataMap.get(qid);
    const ans = attempt.answers[qid] || null;
    const isRight = ans === q.correctId;
    const isFlag = persistentState.bookmarks.includes(qid);

    if (reviewFilter === "incorrect" && (!ans || isRight)) return;
    if (reviewFilter === "unanswered" && ans) return;
    if (reviewFilter === "correct" && !isRight) return;
    if (reviewFilter === "flagged" && !isFlag) return;

    const card = el("div", "review-card");
    const top = el("div", "q-meta-row");
    const badgeClass = !ans ? "pill warning" : (isRight ? "pill success" : "pill danger");
    const badgeText = !ans ? "Αναπάντητη" : (isRight ? "✓ Σωστή" : "✕ Λανθασμένη");
    top.appendChild(el("span", badgeClass, `#${idx + 1} · ${badgeText}`));
    top.appendChild(el("span", "pill accent", q.sourceRef));
    card.appendChild(top);

    card.appendChild(el("p", "q-text", q.question));

    const optMap = new Map(q.options.map(o => [o.id, o]));
    const userText = ans ? optMap.get(ans).text : "Δεν απαντήθηκε";
    const correctText = optMap.get(q.correctId).text;

    const ansRow = el("p", "fb-text", `Η απάντησή σου: ${userText}`);
    ansRow.style.marginBottom = "6px";
    card.appendChild(ansRow);

    const corRow = el("p", "fb-text", `Σωστή απάντηση: ${correctText}`);
    corRow.style.color = "var(--success)";
    corRow.style.fontWeight = "600";
    corRow.style.marginBottom = "10px";
    card.appendChild(corRow);

    card.appendChild(el("p", "fb-text", q.rationale.correct));

    const tk = el("p", "fb-text", `Takeaway: ${q.rationale.takeaway}`);
    tk.style.marginTop = "8px";
    tk.style.color = "#bae6fd";
    card.appendChild(tk);

    if (attempt.confidence[qid]) {
      const cf = el("p", "fb-text", `Βεβαιότητα: ${CONF_LABELS[attempt.confidence[qid]]}`);
      cf.style.marginTop = "6px";
      cf.style.color = "var(--text-secondary)";
      card.appendChild(cf);
    }

    dom.resultsView.appendChild(card);
  });
}

/* =========================================================================
   10. EXPORT / IMPORT / CLEAR PROGRESS
   ========================================================================= */
function exportProgress() {
  const blob = new Blob([JSON.stringify(persistentState, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${quizConfig.quizId}-progress.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importProgressFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== "object") throw new Error("Invalid JSON");
      persistentState.bookmarks = Array.isArray(parsed.bookmarks) ? parsed.bookmarks.filter(id => dataMap.has(id)) : [];
      persistentState.confidenceEnabled = Boolean(parsed.confidenceEnabled);
      persistentState.history = Array.isArray(parsed.history) ? parsed.history : [];
      const synced = syncAttemptWithDataset(parsed.activeAttempt);
      attempt = synced || createNewAttempt({ mode: "study" });
      saveAll();
      if (!attempt.completed) startTimer();
      renderApp();
    } catch (e) {
      showStorageWarning("Αποτυχία εισαγωγής: το αρχείο JSON δεν έχει έγκυρη δομή.");
    }
  };
  reader.readAsText(file);
}

/* =========================================================================
   11. EVENT LISTENERS & KEYBOARD SHORTCUTS
   ========================================================================= */
dom.modeStudyBtn.addEventListener("click", () => requestModeSwitch("study"));
dom.modeExamBtn.addEventListener("click", () => requestModeSwitch("exam"));
dom.finishBtn.addEventListener("click", requestFinishAttempt);
dom.examSubmitBtn.addEventListener("click", requestFinishAttempt);
dom.prevBtn.addEventListener("click", goPrev);
dom.nextBtn.addEventListener("click", goNext);
dom.bookmarkBtn.addEventListener("click", toggleBookmark);

dom.confToggle.addEventListener("change", () => {
  persistentState.confidenceEnabled = dom.confToggle.checked;
  saveAll();
  renderQuestion();
});

dom.confidenceBar.querySelectorAll(".conf-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!attempt || attempt.completed) return;
    const qid = attempt.questionOrder[attempt.currentIndex];
    attempt.confidence[qid] = btn.dataset.conf;
    saveAll();
    renderQuestion();
  });
});

dom.exportBtn.addEventListener("click", exportProgress);
dom.importBtn.addEventListener("click", () => dom.importFile.click());
dom.importFile.addEventListener("change", e => {
  importProgressFile(e.target.files[0]);
  e.target.value = "";
});

dom.clearDataBtn.addEventListener("click", () => {
  openModal(
    "Διαγραφή Αποθηκευμένων Δεδομένων",
    "Θα διαγραφούν η τρέχουσα πρόοδος, τα bookmarks και το ιστορικό προσπαθειών για το συγκεκριμένο quiz. Η ενέργεια δεν αναιρείται.",
    () => {
      safeClearStorage();
      persistentState = { bookmarks: [], confidenceEnabled: false, history: [], activeAttempt: null };
      attempt = createNewAttempt({ mode: "study" });
      saveAll();
      startTimer();
      renderApp();
    }
  );
});

dom.modalCancelBtn.addEventListener("click", closeModal);
dom.modalConfirmBtn.addEventListener("click", () => {
  const cb = modalCallback;
  closeModal();
  if (typeof cb === "function") cb();
});
dom.modalBackdrop.addEventListener("click", e => {
  if (e.target === dom.modalBackdrop) closeModal();
});

document.addEventListener("keydown", e => {
  if (!dom.modalBackdrop.classList.contains("hidden")) {
    if (e.key === "Escape") closeModal();
    return;
  }
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (!attempt || attempt.completed) return;

  if (["1", "2", "3", "4"].includes(e.key)) {
    const idx = Number(e.key) - 1;
    const qid = attempt.questionOrder[attempt.currentIndex];
    const order = attempt.optionOrders[qid];
    if (order && order[idx]) {
      e.preventDefault();
      handleSelectOption(order[idx]);
    }
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    goNext();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    goPrev();
  } else if (e.key === "f" || e.key === "F" || e.key === "φ" || e.key === "Φ") {
    e.preventDefault();
    toggleBookmark();
  } else if (e.key === "Enter") {
    const qid = attempt.questionOrder[attempt.currentIndex];
    if (attempt.answers[qid]) {
      e.preventDefault();
      goNext();
    }
  }
});

/* =========================================================================
   12. BOOTSTRAP
   ========================================================================= */
(function init() {
  dom.quizTitle.textContent = quizConfig.title;
  dom.quizSubtitle.textContent = quizConfig.subtitle;

  const validationErrors = validateQuizData(mcqData);
  if (validationErrors.length > 0) {
    dom.validationBanner.textContent = `Σφάλμα δεδομένων quiz: ${validationErrors.join(" | ")}`;
    dom.validationBanner.classList.remove("hidden");
    dom.quizView.classList.add("hidden");
    dom.statusStrip.classList.add("hidden");
    return;
  }

  const saved = safeLoadStorage();
  if (!storageAvailable) {
    showStorageWarning("Το localStorage δεν είναι διαθέσιμο σε αυτό το περιβάλλον. Η εφαρμογή λειτουργεί κανονικά χωρίς μόνιμη αποθήκευση.");
  }

  if (saved) {
    persistentState.bookmarks = Array.isArray(saved.bookmarks) ? saved.bookmarks.filter(id => dataMap.has(id)) : [];
    persistentState.confidenceEnabled = Boolean(saved.confidenceEnabled);
    persistentState.history = Array.isArray(saved.history) ? saved.history : [];
    const synced = syncAttemptWithDataset(saved.activeAttempt);
    if (synced && !synced.completed && Object.keys(synced.answers).length > 0) {
      attempt = synced;
      dom.resumeText.textContent = `Βρέθηκε αποθηκευμένη προσπάθεια (${Object.keys(synced.answers).length}/${synced.questionOrder.length} απαντημένες).`;
      dom.resumeBanner.classList.remove("hidden");
      dom.resumeContinueBtn.addEventListener("click", () => {
        dom.resumeBanner.classList.add("hidden");
      });
      dom.resumeRestartBtn.addEventListener("click", () => {
        dom.resumeBanner.classList.add("hidden");
        attempt = createNewAttempt({ mode: "study" });
        saveAll();
        startTimer();
        renderApp();
      });
    } else {
      attempt = synced || createNewAttempt({ mode: "study" });
    }
  } else {
    attempt = createNewAttempt({ mode: "study" });
  }

  saveAll();
  if (!attempt.completed) startTimer();
  renderApp();
})();
</script>
