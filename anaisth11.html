<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Recall | Medical MCQs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0f12;
            --glass-bg: rgba(30, 32, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-blue: #0ea5e9;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.1), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(34, 197, 94, 0.05), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: all 0.3s ease;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #question-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 2rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            color: var(--text-primary);
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(.locked) {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .option-btn.locked {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--correct-green);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
            opacity: 1;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--wrong-red);
            opacity: 1;
        }

        .option-prefix {
            font-weight: 600;
            margin-right: 1rem;
            color: var(--text-secondary);
        }

        .feedback-panel {
            background: rgba(0, 0, 0, 0.2);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 12px 12px 0;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .feedback-panel.hidden {
            display: none;
        }

        #feedback-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .title-correct { color: var(--correct-green); }
        .title-wrong { color: var(--wrong-red); }

        #feedback-rationale {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .reference-badge {
            display: inline-block;
            background: rgba(14, 165, 233, 0.15);
            color: var(--accent-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .mac-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
        }

        .mac-btn:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }

        .mac-btn.hidden {
            display: none;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <header class="quiz-header">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <h2 id="question-counter">Ερώτηση 1 / 60</h2>
        </header>
        
        <main class="quiz-body">
            <h1 id="question-text" class="question-text">Φόρτωση ερώτησης...</h1>
            <div id="options-grid" class="options-grid"></div>
        </main>

        <footer class="quiz-footer">
            <div id="feedback-panel" class="feedback-panel hidden">
                <h3 id="feedback-title"></h3>
                <p id="feedback-rationale"></p>
                <div class="reference-badge" id="feedback-reference"></div>
            </div>
            <button id="next-btn" class="mac-btn hidden">Επόμενη Ερώτηση</button>
        </footer>
    </div>

    <script>
        const mcqData = [
            { id: 1, question: "Ποια κλινική εικόνα περιγράφει με απόλυτη ακρίβεια την κατάσταση της ενσυνείδητης καταστολής;", options: { A: "Πλήρης απώλεια συνείδησης και ισχυρή μυοχάλαση.", B: "Πλήρης διατήρηση συνείδησης με ολική αναλγησία.", C: "Μερική διατήρηση συνείδησης χωρίς πλήρη μυοχάλαση.", D: "Απουσία μηχανικής αναπνοής με ολική μυοχάλαση." }, correct: "C", rationale: "α) Σωστό: Στην ενσυνείδητη καταστολή ο ασθενής έχει αντίληψη (σε μειωμένο βαθμό) και δεν βρίσκεται υπό πλήρη μυοχάλαση. β) Λάθος: Η απώλεια (Α) αφορά τη γενική αναισθησία, η (Β) δεν περιγράφει τη «μέθη» αλλά την τοπική, και η (Δ) είναι φυσιολογικά αδύνατη. γ) Παραπομπή: Κεφ. 1, Ενσυνείδητη καταστολή, Σελ. 28." },
            { id: 2, question: "Ποιο χαρακτηριστικό διαφοροποιεί αυστηρά τον κεντρικό από τον περιφερικό νευρικό αποκλεισμό;", options: { A: "Ο περιφερικός καταστέλλει πλήρως τη συνείδηση.", B: "Ο περιφερικός απαιτεί υποστήριξη της αναπνοής.", C: "Ο κεντρικός αποκλείει τις τελικές απολήξεις.", D: "Ο κεντρικός αφορά τη σπονδυλική στήλη." }, correct: "D", rationale: "α) Σωστό: Η περιοχική αναισθησία (κεντρικός αποκλεισμός) γίνεται με έγχυση στη σπονδυλική στήλη. β) Λάθος: Ο περιφερικός αποκλεισμός δεν καταστέλλει τη συνείδηση (Α) ούτε την αναπνοή (Β), και οι τελικές απολήξεις (Γ) αφορούν δι' εμποτίσεως τοπική, όχι κεντρικό αποκλεισμό. γ) Παραπομπή: Κεφ. 1, Περιοχική αναισθησία, Σελ. 28." },
            { id: 3, question: "Σύμφωνα με το μοντέλο ρευστού μωσαϊκού, ποιος είναι ο δομικός ρόλος των φωσφολιπιδίων στη νευρική μεμβράνη;", options: { A: "Σχηματίζουν ενεργούς διαύλους για τα ιόντα.", B: "Λειτουργούν ως υδρόφοβος φραγμός στη μεμβράνη.", C: "Δρουν ως υδρόφιλος φραγμός στη μεμβράνη.", D: "Αποτελούν αντλίες για ενεργητική μεταφορά ιόντων." }, correct: "B", rationale: "α) Σωστό: Η διπλοστιβάδα φωσφολιπιδίων δρα ως υδρόφοβος φραγμός έναντι μορίων. β) Λάθος: Τους διαύλους (Α) και τις αντλίες (Δ) τις σχηματίζουν οι πρωτεΐνες, ενώ ο φραγμός δεν είναι υδρόφιλος (Γ). γ) Παραπομπή: Κεφ. 2, Δομή του νευρικού ιστού, Σελ. 31-32." },
            { id: 4, question: "Ποια είναι η άμεση φυσιολογική συνέπεια της τοπικής απουσίας μυελίνης στις περισφίξεις του Ranvier;", options: { A: "Αποτρέπουν την εκπόλωση του νευρικού κυττάρου.", B: "Εμποδίζουν τη ροή ιόντων στον νευράξονα.", C: "Επιτρέπουν την κατά άλματα αγωγή ερεθίσματος.", D: "Μειώνουν την ταχύτητα αγωγής της διέγερσης." }, correct: "C", rationale: "α) Σωστό: Η απουσία μυελίνης επιτρέπει στα τοπικά ρεύματα να «πηδούν» από περίσφιξη σε περίσφιξη (κατά άλματα αγωγή). β) Λάθος: Αντιθέτως επιτρέπουν την εκπόλωση (Α), επιτρέπουν την είσοδο ιόντων (Β) και αυξάνουν την ταχύτητα (Δ). γ) Παραπομπή: Κεφ. 2, Δομή του νευρικού ιστού, Σελ. 32-33 & 43." },
            { id: 5, question: "Πώς περιγράφεται η αρχή του διαφορικού νευρικού αποκλεισμού όσον αφορά τη διάμετρο της νευρικής ίνας;", options: { A: "Μεγάλες ίνες απαιτούν υψηλότερη συγκέντρωση αναισθητικού.", B: "Το μέγεθος της ίνας δεν επηρεάζει καθόλου.", C: "Μικρές ίνες απαιτούν υψηλότερη συγκέντρωση αναισθητικού.", D: "Μεγάλες ίνες απαιτούν χαμηλότερη συγκέντρωση αναισθητικού." }, correct: "A", rationale: "α) Σωστό: Όσο μεγαλύτερη είναι η διάμετρος, τόσο μεγαλύτερη συγκέντρωση απαιτείται. β) Λάθος: Το μέγεθος παίζει κρίσιμο ρόλο (Β). Οι λεπτές ίνες (Γ) μπλοκάρονται πιο εύκολα, άρα οι μεγάλες δεν θέλουν χαμηλότερη δόση (Δ). γ) Παραπομπή: Κεφ. 2, Τύποι νευρικών ινών, Σελ. 35-36." },
            { id: 6, question: "Ποιος βασικός κυτταρικός μηχανισμός συμβάλλει καθοριστικά στη διατήρηση της ηλεκτραρνητικότητας του δυναμικού ηρεμίας;", options: { A: "Η παθητική διάχυση ιόντων μέσω φωσφολιπιδίων.", B: "Η αθρόα εισροή θετικών ιόντων νατρίου.", C: "Η πλήρης σύγκλειση των καναλιών καλίου.", D: "Η ενεργητική συμμεταφορά νατρίου και καλίου." }, correct: "D", rationale: "α) Σωστό: Η αντλία νατρίου-καλίου καταναλώνει ATP διατηρώντας το ενδοκυττάριο έλλειμμα θετικών φορτίων. β) Λάθος: Δεν γίνεται διάχυση μέσω φωσφολιπιδίων (Α). Η εισροή νατρίου προκαλεί εκπόλωση (Β), και στην ηρεμία η μεμβράνη παραμένει διαπερατή στο κάλιο (Γ). γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 36." },
            { id: 7, question: "Ποιο είναι το ακριβές ιοντικό ισοζύγιο σε κάθε μεμονωμένο κύκλο λειτουργίας της αντλίας νατρίου-καλίου;", options: { A: "Εισάγονται δύο ιόντα νατρίου, εξάγονται τρία.", B: "Εξάγονται τρία ιόντα νατρίου, εισάγονται δύο.", C: "Εισάγονται τρία ιόντα νατρίου, εξάγονται δύο.", D: "Εξάγονται δύο ιόντα νατρίου, εισάγονται τρία." }, correct: "B", rationale: "α) Σωστό: Η αντλία μεταφέρει 3 ιόντα Na+ έξω από το κύτταρο και 2 ιόντα K+ μέσα, δημιουργώντας ηλεκτραρνητικότητα. β) Λάθος: Οι επιλογές (Α, Γ, Δ) αναφέρουν ανεστραμμένη στοιχειομετρία που θα καταργούσε το δυναμικό ηρεμίας. γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 36." },
            { id: 8, question: "Ποια είναι η φυσιολογική αναλογία της ενδοκυτταρικής προς την εξωκυτταρική συγκέντρωση των ιόντων καλίου;", options: { A: "Δεκατέσσερις φορές μικρότερη μέσα στο κύτταρο.", B: "Έντεκα φορές μικρότερη μέσα στο κύτταρο.", C: "Είκοσι επτά φορές μεγαλύτερη στο εσωτερικό.", D: "Είκοσι επτά φορές μεγαλύτερη στο εξωτερικό." }, correct: "C", rationale: "α) Σωστό: Το κάλιο είναι 27 φορές πιο πυκνό ενδοκυττάρια. β) Λάθος: Το (Α) περιγράφει το νάτριο (1:14), το (Β) το χλώριο (1:11), ενώ το (Δ) έχει λάθος κατεύθυνση διαβάθμισης (το αναφέρει στο εξωτερικό). γ) Παραπομπή: Κεφ. 2, Πίνακας 3.1, Σελ. 36-37." },
            { id: 9, question: "Τι ακριβώς συμβαίνει αμέσως μόλις το διαμεμβρανικό δυναμικό φτάσει στο κρίσιμο όριο (-50 mV);", options: { A: "Κλείνουν ραγδαία τα περισσότερα κανάλια καλίου.", B: "Ενεργοποιείται άμεσα η ισχυρή αντλία ιόντων.", C: "Εξέρχονται ραγδαία τα περισσότερα ιόντα καλίου.", D: "Ανοίγουν ραγδαία τα περισσότερα κανάλια νατρίου." }, correct: "D", rationale: "α) Σωστό: Μόλις φτάσει στον ουδό (-50mV), τα τασεο-εξαρτώμενα κανάλια νατρίου ανοίγουν ραγδαία. β) Λάθος: Το κάλιο εμπλέκεται αργότερα (Α, Γ). Η αντλία (Β) λειτουργεί στο παρασκήνιο για την ηρεμία, όχι ως άμεση απάντηση στον ουδό. γ) Παραπομπή: Κεφ. 2, Δυναμικό δράσης, Σελ. 39." },
            { id: 10, question: "Ποιος ιοντικός μηχανισμός οδηγεί στη φάση επαναπόλωσης της νευρικής ίνας αμέσως μετά το δυναμικό αιχμής;", options: { A: "Η συνεχής λειτουργία της αντλίας ιόντων.", B: "Η ταχεία έξοδος καλίου στο εξωκυττάριο.", C: "Η συνεχής είσοδος νατρίου στο ενδοκυττάριο.", D: "Η καθυστέρηση σύγκλεισης των καναλιών χλωρίου." }, correct: "B", rationale: "α) Σωστό: Το άνοιγμα των καναλιών καλίου προκαλεί ρεύμα προς τα έξω που επαναφέρει το δυναμικό. β) Λάθος: Η αντλία (Α) δρα αργότερα, το νάτριο (Γ) εμποδίζεται διότι κλείνει η πύλη αδρανοποίησης, και το χλώριο (Δ) δεν εμπλέκεται εδώ. γ) Παραπομπή: Κεφ. 2, Φάση επαναπόλωσης, Σελ. 40." },
            { id: 11, question: "Ποιο συγκεκριμένο φαινόμενο ευθύνεται μονοσήμαντα για τη φάση της υπερπόλωσης κατά τη διάρκεια του δυναμικού δράσης;", options: { A: "Η πρώιμη σύγκλειση της πύλης αδρανοποίησης.", B: "Η απότομη ενεργοποίηση των καναλιών νατρίου.", C: "Η καθυστερημένη σύγκλειση των καναλιών καλίου.", D: "Η αναστολή λειτουργίας της αντλίας νατρίου." }, correct: "C", rationale: "α) Σωστό: Καθώς τα κανάλια καλίου καθυστερούν να κλείσουν, το Κ+ συνεχίζει να εξέρχεται, ρίχνοντας το δυναμικό κάτω από τα -70mV. β) Λάθος: Η πύλη αδρανοποίησης (Α) προκαλεί επαναπόλωση, η ενεργοποίηση νατρίου (Β) προκαλεί εκπόλωση, και η αντλία (Δ) δεν αναστέλλεται. γ) Παραπομπή: Κεφ. 2, Φάση της υπερπόλωσης, Σελ. 41." },
            { id: 12, question: "Ποια δομική αλλαγή του καναλιού ευθύνεται αυστηρά για την εμφάνιση της απόλυτα ανερέθιστης περιόδου του νεύρου;", options: { A: "Το παρατεταμένο άνοιγμα των καναλιών καλίου.", B: "Η αδρανοποίηση των υποδοχέων αντλίας καλίου.", C: "Η σύγκλειση της πύλης ενεργοποίησης νατρίου.", D: "Η σύγκλειση της πύλης αδρανοποίησης νατρίου." }, correct: "D", rationale: "α) Σωστό: Η πύλη αδρανοποίησης κλείνει το κανάλι Na+ και κανένα ερέθισμα δεν μπορεί να το ξανανοίξει. β) Λάθος: Το κάλιο (Α) αφορά τη σχετική ανερέθιστη περίοδο, ενώ η πύλη ενεργοποίησης (Γ) είναι κλειστή στην αδιέγερτη φάση ηρεμίας. γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 42." },
            { id: 13, question: "Ποια τεχνική αναισθησίας προτιμάται κατά συντριπτική πλειοψηφία για τις τυπικές οδοντιατρικές επεμβάσεις στο στοματικό περιβάλλον;", options: { A: "Ενσυνείδητη καταστολή με χορήγηση υπναγωγών φαρμάκων.", B: "Τοποπεριοχική έγχυση διαλυμάτων τοπικών αναισθητικών φαρμάκων.", C: "Γενική αναισθησία με εισπνεόμενα αναισθητικά αέρια.", D: "Κεντρικός νευρικός αποκλεισμός της σπονδυλικής στήλης." }, correct: "B", rationale: "α) Σωστό: Στην οδοντιατρική χρησιμοποιούνται κυρίως τεχνικές τοπικής και τοποπεριοχικής αναισθησίας. β) Λάθος: Η καταστολή/γενική (Α, Γ) χρησιμοποιούνται μόνο σε εξαιρετικά μη συνεργάσιμους ασθενείς (π.χ. ΑΜΕΑ). Ο κεντρικός αποκλεισμός (Δ) δεν αφορά το στόμα. γ) Παραπομπή: Κεφ. 1, Οδοντιατρική αναισθησιολογία, Σελ. 30." },
            { id: 14, question: "Ποιο ακριβώς ανατομικό στοιχείο περιβάλλει ολιγάριθμες έως πολλές εκατοντάδες νευρικών ινών δημιουργώντας τις αντίστοιχες νευρικές δεσμίδες;", options: { A: "Ο πυκνός συνδετικός ιστός καλείται περινεύριο.", B: "Το εξωτερικό ινώδες κάλυμμα καλείται επινεύριο.", C: "Ο χαλαρός συνδετικός ιστός καλείται ενδονεύριο.", D: "Το μονωτικό κάλυμμα λιποπρωτεΐνης καλείται μυελίνη." }, correct: "A", rationale: "α) Σωστό: Το περινεύριο είναι ο πυκνός συνδετικός ιστός που περιβάλλει τις ίνες σχηματίζοντας δεσμίδες. β) Λάθος: Το επινεύριο (Β) περιβάλλει όλο το νεύρο, το ενδονεύριο (Γ) είναι χαλαρός ιστός μεταξύ ινών, και η μυελίνη (Δ) μονώνει την κάθε ίνα. γ) Παραπομπή: Κεφ. 2, Ανατομία νεύρων, Σελ. 33." },
            { id: 15, question: "Ποιος ανατομικός συνδυασμός χαρακτηριστικών εξασφαλίζει τη μέγιστη δυνατή ταχύτητα αγωγής ενός ερεθίσματος στη νευρική ίνα;", options: { A: "Μικρή διάμετρος άξονα, μικρά διαστήματα περισφίξεων.", B: "Μεγάλη διάμετρος άξονα, μικρά διαστήματα περισφίξεων.", C: "Μεγάλη διάμετρος άξονα, μεγάλα διαστήματα περισφίξεων.", D: "Μικρή διάμετρος άξονα, μεγάλα διαστήματα περισφίξεων." }, correct: "C", rationale: "α) Σωστό: Μεγαλύτερο πάχος (χαμηλή εσωτερική αντίσταση) και μεγάλα διαστήματα (ταχύτερα άλματα) μεγιστοποιούν την ταχύτητα αγωγής (π.χ. ίνες τύπου Α). β) Λάθος: Κάθε μείωση διαμέτρου (Α, Δ) ή απόστασης περισφίξεων (Β) καθυστερεί τη μετάδοση. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 35." },
            { id: 16, question: "Πώς ακριβώς μεταδίδεται το κύμα εκπόλωσης σε μια αμύελη νευρική ίνα αμέσως μετά το αρχικό ερέθισμα;", options: { A: "Με παθητική διάχυση καλίου προς έξω.", B: "Μέσω πηδηματικής αγωγής μεταξύ γειτονικών περισφίξεων.", C: "Με συνεχή είσοδο χλωρίου στο ενδοκυττάριο.", D: "Μέσω τοπικών κυκλικών ρευμάτων γειτονικών περιοχών." }, correct: "D", rationale: "α) Σωστό: Στις αμύελες, η μετάδοση γίνεται συνεχόμενα μέσω τοπικών κυκλικών ρευμάτων προς τις γειτονικές αδιέγερτες περιοχές. β) Λάθος: Η πηδηματική αγωγή (Β) αφορά αποκλειστικά τις εμμύελες ίνες. Τα ιόντα (Α) και (Γ) δεν περιγράφουν τον τρόπο μετάδοσης. γ) Παραπομπή: Κεφ. 2, Μετάδοση διέγερσης, Σελ. 42." },
            { id: 17, question: "Γιατί η κατά άλματα αγωγή στις εμμύελες ίνες θεωρείται εξαιρετικά σημαντική για τη βιολογική εξοικονόμηση ενέργειας;", options: { A: "Διότι παρακάμπτονται εντελώς τα κανάλια νατρίου.", B: "Διότι εκπολώνονται μόνο οι περισφίξεις Ranvier.", C: "Διότι σταματάει η λειτουργία αντλίας ιόντων.", D: "Διότι μειώνεται δραστικά η εξωτερική αντίσταση." }, correct: "B", rationale: "α) Σωστό: Η εκπόλωση συμβαίνει μόνο στις περισφίξεις, άρα η αντλία Na/K έχει να αποκαταστήσει πολύ μικρότερο αριθμό ιόντων, εξοικονομώντας ATP. β) Λάθος: Τα κανάλια δεν παρακάμπτονται (Α), η αντλία δεν σταματά (Γ) και η εξωτερική αντίσταση (Δ) δεν παίζει ρόλο στην εξοικονόμηση ενέργειας εδώ. γ) Παραπομπή: Κεφ. 2, Μετάδοση διέγερσης, Σελ. 43." },
            { id: 18, question: "Ποιο μορφολογικό χαρακτηριστικό περιγράφει με απόλυτη ακρίβεια τις νευρικές ίνες που κατατάσσονται βιολογικά στον τύπο C;", options: { A: "Είναι παχιές, εμμύελες και άγουν γρήγορα.", B: "Αποτελούν κινητικές ίνες που ελέγχουν μύες.", C: "Είναι λεπτές, αμύελες και άγουν αργά.", D: "Έχουν μέτρια ταχύτητα, μικρά διαστήματα περισφίξεων." }, correct: "C", rationale: "α) Σωστό: Οι ίνες τύπου C είναι οι πιο λεπτές, αμύελες ίνες και έχουν την πιο αργή ταχύτητα αγωγής. β) Λάθος: Το (Α) περιγράφει ίνες τύπου Α, το (Δ) τις ίνες τύπου Β. Το (Β) είναι ανακριβές, καθώς συχνά άγουν τον πόνο. γ) Παραπομπή: Κεφ. 2, Ταξινόμηση ινών, Σελ. 35." },
            { id: 19, question: "Ποια είναι η κύρια λειτουργία που επιτελούν αποκλειστικά οι αισθητικές ίνες στο περιφερικό μας νευρικό σύστημα;", options: { A: "Προκαλούν σύσπαση στους διάφορους σκελετικούς μύες.", B: "Αποτελούν μείγμα εμμύελων και αμύελων ινών.", C: "Μεταφέρουν ώσεις από κεντρικά στην περιφέρεια.", D: "Άγουν διεγέρσεις από τα όργανα κεντρικά." }, correct: "D", rationale: "α) Σωστό: Οι αισθητικές ίνες είναι κεντρομόλες και μεταφέρουν διεγέρσεις στο ΚΝΣ. β) Λάθος: Τα (Α) και (Γ) περιγράφουν τις κινητικές ίνες, ενώ το (Β) αποτελεί ανατομικό χαρακτηριστικό μικτών νεύρων. γ) Παραπομπή: Κεφ. 2, Ανατομία νεύρων, Σελ. 34." },
            { id: 20, question: "Ποια είναι η ακριβής κατάσταση της πύλης ενεργοποίησης των καναλιών νατρίου στην αδιέγερτη ήρεμη νευρική ίνα;", options: { A: "Ανοίγει ραγδαία επιτρέποντας την αθρόα είσοδο.", B: "Παραμένει αυστηρά κλειστή εμποδίζοντας είσοδο ιόντων.", C: "Κλείνει παροδικά κατά τη φάση υπερπόλωσης.", D: "Παραμένει συνεχώς ανοιχτή διατηρώντας το δυναμικό." }, correct: "B", rationale: "α) Σωστό: Στο δυναμικό ηρεμίας, η πύλη ενεργοποίησης του νατρίου είναι κλειστή (εμποδίζοντας την εκπόλωση). β) Λάθος: Η ραγδαία διάνοιξη (Α) συμβαίνει στον ουδό. Η (Δ) είναι λάθος (δεν είναι ανοιχτή), και στην υπερπόλωση είναι ήδη κλειστή, όχι παροδικά (Γ). γ) Παραπομπή: Κεφ. 2, Φάση ερεθίσματος, Σελ. 39." },
            { id: 21, question: "Ποια είναι η ακριβής αιτιολογική βάση του νευρογενούς πόνου, σύμφωνα με την εισαγωγή της αναισθησιολογίας;", options: { A: "Προκαλείται από τραυματισμό των ιστών λόγω θερμικού ή χημικού ερεθίσματος.", B: "Οφείλεται αποκλειστικά σε ποικίλους συναισθηματικούς ή έντονους ψυχολογικούς στρεσογόνους παράγοντες.", C: "Οφείλεται σε μηχανικό βλαπτικό ερέθισμα που προκαλεί τοπικό τραυματισμό ιστών.", D: "Προέρχεται από άμεση βλάβη η οποία εντοπίζεται εστιακά στο νευρικό σύστημα." }, correct: "D", rationale: "α) Σωστό: Ο νευρογενής πόνος οφείλεται σε άμεση βλάβη στο νευρικό σύστημα. β) Λάθος: Οι επιλογές (Α) και (Γ) περιγράφουν πόνο από τραυματισμό ιστών, ενώ η (Β) περιγράφει τον ψυχογενή πόνο. γ) Παραπομπή: Κεφ. 1, Εισαγωγή, Σελ. 27." },
            { id: 22, question: "Σε ποιον ακριβώς ανατομικό χώρο εγχύεται το τοπικό αναισθητικό κατά τη διενέργεια της νωτιαίας αναισθησίας;", options: { A: "Στον υπαραχνοειδή χώρο της οσφυϊκής μοίρας.", B: "Στον επισκληρίδιο χώρο της σπονδυλικής στήλης.", C: "Στο περινεύριο των περιφερικών νευρικών στελεχών.", D: "Στο ενδονεύριο των κεντρικών νευρικών απολήξεων." }, correct: "A", rationale: "α) Σωστό: Η νωτιαία αναισθησία πραγματοποιείται με έγχυση στο εγκεφαλονωτιαίο υγρό του υπαραχνοειδή χώρου (οσφυϊκή χώρα). β) Λάθος: Το (Β) αφορά την επισκληρίδιο, ενώ τα (Γ, Δ) αποτελούν συνδετικούς ιστούς περιφερικών νεύρων και όχι χώρους της σπονδυλικής. γ) Παραπομπή: Κεφ. 1, Οδοί χορήγησης, Σελ. 29." },
            { id: 23, question: "Ποια είναι η ακριβής εκατοστιαία αναλογία των κύριων δομικών συστατικών στις βιολογικές μεμβράνες των νευρώνων;", options: { A: "Πρωτεΐνες σε ποσοστό 25% και φωσφολιπίδια σε ποσοστό 55%.", B: "Γλυκοπρωτεΐνες σε ποσοστό 25% και υδατάνθρακες σε ποσοστό 55%.", C: "Φωσφολιπίδια σε ποσοστό 25% και πρωτεΐνες σε ποσοστό 55%.", D: "Λιποπρωτεΐνες σε ποσοστό 25% και φωσφολιπίδια σε ποσοστό 55%." }, correct: "C", rationale: "α) Σωστό: Η νευρική μεμβράνη αποτελείται από 25% φωσφολιπίδια και 55% πρωτεΐνες. β) Λάθος: Η (Α) τα αντιστρέφει, ενώ οι (Β) και (Δ) εισάγουν λάθος μακρομόρια (υδατάνθρακες, λιποπρωτεΐνες) σε λάθος ποσοστά για τη συγκεκριμένη δομή. γ) Παραπομπή: Κεφ. 2, Δομή νευρικής μεμβράνης, Σελ. 31." },
            { id: 24, question: "Ποια είναι η ακριβής ανατομική σχέση των κυττάρων του Schwann με τις αμύελες νευρικές ίνες;", options: { A: "Κάθε κύτταρο του Schwann περιβάλλει αποκλειστικά έναν και μόνο άξονα.", B: "Κάθε κύτταρο του Schwann περιβάλλει ταυτόχρονα πολλούς διαφορετικούς νευρικούς άξονες.", C: "Οι αμύελες ίνες στερούνται πλήρως της παρουσίας κυττάρων του Schwann.", D: "Τα κύτταρα του Schwann σχηματίζουν πολλαπλά στρώματα γύρω από αυτές." }, correct: "B", rationale: "α) Σωστό: Στις αμύελες ίνες, κάθε κύτταρο Schwann περιβάλλει πολλούς άξονες. β) Λάθος: Η (Α) ισχύει για τις εμμύελες, η (Γ) είναι αναληθής διότι έχουν κύτταρα Schwann, και η (Δ) περιγράφει τη δημιουργία μυελίνης η οποία απουσιάζει εδώ. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 33." },
            { id: 25, question: "Ποια είναι η φυσιολογική απόσταση μεταξύ δύο διαδοχικών περισφίξεων του Ranvier σε μία εμμύελη ίνα;", options: { A: "Κυμαίνεται αυστηρά περίπου από 0,5 έως 3 εκατοστά (cm).", B: "Κυμαίνεται αυστηρά περίπου από 0,5 έως 3 μικρόμετρα (μm).", C: "Κυμαίνεται αυστηρά περίπου από 5,0 έως 8 χιλιοστά (mm).", D: "Κυμαίνεται αυστηρά περίπου από 0,5 έως 3 χιλιοστά (mm)." }, correct: "D", rationale: "α) Σωστό: Τα χάσματα της μυελίνης δημιουργούνται κάθε 0,5 με 3 mm. β) Λάθος: Οι επιλογές (Α, Β, C) χρησιμοποιούν λανθασμένες μονάδες μέτρησης (cm, μm) ή εντελώς διαφορετικές κλίμακες απόστασης. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 32." },
            { id: 26, question: "Ποια δομή προστατεύει τα περιφερικά νεύρα από ισχαιμική νέκρωση κατά την ευρεία ανατομική τους μετατόπιση;", options: { A: "Οι αρτηριακές αναστομώσεις που δημιουργούνται μέσα στον ιστό του επινευρίου.", B: "Οι διασυνδέσεις των φλεβών μέσα στον χώρο του πυκνού περινευρίου.", C: "Το παχύ στρώμα μυελίνης που περιβάλλει τις μεμονωμένες νευρικές ίνες.", D: "Το δίκτυο των τριχοειδών αγγείων μέσα στον ιστό του ενδονευρίου." }, correct: "A", rationale: "α) Σωστό: Οι αρτηρίες αναστομώνονται μέσα στο επινεύριο, διασφαλίζοντας την αιμάτωση. β) Λάθος: Το περινεύριο (Β) και ενδονεύριο (Δ) δεν αναφέρονται ως το κύριο δίκτυο αναστόμωσης, και η μυελίνη (Γ) είναι μονωτικό, όχι αγγειακό, στοιχείο. γ) Παραπομπή: Κεφ. 2, Ανατομία περιφερικών νεύρων, Σελ. 34." },
            { id: 27, question: "Σε ποιο εύρος τιμών κυμαίνεται φυσιολογικά το δυναμικό ηρεμίας στα διεγέρσιμα κύτταρα του ανθρώπινου οργανισμού;", options: { A: "Μεταξύ +40 και +90 millivolts (mV) στην εσωτερική επιφάνεια.", B: "Μεταξύ -40 και -90 millivolts (mV) στην εσωτερική επιφάνεια.", C: "Μεταξύ -50 και -60 millivolts (mV) στην εξωτερική επιφάνεια.", D: "Μεταξύ +50 και +60 millivolts (mV) στην εξωτερική επιφάνεια." }, correct: "B", rationale: "α) Σωστό: Το δυναμικό μεμβράνης κυμαίνεται από -40 έως -90 mV με αρνητικό το εσωτερικό. β) Λάθος: Το (Α) δείχνει θετικό εσωτερικό, ενώ τα (Γ, Δ) αναφέρονται σε λάθος τιμές (που μοιάζουν με τον ουδό) και λάθος επιφάνεια (εξωτερική). γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 36." },
            { id: 28, question: "Ποιος μηχανισμός επιτρέπει στα τασεο-εξαρτώμενα κανάλια να ελέγχουν τη διέλευση των ιόντων με παθητική μεταφορά;", options: { A: "Η υδρόλυση του μορίου ATP που παρέχει την απαιτούμενη ενέργεια.", B: "Η ενεργητική συμμεταφορά θετικών ιόντων ενάντια στη φυσιολογική διαβάθμιση συγκέντρωσης.", C: "Η συνεχής δέσμευση φωσφολιπιδίων στην εξωτερική επιφάνεια της κυτταρικής μεμβράνης.", D: "Η παρουσία ειδικών αισθητήρων που αναγνωρίζουν τις μεταβολές του δυναμικού." }, correct: "D", rationale: "α) Σωστό: Τα κανάλια διαθέτουν ειδικούς αισθητήρες στη δομή τους που αντιλαμβάνονται τις μεταβολές δυναμικού. β) Λάθος: Η παθητική μεταφορά των καναλιών δεν απαιτεί υδρόλυση ATP (Α) ούτε ενεργητική συμμεταφορά (Β). Η (Γ) είναι φανταστικός μηχανισμός. γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 36." },
            { id: 29, question: "Ποια είναι η μέγιστη τιμή δυναμικού που επιτυγχάνεται κατά την κορύφωση της εκπόλωσης (δυναμικό αιχμής);", options: { A: "Προσεγγίζει τα -50 mV λόγω αθρόας εκροής ιόντων καλίου.", B: "Προσεγγίζει τα +90 mV λόγω αθρόας εισροής ιόντων ασβεστίου.", C: "Προσεγγίζει τα +40 mV λόγω αθρόας εισροής ιόντων νατρίου.", D: "Προσεγγίζει τα -70 mV λόγω αθρόας εκροής ιόντων χλωρίου." }, correct: "C", rationale: "α) Σωστό: Η αθρόα εισροή θετικών ιόντων νατρίου φτάνει το δυναμικό της μεμβράνης στα +40 mV (αιχμή). β) Λάθος: Το -50 mV (Α) είναι το κρίσιμο δυναμικό (ουδός), τα +90 (Β) και -70 (Δ) είναι λανθασμένα και αφορούν άλλα ιόντα. γ) Παραπομπή: Κεφ. 2, Δυναμικό αιχμής, Σελ. 40." },
            { id: 30, question: "Ποια είναι η μέση χρονική διάρκεια της φάσης επαναπόλωσης της νευρικής μεμβράνης μετά την εκπόλωση;", options: { A: "Διαρκεί περίπου 7,0 χιλιοστά του δευτερολέπτου (msec) μέχρι την ολοκλήρωση.", B: "Διαρκεί περίπου 0,7 χιλιοστά του δευτερολέπτου (msec) μέχρι την ολοκλήρωση.", C: "Διαρκεί περίπου 0,7 ολόκληρα δευτερόλεπτα (sec) μέχρι την πλήρη ολοκλήρωση.", D: "Διαρκεί περίπου 7,0 ολόκληρα δευτερόλεπτα (sec) μέχρι την πλήρη ολοκλήρωση." }, correct: "B", rationale: "α) Σωστό: Η φάση επαναπόλωσης είναι ταχύτατη και διαρκεί 0,7 msec. β) Λάθος: Τα 0,7 sec (Γ) ή τα 7 msec/sec (Α, Δ) είναι πολλαπλάσιες διάρκειες που θα νέκρωναν το νευρικό σήμα στο σώμα. γ) Παραπομπή: Κεφ. 2, Φάση επαναπόλωσης, Σελ. 40." },
            { id: 31, question: "Πώς ακριβώς επιτυγχάνεται η τελική επάνοδος στο δυναμικό ηρεμίας αμέσως μετά τη φάση της υπερπόλωσης;", options: { A: "Με την ενεργητική μεταφορά ιόντων μέσω της αντλίας νατρίου-καλίου (ΑΤΡ).", B: "Με το κλείσιμο της πύλης αδρανοποίησης των τασεο-εξαρτώμενων καναλιών νατρίου.", C: "Με την ταχεία παθητική είσοδο χλωρίου για εξισορρόπηση των φορτίων.", D: "Με την παρατεταμένη παθητική εκροή ιόντων καλίου στον εξωκυττάριο χώρο." }, correct: "A", rationale: "α) Σωστό: Η αντλία νατρίου-καλίου αναλαμβάνει ενεργητικά να επαναφέρει τις αρχικές συγκεντρώσεις καταναλώνοντας ΑΤΡ. β) Λάθος: Η πύλη (Β) και η εκροή καλίου (Δ) οδηγούν στην επαναπόλωση/υπερπόλωση, ενώ το χλώριο (Γ) δεν παίζει ρόλο εδώ. γ) Παραπομπή: Κεφ. 2, Φάση της υπερπόλωσης, Σελ. 41." },
            { id: 32, question: "Ποια είναι η ακριβής κατάσταση των πυλών στα κανάλια νατρίου κατά τη σχετικά ανερέθιστη περίοδο;", options: { A: "Η πύλη αδρανοποίησης συγκλίνει σταδιακά ενώ η πύλη ενεργοποίησης ανοίγει.", B: "Και οι δύο πύλες παραμένουν ερμητικά κλειστές εμποδίζοντας την εκπόλωση.", C: "Και οι δύο πύλες παραμένουν πλήρως ανοιχτές επιτρέποντας την εκπόλωση.", D: "Η πύλη αδρανοποίησης ανοίγει σταδιακά ενώ η πύλη ενεργοποίησης συγκλίνει." }, correct: "D", rationale: "α) Σωστό: Στη σχετικά ανερέθιστη, ανοίγει σταδιακά η πύλη αδρανοποίησης (που ήταν κλειστή) και συγκλίνει η πύλη ενεργοποίησης (ετοιμότητα). β) Λάθος: Το (Α) είναι ακριβώς το αντίστροφο, ενώ τα (Β, Γ) αγνοούν τη διπλή και ετεροχρονισμένη λειτουργία των δύο πυλών. γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 42." },
            { id: 33, question: "Γιατί το κύμα εκπόλωσης επεκτείνεται αποκλειστικά προς μία μόνο κατεύθυνση κατά μήκος του νευρικού άξονα;", options: { A: "Διότι το επόμενο τμήμα βρίσκεται συνεχώς σε κατάσταση παρατεταμένης υπερπόλωσης.", B: "Διότι το μυελώδες έλυτρο εμποδίζει μονίμως την οπισθόδρομη αγωγή του ρεύματος.", C: "Διότι το προηγούμενο τμήμα διανύει την απόλυτα και σχετικά ανερέθιστη περίοδο.", D: "Διότι η αντλία νατρίου-καλίου απενεργοποιείται πλήρως στο προηγούμενο αδιέγερτο τμήμα." }, correct: "C", rationale: "α) Σωστό: Το προηγούμενο τμήμα μόλις εκπολώθηκε και βρίσκεται σε ανερέθιστη περίοδο, άρα δεν μπορεί να διεγερθεί οπισθόδρομα. β) Λάθος: Η μυελίνη (Β) μονώνει, δεν καθορίζει τη φορά. Τα (Α) και (Δ) αποτελούν κατασκευασμένες φυσιολογικές ανωμαλίες. γ) Παραπομπή: Κεφ. 2, Μετάδοση της διέγερσης, Σελ. 42-43." },
            { id: 34, question: "Ποια δομική ιδιαιτερότητα αναγκάζει τα τοπικά εκπολωτικά ρεύματα να ρέουν αποκλειστικά ανάμεσα σε γειτονικές περισφίξεις;", options: { A: "Τα τριακόσια στρώματα λιποειδικής μεμβράνης που σχηματίζουν ισχυρή ηλεκτρική μόνωση.", B: "Η υψηλή εσωτερική ηλεκτρική αντίσταση που χαρακτηρίζει το λεπτό αξονόπλασμα.", C: "Η παντελής απουσία καναλιών νατρίου σε ολόκληρο το νευρικό κύτταρο.", D: "Η παρατεταμένη ενεργοποίηση της αντλίας νατρίου-καλίου στα ενδιάμεσα γυμνά διαστήματα." }, correct: "A", rationale: "α) Σωστό: Το έλυτρο (με 300 στρώματα) αποκλείει τη ροή ιόντων, αναγκάζοντας το ρεύμα να πηδήξει από περίσφιξη σε περίσφιξη. β) Λάθος: Η αντίσταση (Β) παίζει ρόλο στην ταχύτητα, όχι στο άλμα. Τα (Γ) και (Δ) δεν ισχύουν (τα κανάλια υπάρχουν, τα διαστήματα δεν είναι γυμνά). γ) Παραπομπή: Κεφ. 2, Μετάδοση της διέγερσης, Σελ. 43." },
            { id: 35, question: "Πώς ονομάζονται ιατρικά τα φάρμακα που εγχύονται στη σπονδυλική στήλη προκαλώντας την κατάσταση της περιοχικής αναισθησίας;", options: { A: "Ονομάζονται γενικά αναισθητικά, καταστέλλοντας πλήρως την αντίληψη.", B: "Ονομάζονται γενικά αναισθητικά, αποκλείοντας περιφερικά τις αισθήσεις.", C: "Ονομάζονται υπναγωγά φάρμακα, προκαλώντας την ενσυνείδη καταστολή.", D: "Ονομάζονται τοπικά αναισθητικά, προκαλώντας τον κεντρικό αποκλεισμό." }, correct: "D", rationale: "α) Σωστό: Τα φάρμακα που εγχύονται στον κεντρικό άξονα (σπονδυλική στήλη) ονομάζονται τοπικά αναισθητικά (κεντρικός αποκλεισμός). β) Λάθος: Τα γενικά αναισθητικά (Α, Β) στοχεύουν στον εγκέφαλο (απώλεια συνείδησης) και τα υπναγωγά (Γ) προκαλούν μέθη, όχι περιοχικό αποκλεισμό. γ) Παραπομπή: Κεφ. 1, Περιοχική αναισθησία, Σελ. 28." },
            { id: 36, question: "Στην τοπική αναισθησία δι' εμποτίσεως, πού ακριβώς εγχύεται το διάλυμα για να επιτευχθεί ο νευρικός αποκλεισμός;", options: { A: "Απευθείας στον υπαραχνοειδή χώρο της οσφυϊκής σπονδυλικής μοίρας.", B: "Απευθείας στις τελικές νευρικές απολήξεις της χειρουργικής περιοχής.", C: "Απευθείας στον επισκληρίδιο χώρο της κεντρικής νευρικής οδού.", D: "Απευθείας στο κεντρικό νευρικό στέλεχος μέσω στελεχιαίας αναισθησίας." }, correct: "B", rationale: "α) Σωστό: Η αναισθησία δι' εμποτίσεως (διήθηση) γίνεται με έγχυση απευθείας πάνω στις τελικές απολήξεις (ενδοδερμικά/υποβλεννογόνια). β) Λάθος: Τα (Α, Γ) αφορούν κεντρικό αποκλεισμό. Το (Δ) αφορά τη στελεχιαία (περιφερικός αποκλεισμός στελέχους, όχι απολήξεων). γ) Παραπομπή: Κεφ. 1, Οδοί χορήγησης, Σελ. 29." },
            { id: 37, question: "Ποια είναι η ακριβής βιοχημική σύσταση και το χαρακτηριστικό χρώμα που προσδίδει το μυελώδες έλυτρο;", options: { A: "Αποτελείται από γλυκοπρωτεΐνες και προσδίδει χαρακτηριστικό φαιό χρώμα.", B: "Αποτελείται από υδατάνθρακες και προσδίδει χαρακτηριστικό κίτρινο χρώμα.", C: "Αποτελείται από λιποπρωτεΐνες και προσδίδει χαρακτηριστικό άσπρο χρώμα.", D: "Αποτελείται από φωσφολιπίδια και προσδίδει χαρακτηριστικό ερυθρό χρώμα." }, correct: "C", rationale: "α) Σωστό: Η μυελίνη είναι λιποπρωτεΐνη και προσδίδει στην ίνα το χαρακτηριστικό άσπρο της χρώμα (λευκή ουσία). β) Λάθος: Οι άλλες επιλογές (Α, Β, Δ) περιέχουν λάθος βιολογικά μόρια και εντελώς φανταστικά χρώματα για τη νευρική ίνα. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 32." },
            { id: 38, question: "Ποιο είναι το κύριο ανατομικό χαρακτηριστικό των μικτών νεύρων όσον αφορά τη σύσταση των ινών τους;", options: { A: "Διαθέτουν αποκλειστικά εμμύελες ίνες ταχείας αγωγής και μεγάλης διαμέτρου.", B: "Διαθέτουν αποκλειστικά αμύελες ίνες βραδείας αγωγής και μικρής διαμέτρου.", C: "Περιέχουν ταυτόχρονα και τους δύο τύπους ινών (αμύελες και εμμύελες).", D: "Στερούνται πλήρως νευρικών ινών, διαθέτοντας μόνο εξειδικευμένα υποστηρικτικά κύτταρα Schwann." }, correct: "C", rationale: "α) Σωστό: Τα μικτά νεύρα αποτελούνται από έναν συνδυασμό εμμύελων και αμύελων νευρικών ινών. β) Λάθος: Ουδέποτε διαθέτουν «αποκλειστικά» έναν τύπο (Α, Β). Η επιλογή (Δ) είναι βιολογικά άκυρη καθώς χωρίς ίνες δεν νοείται νεύρο. γ) Παραπομπή: Κεφ. 2, Ανατομία νεύρων, Σελ. 34." },
            { id: 39, question: "Γιατί οι εμμύελες νευρικές ίνες απαιτούν περισσότερο χρόνο και υψηλότερη συγκέντρωση αναισθητικού για να αποκλειστούν πλήρως;", options: { A: "Διότι προστατεύονται ισχυρά από το μονωτικό λιποειδικό στρώμα της μυελίνης.", B: "Διότι στερούνται παντελώς των απαραίτητων τασεοεξαρτώμενων ιοντικών καναλιών του νατρίου.", C: "Διότι εμφανίζουν εξαιρετικά μικρότερη διάμετρο συγκριτικά με τις αμύελες ίνες.", D: "Διότι διαθέτουν συνεχή εκπόλωση χωρίς ενδιάμεσες γυμνές περισφίξεις του Ranvier." }, correct: "A", rationale: "α) Σωστό: Η μυελίνη λειτουργεί ως ισχυρή μόνωση, επιτρέποντας στο φάρμακο να επιδράσει μόνο στις στενές περισφίξεις του Ranvier. β) Λάθος: Έχουν κανάλια (Β), είναι μεγαλύτερες σε διάμετρο από τις αμύελες (Γ), και δεν έχουν συνεχή αλλά πηδηματική αγωγή (Δ). γ) Παραπομπή: Κεφ. 2, Διαφορικός αποκλεισμός, Σελ. 35." },
            { id: 40, question: "Ποια εσωτερική δύναμη ελαττώνει δραστικά την ώθηση των ιόντων νατρίου προς το ενδοκυττάριο κατά την επαναπόλωση;", options: { A: "Η ισχυρή ηλεκτροστατική έλξη από τα συσσωρευμένα ενδοκυττάρια ιόντα χλωρίου.", B: "Η θετικοποίηση του εσωτερικού που απωθεί τα ίδια θετικά φορτία.", C: "Η αρνητικοποίηση του εσωτερικού που προσελκύει μαζικά τα θετικά φορτία.", D: "Η πλήρης απουσία της συγκέντρωσης ιόντων νατρίου στον εξωκυττάριο χώρο." }, correct: "B", rationale: "α) Σωστό: Η αθρόα είσοδος νατρίου θετικοποιεί το εσωτερικό (+40mV), το οποίο με τη σειρά του απωθεί ηλεκτροστατικά τα επόμενα ιόντα νατρίου (Na+). β) Λάθος: Το εσωτερικό είναι θετικό (άρα η Γ είναι λάθος). Το εξωκυττάριο νάτριο παραμένει (Δ). Το χλώριο (Α) δεν ευθύνεται γι' αυτήν την ηλεκτροστατική απώθηση. γ) Παραπομπή: Κεφ. 2, Φάση επαναπόλωσης, Σελ. 41." },
            { id: 41, question: "Ποια είναι η βασική ειδοποιός διαφορά της τοπικής έναντι της γενικής αναισθησίας, σύμφωνα με τους ορισμούς του κειμένου;", options: { A: "Απώλεια αίσθησης στην περιοχή χωρίς την απώλεια της συνείδησης.", B: "Πλήρης απώλεια συνείδησης και παράλληλη απουσία της αίσθησης πόνου.", C: "Μερική απώλεια συνείδησης με διατήρηση όλης της κινητικής λειτουργίας.", D: "Απουσία αίσθησης συνοδευόμενη από μηχανική υποστήριξη ολόκληρης της αναπνοής." }, correct: "A", rationale: "α) Σωστό: Η βασική διαφορά της τοπικής αναισθησίας είναι ότι ορίζεται ως απώλεια αίσθησης χωρίς όμως την απώλεια της συνείδησης του ασθενούς. β) Λάθος: Η πλήρης απώλεια συνείδησης (Β) και η αναπνευστική υποστήριξη (Δ) είναι δείκτες της γενικής αναισθησίας. γ) Παραπομπή: Κεφ. 1, Μέθοδοι πρόκλησης τοποπεριοχικής αναισθησίας, Σελ. 29." },
            { id: 42, question: "Ποια από τις παρακάτω μεθόδους συμπεριλαμβάνεται στους καθιερωμένους τρόπους πρόκλησης τοπικής αναισθησίας σύμφωνα με το πρώτο κεφάλαιο;", options: { A: "Γενική ενδοφλέβια χορήγηση υπναγωγών φαρμάκων απευθείας στο κυκλοφορικό σύστημα.", B: "Ειδική χρήση των νευρολυτικών παραγόντων, όπως αλκοόλες και φαινόλες.", C: "Ηλεκτρικός διεγερτικός αποκλεισμός των κινητικών νευρικών απολήξεων της περιοχής.", D: "Θερμική υπερθέρμανση των τοπικών ιστών για διακοπή νευρικής αγωγιμότητας." }, correct: "B", rationale: "α) Σωστό: Στις 6 καθιερωμένες μεθόδους τοπικής αναισθησίας περιλαμβάνονται οι νευρολυτικοί παράγοντες. β) Λάθος: Η τοπική δεν γίνεται με υπναγωγά φάρμακα (Α), ηλεκτρικό αποκλεισμό (Γ), ούτε με υπερθέρμανση (αναφέρεται η ψύξη, άρα το Δ είναι λάθος). γ) Παραπομπή: Κεφ. 1, Μέθοδοι πρόκλησης, Σελ. 29." },
            { id: 43, question: "Σε ποια ακριβώς ανατομική περιοχή ή χώρο πραγματοποιείται η έγχυση του αναισθητικού διαλύματος κατά την επισκληρίδιο αναισθησία;", options: { A: "Απευθείας στον υπαραχνοειδή χώρο γύρω από τον νωτιαίο μυελό.", B: "Στο εγκεφαλονωτιαίο υγρό το οποίο κυκλοφορεί στην οσφυϊκή χώρα.", C: "Αποκλειστικά στον επισκληρίδιο χώρο της δομής της σπονδυλικής στήλης.", D: "Στο κεντρικό νευρικό κυτταρόπλασμα των σωματικών αισθητικών νευρικών ινών." }, correct: "C", rationale: "α) Σωστό: Στην επισκληρίδιο αναισθησία, το αναισθητικό εγχύεται κατευθείαν στον επισκληρίδιο χώρο. β) Λάθος: Ο υπαραχνοειδής χώρος (Α) και το εγκεφαλονωτιαίο υγρό (Β) αφορούν τη νωτιαία (ραχιαία) αναισθησία, όχι την επισκληρίδιο. γ) Παραπομπή: Κεφ. 1, Οδοί χορήγησης, Σελ. 29." },
            { id: 44, question: "Πώς ορίζεται και ερμηνεύεται αιτιολογικά ο ψυχογενής πόνος, όπως αναλύεται στην εισαγωγή του πρώτου κεφαλαίου περί αναισθησιολογίας;", options: { A: "Οφείλεται σε άμεση οργανική βλάβη ιστών από ισχυρό ερέθισμα.", B: "Πηγάζει αποκλειστικά από τραυματισμό ιστών μέσω κάποιου ακραίου εγκαύματος.", C: "Προκαλείται άμεσα από εστιακή οργανική βλάβη του νευρικού συστήματος.", D: "Αποτελεί πόνο που οφείλεται κυρίως σε συναισθηματικούς ή ψυχολογικούς παράγοντες." }, correct: "D", rationale: "α) Σωστό: Ο ψυχογενής πόνος στερείται οργανικής ιστικής βλάβης και οφείλεται αμιγώς σε συναισθηματικούς/ψυχολογικούς παράγοντες. β) Λάθος: Οι επιλογές (Α) και (Β) περιγράφουν πόνο από ιστικό τραυματισμό, ενώ η (Γ) αναφέρεται στην κλινική εικόνα του νευρογενούς πόνου. γ) Παραπομπή: Κεφ. 1, Εισαγωγή, Σελ. 27." },
            { id: 45, question: "Ποια εναλλακτική περιγραφή αποδίδει με απόλυτη ακρίβεια τη δομική και φυσιολογική φύση του μυελώδους ελύτρου στους νευρώνες;", options: { A: "Λιποπρωτεΐνη που περιβάλλει ελικοειδώς τη νευρική ίνα για πλήρη μόνωση.", B: "Γλυκοπρωτεΐνη που τοποθετείται κάθετα στη μεμβράνη δημιουργώντας μεγάλους ιοντικούς διαύλους.", C: "Φωσφολιπιδική στιβάδα που διευκολύνει την παθητική αγωγή ηλεκτρικών νευρικών ώσεων.", D: "Συνδετικός ιστός που συνδέει χαλαρά τις νευρικές ίνες σε μεγάλες δεσμίδες." }, correct: "A", rationale: "α) Σωστό: Το έλυτρο είναι κυρίως λιποπρωτεΐνη που περιβάλλει ελικοειδώς τη νευρική ίνα, δημιουργώντας την απαραίτητη ηλεκτρική μόνωση. β) Λάθος: Οι γλυκοπρωτεΐνες (Β) σχηματίζουν διαύλους μεμβράνης, τα φωσφολιπίδια (Γ) είναι η κυτταρική μεμβράνη, και ο συνδετικός ιστός (Δ) είναι το ενδονεύριο. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 32." },
            { id: 46, question: "Ποιος είναι ο συγκεκριμένος φυσιολογικός ρόλος που επιτελούν οι πρωτεΐνες όταν διαπερνούν πλήρως τη διπλοστιβάδα της νευρικής μεμβράνης;", options: { A: "Σχηματίζουν έναν αδιαπέραστο υδρόφοβο φραγμό έναντι των μεγάλων μακρομορίων στο υγρό.", B: "Σχηματίζουν ειδικούς διαύλους και αντλίες επιτρέποντας την ανταλλαγή απαραίτητων υδατοδιαλυτών ουσιών.", C: "Δημιουργούν ένα πυκνό εξωτερικό ινώδες περίβλημα ακριβώς γύρω από τις δεσμίδες.", D: "Μονώνουν απόλυτα τον άξονα εμποδίζοντας πλήρως κάθε μορφή ηλεκτρικής κυτταρικής αγωγιμότητας." }, correct: "B", rationale: "α) Σωστό: Οι διαμεμβρανικές πρωτεΐνες λειτουργούν ως δίαυλοι, πόροι ή αντλίες επιτρέποντας την ανταλλαγή ιόντων και υδατοδιαλυτών ουσιών. β) Λάθος: Τον υδρόφοβο φραγμό (Α) τον σχηματίζουν τα λιπίδια. Το (Γ) περιγράφει το περινεύριο. Το (Δ) είναι η λειτουργία της μυελίνης. γ) Παραπομπή: Κεφ. 2, Δομή νευρικής μεμβράνης, Σελ. 32." },
            { id: 47, question: "Με βάση την κατεύθυνση αγωγής των νευρικών διεγέρσεων, ποια περιγραφή αντιστοιχεί αποκλειστικά στα κινητικά νεύρα του οργανισμού;", options: { A: "Προσλαμβάνουν εξωτερικά ερεθίσματα από το δέρμα και τα μεταφέρουν κεντρικά.", B: "Περιέχουν εμμύελες και αμύελες ίνες δημιουργώντας μεγάλα περιφερικά μικτά νεύρα.", C: "Μεταφέρουν ώσεις από το κεντρικό σύστημα προς τους σκελετικούς μύες.", D: "Άγουν διεγέρσεις από διάφορα εσωτερικά σπλάχνα κατευθείαν στον νωτιαίο μυελό." }, correct: "C", rationale: "α) Σωστό: Τα κινητικά νεύρα (φυγόκεντρα) μεταφέρουν τις διεγέρσεις από το ΚΝΣ προς τα εκτελεστικά όργανα (π.χ. σκελετικούς μύες). β) Λάθος: Το (Α) και το (Δ) περιγράφουν τις αισθητικές (κεντρομόλες) ίνες, ενώ το (Β) αφορά τα μικτά νεύρα που έχουν και κινητικές και αισθητικές ίνες. γ) Παραπομπή: Κεφ. 2, Ταξινόμηση νεύρων, Σελ. 34." },
            { id: 48, question: "Σύμφωνα με τον πίνακα συγκεντρώσεων ιόντων, ποια είναι η φυσιολογική αναλογία της ενδοκυτταρικής προς εξωκυτταρική συγκέντρωση χλωρίου;", options: { A: "Η ενδοκυτταρική συγκέντρωση υπερτερεί σημαντικά με αυστηρή αναλογία είκοσι επτά.", B: "Η εξωκυτταρική συγκέντρωση είναι ακριβώς πέντε φορές μεγαλύτερη του εσωτερικού.", C: "Η ενδοκυτταρική συγκέντρωση είναι ακριβώς δεκατέσσερις φορές μικρότερη της εξωκυτταρικής.", D: "Η ενδοκυτταρική συγκέντρωση είναι ακριβώς έντεκα φορές μικρότερη της εξωκυτταρικής." }, correct: "D", rationale: "α) Σωστό: Το χλώριο (Cl-) βρίσκεται σε αναλογία 1:11 (εσωτερικό προς εξωτερικό). β) Λάθος: Η αναλογία του καλίου είναι 27:1 (Α). Η αναλογία του νατρίου είναι 1:14 (Γ). Το 1:5 (Β) δεν προκύπτει από κανένα ιοντικό ισοζύγιο του κεφαλαίου. γ) Παραπομπή: Κεφ. 2, Πίνακας 3.1, Σελ. 37." },
            { id: 49, question: "Πώς ορίζεται βιολογικά το δυναμικό δράσης που μεταδίδεται κατά μήκος του νευράξονα για τη μεταφορά νευρικών παλμών;", options: { A: "Είναι ένα κύμα παροδικής εκπόλωσης της νευρικής μεμβράνης διατηρώντας σταθερό μέγεθος.", B: "Αποτελεί μια μόνιμη δομική υπερπόλωση της νευρικής μεμβράνης λόγω της μυελίνης.", C: "Είναι η σταθερή διατήρηση ηλεκτραρνητικότητας κατά μήκος ολόκληρου του αδιέγερτου νευράξονα.", D: "Αποτελεί μια εκτεταμένη παροδική απώλεια ολόκληρου του μονωτικού ελύτρου της μυελίνης." }, correct: "A", rationale: "α) Σωστό: Το δυναμικό δράσης ορίζεται ως κύμα ηλεκτρικής δραστηριότητας (εκπόλωσης) που διατηρεί απολύτως σταθερό το μέγεθός του κατά τη μετάδοση. β) Λάθος: Δεν είναι υπερπόλωση (Β) ούτε διατήρηση ηρεμίας/ηλεκτραρνητικότητας (Γ), και προφανώς δεν καταστρέφει το έλυτρο (Δ). γ) Παραπομπή: Κεφ. 2, Δυναμικό δράσης, Σελ. 39." },
            { id: 50, question: "Στην αδιέγερτη νευρική ίνα (κατάσταση ηρεμίας), ποιος φραγμός εμποδίζει συγκεκριμένα τη μαζική διέλευση των ιόντων νατρίου ενδοκυτταρικά;", options: { A: "Ο υδρόφοβος φραγμός των ελεύθερων φωσφολιπιδίων αποτρέπει απόλυτα τη δίοδο.", B: "Η πύλη ενεργοποίησης των καναλιών νατρίου η οποία παραμένει κλειστή.", C: "Η πύλη αδρανοποίησης των καναλιών καλίου η οποία παραμένει κλειστή.", D: "Ο ισχυρός ηλεκτροστατικός φραγμός ο οποίος δημιουργείται από το χλώριο." }, correct: "B", rationale: "α) Σωστό: Στη φάση ηρεμίας, ο μοριακός φραγμός του καναλιού είναι η πύλη ενεργοποίησης, η οποία παραμένει αυστηρά κλειστή. β) Λάθος: Η αδρανοποίηση του καλίου (Γ) είναι ανύπαρκτη έννοια. Ο υδρόφοβος φραγμός (Α) δεν ρυθμίζει το άνοιγμα-κλείσιμο, και το χλώριο (Δ) δεν αποτελεί τον ρυθμιστικό φραγμό των καναλιών Na+. γ) Παραπομπή: Κεφ. 2, Ερέθισμα, Σελ. 39." },
            { id: 51, question: "Ποια εγγενής μοριακή λειτουργία καθιστά πρακτικά αδύνατη την άμεση ανταπόκριση του νεύρου σε ένα διαδοχικό ισχυρό ερέθισμα;", options: { A: "Το παρατεταμένο μπλοκάρισμα της αντλίας νατρίου από την περίσσεια καλίου.", B: "Το καθυστερημένο άνοιγμα της πύλης ενεργοποίησης όλων των καναλιών καλίου.", C: "Η πλήρης απόφραξη των καναλιών νατρίου από την πύλη αδρανοποίησης.", D: "Η προσωρινή κατάρρευση της υδρόφοβης φωσφολιπιδικής διπλοστιβάδας από την εκπόλωση." }, correct: "C", rationale: "α) Σωστό: Στην απόλυτα ανερέθιστη περίοδο, κανένα ερέθισμα δεν μπορεί να προκαλέσει διέγερση λόγω της φυσικής απόφραξης των καναλιών Na+ από την πύλη αδρανοποίησης. β) Λάθος: Η αντλία δεν μπλοκάρεται (Α). Η μεμβράνη σίγουρα δεν καταρρέει (Δ) κατά τη λειτουργία της. γ) Παραπομπή: Κεφ. 2, Απόλυτα ανερέθιστη περίοδος, Σελ. 42." },
            { id: 52, question: "Με ποιον ακριβώς φυσικό μηχανισμό επιτυγχάνεται το φαινόμενο της συνεχόμενης αγωγιμότητας του ερεθίσματος μέσα σε μία αμύελη ίνα;", options: { A: "Με παθητική ώθηση ιόντων χλωρίου προς την εξωτερική νευρική μεμβράνη.", B: "Με ηλεκτρικά άλματα δυναμικού αποκλειστικά από μία περίσφιξη στην άλλη.", C: "Μέσω της ταχείας διαδοχικής ενεργοποίησης αναρίθμητων γειτονικών τασεοεξαρτώμενων καναλιών ασβεστίου.", D: "Μέσω δημιουργίας τοπικών κυκλικών ρευμάτων προς τα αδιέγερτα γειτονικά τμήματα." }, correct: "D", rationale: "α) Σωστό: Στις αμύελες, η μετάδοση επιτυγχάνεται επειδή η ήδη εκπολωμένη περιοχή δημιουργεί τοπικά κυκλικά ρεύματα προς την αδιέγερτη γειτονική της. β) Λάθος: Η κατά άλματα αγωγή (Β) αφορά αποκλειστικά τις εμμύελες ίνες. Τα κανάλια ασβεστίου (Γ) δεν σχετίζονται με τη μετάδοση στον νευράξονα. γ) Παραπομπή: Κεφ. 2, Μετάδοση διέγερσης, Σελ. 42." },
            { id: 53, question: "Σύμφωνα με την κλινική ταξινόμηση της οδοντιατρικής, τι ακριβώς επιτυγχάνεται μέσω της αναισθησίας με επιφανειακή εφαρμογή (τζελ);", options: { A: "Προκαλείται επιφανειακή απώλεια αίσθησης χωρίς απώλεια της γενικής ανθρώπινης συνείδησης.", B: "Αποκλείεται το κεντρικό νευρικό στέλεχος και όλοι οι επιμέρους κλάδοι.", C: "Επιτυγχάνεται πλήρης καταστολή ολόκληρου του οδοντικού πολφού μέσω βαθιάς διήθησης.", D: "Αναστέλλεται μόνιμα η νευρική αγωγιμότητα σε τεράστιες εν τω βάθει περιοχές." }, correct: "A", rationale: "α) Σωστό: Η επιφανειακή αναισθησία προκαλεί τοπική καταστολή αίσθησης παρακάμπτοντας τη μεταβολή της συνείδησης. β) Λάθος: Ο αποκλεισμός στελέχους (Β) είναι στελεχιαία. Η βαθιά διήθηση (Γ) είναι δι' εμποτίσεως. Η επιφανειακή δεν φτάνει στους εν τω βάθει ιστούς και δεν είναι μόνιμη (Δ). γ) Παραπομπή: Κεφ. 1, Οδοί χορήγησης (Επιφανειακή), Σελ. 29." },
            { id: 54, question: "Ποια οργανική σχέση χαρακτηρίζει τον σχηματισμό της μυελίνης από τα εξειδικευμένα υποστηρικτικά κύτταρα του περιφερικού νευρικού συστήματος;", options: { A: "Κάθε κύτταρο του Schwann περιβάλλει αποκλειστικά όλους τους αμύελους άξονες.", B: "Το κύτταρο του Schwann περιβάλλει ελικοειδώς τον άξονα δημιουργώντας χάσματα.", C: "Τα κύτταρα της νευρογλοίας απουσιάζουν πλήρως από τον συγκεκριμένο ιστό.", D: "Η μυελίνη παράγεται απευθείας από τις απολήξεις των δενδριτικών κυττάρων." }, correct: "B", rationale: "α) Σωστό: Η μυελίνη αποτελεί λιποπρωτεΐνη του κυττάρου του Schwann το οποίο περιβάλλει ελικοειδώς τον άξονα και διακόπτεται στα χάσματα (Ranvier). β) Λάθος: Η (Α) είναι λάθος, διότι τα Schwann τυλίγουν πολλούς άξονες στις αμύελες, χωρίς να σχηματίζουν έλυτρο. Οι δενδρίτες δεν παράγουν μυελίνη (Δ). γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 32." },
            { id: 55, question: "Κατά την πλήρη κατάσταση ηρεμίας της νευρικής ίνας, ποια είναι η δυναμική συμπεριφορά των ιόντων του καλίου;", options: { A: "Εισέρχονται μαζικά στο εσωτερικό δημιουργώντας το λεγόμενο κρίσιμο δυναμικό εκπόλωσης.", B: "Μπλοκάρονται απολύτως από την πύλη ενεργοποίησης στο εξωτερικό κυτταρικό υγρό.", C: "Έχουν τη φυσική τάση να κινηθούν ελεύθερα προς το εξωτερικό.", D: "Ωθούνται αποκλειστικά προς το εσωτερικό λόγω απόλυτης ηλεκτροστατικής απώθησης αιχμής." }, correct: "C", rationale: "α) Σωστό: Στην ηρεμία, η μεμβράνη είναι ελεύθερα διαπερατή στο κάλιο, το οποίο τείνει (λόγω υψηλής εσωτερικής συγκέντρωσης) να εξέλθει. β) Λάθος: Το κάλιο δεν προκαλεί την εκπόλωση (Α). Η πύλη ενεργοποίησης αφορά το νάτριο (Β). γ) Παραπομπή: Κεφ. 2, Νευροφυσιολογία, Σελ. 36." },
            { id: 56, question: "Σύμφωνα με την ακαδημαϊκή ταξινόμηση, ποιο συγκεκριμένο ανατομικό προφίλ χαρακτηρίζει αποκλειστικά τις νευρικές ίνες του τύπου Β;", options: { A: "Είναι πολύ λεπτές, απολύτως αμύελες και άγουν εξαιρετικά αργά.", B: "Είναι πολύ παχιές, εμφανίζουν μυελίνη και άγουν εξαιρετικά γρήγορα.", C: "Είναι μεσαίες αμύελες με τεράστια διαστήματα ενδιάμεσων περισφίξεων Ranvier.", D: "Έχουν μικρή διάμετρο, μικρότερα διαστήματα περισφίξεων και μέτρια ταχύτητα." }, correct: "D", rationale: "α) Σωστό: Οι ίνες τύπου Β χαρακτηρίζονται από μικρή διάμετρο, μικρά διαστήματα περισφίξεων και μέτρια ταχύτητα. β) Λάθος: Οι λεπτές/αμύελες/αργές (Α) είναι οι C. Οι παχιές/γρήγορες (Β) είναι οι Α. γ) Παραπομπή: Κεφ. 2, Ταξινόμηση ινών, Σελ. 35." },
            { id: 57, question: "Σε ποιες συγκεκριμένες περιπτώσεις κρίνεται επιστημονικά αναγκαία η χρήση γενικής αναισθησίας στο πλαίσιο της συνήθους οδοντιατρικής πράξης;", options: { A: "Μόνο σε εξαιρετικά μη συνεργάσιμους ασθενείς όπως παιδιά ή ειδικές ανάγκες.", B: "Αποκλειστικά στις πολύπλοκες επεμβάσεις που αφορούν τη σκληρή αδαμαντίνη των δοντιών.", C: "Κατά κανόνα σε κάθε συνήθη ενδοδοντική θεραπεία για τον απόλυτο έλεγχο.", D: "Όταν απαιτείται παρατεταμένη επιφανειακή αναισθητοποίηση των μαλακών ιστών στην ευρύτερη περιοχή." }, correct: "A", rationale: "α) Σωστό: Η γενική αναισθησία και η ενσυνείδητη καταστολή περιορίζονται κυρίως σε εξαιρετικά μη συνεργάσιμα παιδιά ή ΑΜΕΑ. β) Λάθος: Για σκληρούς/μαλακούς ιστούς (Β, Δ) και ενδοδοντία (Γ) εφαρμόζεται κατά συντριπτική πλειοψηφία τοποπεριοχική/τοπική αναισθησία. γ) Παραπομπή: Κεφ. 1, Οδοντιατρική αναισθησιολογία, Σελ. 30." },
            { id: 58, question: "Ποια εσωτερική ηλεκτρική παράμετρος μειώνεται σημαντικά καθώς αυξάνεται η διάμετρος του νευράξονα, επιταχύνοντας με αυτόν τον τρόπο τη νευρική αγωγή;", options: { A: "Η πυκνότητα των μεμβρανικών πρωτεϊνών μειώνεται αυξάνοντας την ταχύτητα.", B: "Η εσωτερική αντίσταση του αξονοπλάσματος μειώνεται, επιτρέποντας ταχύτερη ροή.", C: "Η εξωτερική ηλεκτροστατική απώθηση του καλίου μειώνεται πάρα πολύ.", D: "Η συνολική χωρητικότητα της μεμβράνης ελαττώνεται περιορίζοντας τα ρεύματα." }, correct: "B", rationale: "α) Σωστό: Καθώς αυξάνεται η διάμετρος του άξονα μειώνεται η εσωτερική ηλεκτρική αντίσταση του αξονοπλάσματος, αυξάνοντας την ταχύτητα. β) Λάθος: Ούτε οι πρωτεΐνες (Α), ούτε το κάλιο (Γ), ούτε η χωρητικότητα (Δ) αποτελούν τον εσωτερικό παράγοντα που ρυθμίζεται από τη διάμετρο. γ) Παραπομπή: Κεφ. 2, Μετάδοση της διέγερσης, Σελ. 42." },
            { id: 59, question: "Τι ακριβώς εντοπίζεται σε εξαιρετικά μεγάλη συγκέντρωση στις γυμνές περισφίξεις του Ranvier, διευκολύνοντας τη βιολογική αγωγιμότητα;", options: { A: "Πλήθος ισχυρών τασεοεξαρτώμενων ιοντικών καναλιών για ελεύθερη εκροή καλίου.", B: "Πυκνό δίκτυο ισχυρών αρτηριακών αναστομώσεων για τη μεταφορά οξυγόνου.", C: "Μεγάλος αριθμός τασεοεξαρτώμενων καναλιών νατρίου για την άμεση εκπόλωση.", D: "Ισχυρό στρώμα πυκνών φωσφολιπιδίων για τον απόλυτο ηλεκτρικό αποκλεισμό." }, correct: "C", rationale: "α) Σωστό: Στις περισφίξεις συγκεντρώνονται σχεδόν αποκλειστικά τα κανάλια νατρίου, επιτρέποντας την ταχύτατη (αλματώδη) εκπόλωση. β) Λάθος: Δεν συγκεντρώνονται αρτηρίες (Β) ούτε φωσφολιπίδια αποκλεισμού (Δ) σε αυτά τα μικροσκοπικά χάσματα. γ) Παραπομπή: Κεφ. 2, Δομή νευρικού ιστού, Σελ. 33." },
            { id: 60, question: "Με ποιους δύο βασικούς μηχανισμούς εφαρμόζουν τη φαρμακολογική δράση τους τα τοπικά αναισθητικά στον νευρικό ιστό του ασθενούς;", options: { A: "Μέσω χορήγησης ειδικών εισπνεόμενων αερίων ή ενδοφλέβιων ηρεμιστικών σκευασμάτων.", B: "Μέσω της ταχείας ηλεκτρικής καταστολής όλων των κεντρικών συνάψεων.", C: "Μέσω της αναστολής των ιόντων ασβεστίου στον κινητικό φλοιό.", D: "Μέσω της τοπικής επιφανειακής εφαρμογής ή με υποδερμική έγχυση." }, correct: "D", rationale: "α) Σωστό: Τα τοπικά αναισθητικά δρουν αυστηρά τοπικά, είτε με επιφανειακή εφαρμογή (π.χ. αλοιφές/τζελ) είτε με υποδερμική έγχυση (διήθηση). β) Λάθος: Τα εισπνεόμενα/ενδοφλέβια (Α) ανήκουν στη γενική/καταστολή. Τα (Β, Γ) περιγράφουν κεντρικούς μηχανισμούς του εγκεφάλου. γ) Παραπομπή: Κεφ. 1, Οδοί χορήγησης, Σελ. 29." }
        ];

        let currentQuestionIndex = 0;
        let isAnswered = false;

        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackPanel = document.getElementById('feedback-panel');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackRationale = document.getElementById('feedback-rationale');
        const feedbackReference = document.getElementById('feedback-reference');
        const nextBtn = document.getElementById('next-btn');
        const progressFill = document.getElementById('progress-fill');
        const questionCounter = document.getElementById('question-counter');

        function loadQuestion() {
            isAnswered = false;
            feedbackPanel.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsGrid.innerHTML = '';
            
            const currentQ = mcqData[currentQuestionIndex];
            questionText.textContent = currentQ.question;
            questionCounter.textContent = `Ερώτηση ${currentQuestionIndex + 1} / ${mcqData.length}`;
            progressFill.style.width = `${((currentQuestionIndex + 1) / mcqData.length) * 100}%`;

            Object.entries(currentQ.options).forEach(([key, value]) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-prefix">${key}</span> ${value}`;
                btn.onclick = () => selectOption(key, btn, currentQ);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(selectedKey, selectedBtn, questionData) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.add('locked');
                const prefix = btn.querySelector('.option-prefix').textContent;
                if (prefix === questionData.correct) {
                    btn.classList.add('correct');
                }
            });

            if (selectedKey !== questionData.correct) {
                selectedBtn.classList.add('wrong');
                feedbackTitle.textContent = "Λάθος Απάντηση";
                feedbackTitle.className = "title-wrong";
            } else {
                feedbackTitle.textContent = "Σωστή Απάντηση";
                feedbackTitle.className = "title-correct";
            }

            const rationaleParts = questionData.rationale.split('γ) Παραπομπή: ');
            feedbackRationale.textContent = rationaleParts[0].trim();
            feedbackReference.textContent = "Παραπομπή: " + (rationaleParts[1] ? rationaleParts[1].trim() : "");
            
            feedbackPanel.classList.remove('hidden');
            
            if (currentQuestionIndex < mcqData.length - 1) {
                nextBtn.classList.remove('hidden');
                nextBtn.textContent = 'Επόμενη Ερώτηση';
            } else {
                nextBtn.classList.remove('hidden');
                nextBtn.textContent = 'Ολοκλήρωση';
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < mcqData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                questionText.textContent = "Ολοκληρώσατε το Test!";
                optionsGrid.innerHTML = "";
                feedbackPanel.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
        });

        // Εκκίνηση της εφαρμογής
        loadQuestion();
    </script>
</body>
</html>
